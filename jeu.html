<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>ZENTRO DRIVE — Monde Libre</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070b;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
}

#loading{

    position:fixed;

    inset:0;

    background:
        radial-gradient(circle,#15243b,#03050a);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    color:white;

    z-index:1000;

}

#loading h1{

    font-size:42px;

    letter-spacing:7px;

    margin:0 0 10px;

}

#loading p{

    color:#8c9aad;

}

#game{

    position:fixed;

    inset:0;

}

#hud{

    position:fixed;

    top:18px;

    left:18px;

    z-index:20;

    color:white;

    pointer-events:none;

}

#speed{

    font-size:42px;

    font-weight:900;

}

#kmh{

    color:#8994a6;

    font-size:14px;

}

#carName{

    margin-top:6px;

    color:#4ba3ff;

    font-weight:bold;

}

#fps{

    margin-top:5px;

    color:#78ff9c;

    font-size:13px;

}

#menu{

    position:fixed;

    top:18px;

    right:18px;

    z-index:30;

    padding:11px 16px;

    border-radius:10px;

    background:rgba(8,13,22,.85);

    border:1px solid rgba(255,255,255,.15);

    color:white;

    text-decoration:none;

    font-weight:bold;

}

#menu:hover{

    background:#168cff;

}

#controls{

    position:fixed;

    bottom:25px;

    left:50%;

    transform:translateX(-50%);

    display:grid;

    grid-template-columns:70px 70px 70px;

    grid-template-rows:65px 65px;

    gap:8px;

    z-index:40;

}

.control{

    border:none;

    border-radius:18px;

    background:rgba(10,16,26,.75);

    border:1px solid rgba(255,255,255,.15);

    color:white;

    font-size:25px;

    backdrop-filter:blur(8px);

    touch-action:none;

}

.control:active{

    background:#168cff;

}

.empty{

    visibility:hidden;

}

#reset{

    position:fixed;

    bottom:20px;

    right:20px;

    z-index:30;

    padding:10px 15px;

    border:none;

    border-radius:9px;

    color:white;

    background:rgba(10,15,24,.8);

}

@media(min-width:800px){

    #controls{

        opacity:.25;

        transition:.2s;

    }

    #controls:hover{

        opacity:1;

    }

}

</style>

</head>


<body>


<div id="loading">

<h1>ZENTRO</h1>

<p>Chargement du monde libre...</p>

</div>


<div id="game"></div>


<div id="hud">

<div id="speed">0</div>

<div id="kmh">KM/H</div>

<div id="carName">Golf R</div>

<div id="fps">FPS : --</div>

</div>


<a
href="index.html"
id="menu"
>
🏠 MENU
</a>


<button
id="reset"
>
↻ RESET
</button>


<div id="controls">

<button class="control empty"></button>

<button class="control" data-key="forward">
▲
</button>

<button class="control empty"></button>

<button class="control" data-key="left">
◀
</button>

<button class="control" data-key="back">
▼
</button>

<button class="control" data-key="right">
▶
</button>

</div>


<script type="importmap">

{

"imports":{

"three":
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"

}

}

</script>


<script type="module">

import * as THREE
from "three";


/* =====================================================
   CONFIGURATION
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x91a7bd);

scene.fog =
    new THREE.Fog(
        0x91a7bd,
        120,
        600
    );


const camera =
    new THREE.PerspectiveCamera(
        65,
        innerWidth / innerHeight,
        .1,
        1000
    );


const renderer =
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });


renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.25
    )
);

renderer.shadowMap.enabled = false;

document
.getElementById("game")
.appendChild(renderer.domElement);


/* =====================================================
   LUMIÈRE
===================================================== */

const hemi =
    new THREE.HemisphereLight(
        0xddeeff,
        0x38404c,
        2.0
    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    100,
    150,
    80
);

scene.add(sun);


/* =====================================================
   SOL
===================================================== */

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            1200,
            1200
        ),

        new THREE.MeshLambertMaterial({
            color:0x4b6347
        })

    );

ground.rotation.x =
    -Math.PI / 2;

scene.add(ground);


/* =====================================================
   ROUTES
===================================================== */

const roadMaterial =
    new THREE.MeshLambertMaterial({
        color:0x22252b
    });

const lineMaterial =
    new THREE.MeshBasicMaterial({
        color:0xd6d6d6
    });


function createRoad(
    x,
    z,
    width,
    length,
    rotation=0
){

    const road =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                .05,
                length
            ),

            roadMaterial

        );

    road.position.set(
        x,
        .025,
        z
    );

    road.rotation.y =
        rotation;

    scene.add(road);


    const line =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .25,
                .06,
                length
            ),

            lineMaterial

        );

    line.position.set(
        x,
        .06,
        z
    );

    line.rotation.y =
        rotation;

    scene.add(line);

}


/* grandes routes */

createRoad(
    0,
    0,
    28,
    1100
);

createRoad(
    0,
    0,
    1100,
    28
);

createRoad(
    250,
    0,
    20,
    1100
);

createRoad(
    -250,
    0,
    20,
    1100
);

createRoad(
    0,
    250,
    1100,
    20
);

createRoad(
    0,
    -250,
    1100,
    20
);


/* =====================================================
   BÂTIMENTS
===================================================== */

const buildingMaterials = [

    new THREE.MeshLambertMaterial({
        color:0x78818e
    }),

    new THREE.MeshLambertMaterial({
        color:0x5f6a78
    }),

    new THREE.MeshLambertMaterial({
        color:0x87909a
    }),

    new THREE.MeshLambertMaterial({
        color:0x4e5967
    })

];


function building(
    x,
    z,
    w,
    d,
    h
){

    const material =
        buildingMaterials[
            Math.floor(
                Math.random() *
                buildingMaterials.length
            )
        ];

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                w,
                h,
                d
            ),

            material

        );

    mesh.position.set(
        x,
        h/2,
        z
    );

    scene.add(mesh);

}


/* création ville légère */

for(
    let x=-500;
    x<=500;
    x+=50
){

    for(
        let z=-500;
        z<=500;
        z+=50
    ){

        if(
            Math.abs(x)<35 ||
            Math.abs(z)<35 ||
            Math.abs(x-250)<25 ||
            Math.abs(x+250)<25 ||
            Math.abs(z-250)<25 ||
            Math.abs(z+250)<25
        ){
            continue;
        }

        const w =
            25 +
            Math.random()*15;

        const d =
            25 +
            Math.random()*15;

        const h =
            15 +
            Math.random()*70;

        building(
            x,
            z,
            w,
            d,
            h
        );

    }

}


/* =====================================================
   ARBRES
===================================================== */

function tree(x,z){

    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .8,
                1,
                6,
                8
            ),

            new THREE.MeshLambertMaterial({
                color:0x59402c
            })

        );

    trunk.position.set(
        x,
        3,
        z
    );

    scene.add(trunk);


    const leaves =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                4.5,
                8,
                6
            ),

            new THREE.MeshLambertMaterial({
                color:0x315d35
            })

        );

    leaves.position.set(
        x,
        8,
        z
    );

    scene.add(leaves);

}


for(
    let i=0;
    i<100;
    i++
){

    const x =
        (Math.random()-.5)*1000;

    const z =
        (Math.random()-.5)*1000;

    if(
        Math.abs(x)<45 ||
        Math.abs(z)<45
    ){
        continue;
    }

    tree(x,z);

}


/* =====================================================
   VOITURE
===================================================== */

const car =
    new THREE.Group();

scene.add(car);


const selectedCar =
    localStorage.getItem(
        "zentroCar"
    ) || "Golf R";


const selectedColor =
    localStorage.getItem(
        "zentroColor"
    ) || "black";


document
.getElementById("carName")
.textContent =
    selectedCar;


/* couleurs */

const colors = {

    black:0x11151b,

    white:0xe7e9ec,

    red:0xd7192b,

    blue:0x168cff,

    orange:0xff6b00

};


const bodyColor =
    colors[selectedColor]
    || colors.black;


/* carrosserie */

const bodyMaterial =
    new THREE.MeshPhysicalMaterial({

        color:bodyColor,

        metalness:.75,

        roughness:.25,

        clearcoat:.7

    });


const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.15,
            .65,
            4.4
        ),

        bodyMaterial

    );

body.position.y =
    .72;

car.add(body);


/* toit */

const roof =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.75,
            .5,
            2.25
        ),

        bodyMaterial

    );

roof.position.set(
    0,
    1.18,
    -.15
);

car.add(roof);


/* vitres */

const glassMaterial =
    new THREE.MeshBasicMaterial({
        color:0x102033
    });


const glass =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.55,
            .38,
            1.9
        ),

        glassMaterial

    );

glass.position.set(
    0,
    1.22,
    -.15
);

car.add(glass);


/* roues */

const wheelMaterial =
    new THREE.MeshLambertMaterial({
        color:0x101216
    });


const rimMaterial =
    new THREE.MeshLambertMaterial({
        color:0x8e96a1
    });


const wheels=[];


function createWheel(
    x,
    z
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        .48,
        z
    );


    const tire =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .43,
                .43,
                .28,
                16
            ),

            wheelMaterial

        );

    tire.rotation.z =
        Math.PI/2;

    group.add(tire);


    const rim =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .22,
                .22,
                .30,
                12
            ),

            rimMaterial

        );

    rim.rotation.z =
        Math.PI/2;

    group.add(rim);

    car.add(group);

    wheels.push(group);

}


createWheel(-1.08,-1.45);
createWheel(1.08,-1.45);
createWheel(-1.08,1.45);
createWheel(1.08,1.45);


/* =====================================================
   PHARES
===================================================== */

const headlightMaterial =
    new THREE.MeshBasicMaterial({
        color:0xffffff
    });


const leftHead =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .45,
            .16,
            .05
        ),

        headlightMaterial

    );

leftHead.position.set(
    -.65,
    .78,
    -2.23
);

car.add(leftHead);


const rightHead =
    leftHead.clone();

rightHead.position.x =
    .65;

car.add(rightHead);


/* =====================================================
   FEUX ARRIÈRE
===================================================== */

const rearMaterial =
    new THREE.MeshBasicMaterial({
        color:0xff1020
    });


const rear1 =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .45,
            .16,
            .05
        ),

        rearMaterial

    );

rear1.position.set(
    -.65,
    .78,
    2.23
);

car.add(rear1);


const rear2 =
    rear1.clone();

rear2.position.x =
    .65;

car.add(rear2);


/* =====================================================
   ÉCHAPPEMENTS
===================================================== */

const exhaustMaterial =
    new THREE.MeshBasicMaterial({
        color:0x444444
    });


function exhaust(x){

    const pipe =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .10,
                .10,
                .35,
                10
            ),

            exhaustMaterial

        );

    pipe.rotation.x =
        Math.PI/2;

    pipe.position.set(
        x,
        .55,
        2.25
    );

    car.add(pipe);


    const flame =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                .10,
                .55,
                8
            ),

            new THREE.MeshBasicMaterial({
                color:0xff6a00,
                transparent:true,
                opacity:0
            })

        );

    flame.rotation.x =
        -Math.PI/2;

    flame.position.set(
        x,
        .55,
        2.58
    );

    car.add(flame);

    return flame;

}


const flame1 =
    exhaust(-.42);

const flame2 =
    exhaust(.42);


/* =====================================================
   PHYSIQUE
===================================================== */

let speed=0;

let steering=0;

let rotation=0;

const maxSpeed=55;

const acceleration=30;

const braking=45;

const reverseSpeed=-18;


/* =====================================================
   TOUCHES
===================================================== */

const keys={

    forward:false,
    back:false,
    left:false,
    right:false

};


window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="w" ||
            e.key==="ArrowUp"
        ){
            keys.forward=true;
        }

        if(
            e.key==="s" ||
            e.key==="ArrowDown"
        ){
            keys.back=true;
        }

        if(
            e.key==="a" ||
            e.key==="ArrowLeft"
        ){
            keys.left=true;
        }

        if(
            e.key==="d" ||
            e.key==="ArrowRight"
        ){
            keys.right=true;
        }

    }
);


window.addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="w" ||
            e.key==="ArrowUp"
        ){
            keys.forward=false;
        }

        if(
            e.key==="s" ||
            e.key==="ArrowDown"
        ){
            keys.back=false;
        }

        if(
            e.key==="a" ||
            e.key==="ArrowLeft"
        ){
            keys.left=false;
        }

        if(
            e.key==="d" ||
            e.key==="ArrowRight"
        ){
            keys.right=false;
        }

    }
);


/* =====================================================
   TOUCH
===================================================== */

document
.querySelectorAll(
    ".control[data-key]"
)
.forEach(button=>{

    const key =
        button.dataset.key;


    button.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            keys[key]=true;

        }
    );


    button.addEventListener(
        "pointerup",
        e=>{

            e.preventDefault();

            keys[key]=false;

        }
    );


    button.addEventListener(
        "pointercancel",
        ()=>{
            keys[key]=false;
        }
    );


    button.addEventListener(
        "pointerleave",
        ()=>{
            keys[key]=false;
        }
    );

});


/* =====================================================
   RESET
===================================================== */

document
.getElementById("reset")
.addEventListener(
    "click",
    ()=>{

        car.position.set(
            0,
            0,
            0
        );

        speed=0;

        rotation=0;

        car.rotation.y=0;

    }
);


/* =====================================================
   TEMPS
===================================================== */

let previous =
    performance.now();

let frames=0;

let fpsTime =
    performance.now();


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const now =
        performance.now();


    const dt =
        Math.min(
            (now-previous)/1000,
            .05
        );


    previous=now;


    /* accélération */

    if(keys.forward){

        speed +=
            acceleration*dt;

    }

    else if(keys.back){

        speed -=
            acceleration*dt;

    }

    else{

        if(speed>0){

            speed -=
                10*dt;

        }

        if(speed<0){

            speed +=
                10*dt;

        }

    }


    /* freinage */

    if(
        Math.abs(speed)>1 &&
        keys.back &&
        speed>0
    ){

        speed -=
            braking*dt;

    }


    speed =
        THREE.MathUtils.clamp(
            speed,
            reverseSpeed,
            maxSpeed
        );


    /* direction */

    if(
        Math.abs(speed)>1
    ){

        if(keys.left){

            steering +=
                2.2*dt;

        }

        else if(keys.right){

            steering -=
                2.2*dt;

        }

        else{

            steering *=
                .85;

        }

    }


    steering =
        THREE.MathUtils.clamp(
            steering,
            -1,
            1
        );


    rotation +=
        steering *
        speed *
        .025 *
        dt;


    car.rotation.y =
        rotation;


    /* déplacement */

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward.applyQuaternion(
        car.quaternion
    );


    car.position.addScaledVector(
        forward,
        speed*dt
    );


    /* roues */

    for(
        const wheel of wheels
    ){

        wheel.rotation.x -=
            speed*dt*1.8;

    }


    /* flammes */

    const flameVisible =
        keys.forward &&
        speed>12;


    flame1.material.opacity =
        flameVisible ?
        .8 : 0;

    flame2.material.opacity =
        flameVisible ?
        .8 : 0;


    /* caméra */

    const cameraOffset =
        new THREE.Vector3(
            0,
            4.2,
            8.5
        );

    cameraOffset.applyQuaternion(
        car.quaternion
    );


    const targetCamera =
        car.position.clone()
        .add(cameraOffset);


    camera.position.lerp(
        targetCamera,
        .08
    );


    const target =
        car.position.clone();

    target.y += .8;


    camera.lookAt(
        target
    );


    /* HUD */

    document
    .getElementById("speed")
    .textContent =
        Math.round(
            Math.abs(speed)*3.6
        );


    /* FPS */

    frames++;


    if(
        now-fpsTime>1000
    ){

        document
        .getElementById("fps")
        .textContent =
            "FPS : " + frames;

        frames=0;

        fpsTime=now;

    }


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =====================================================
   START
===================================================== */

setTimeout(()=>{

    document
    .getElementById("loading")
    .style.display="none";

},700);


animate();

</script>

</body>

</html>
