function roadLines(){

    const geo =
        new THREE.BoxGeometry(
            0.18,
            0.02,
            5
        );

    const mesh =
        new THREE.InstancedMesh(
            geo,
            lineMaterial,
            160
        );

    const dummy =
        new THREE.Object3D();

    let i = 0;

    for(
        let z=-700;
        z<=700 && i<160;
        z+=18
    ){

        dummy.position.set(
            0,
            0.08,
            z
        );

        dummy.updateMatrix();

        mesh.setMatrixAt(
            i,
            dummy.matrix
        );

        i++;

    }

    mesh.instanceMatrix.needsUpdate =
        true;

    mesh.computeBoundingSphere();

    scene.add(mesh);


    /* Horizontal */

    const geo2 =
        new THREE.BoxGeometry(
            5,
            0.02,
            0.18
        );

    const mesh2 =
        new THREE.InstancedMesh(
            geo2,
            lineMaterial,
            160
        );

    i = 0;

    for(
        let x=-700;
        x<=700 && i<160;
        x+=18
    ){

        dummy.position.set(
            x,
            0.081,
            0
        );

        dummy.updateMatrix();

        mesh2.setMatrixAt(
            i,
            dummy.matrix
        );

        i++;

    }

    mesh2.instanceMatrix.needsUpdate =
        true;

    mesh2.computeBoundingSphere();

    scene.add(mesh2);
}

let seed =

function random(){

    seed =
        (seed * 16807)
        % 2147483647;

    return (
        seed - 1
    ) / 2147483646;

}


/* =====================================================

const buildingMaterials = [

    new THREE.MeshBasicMaterial({
        color:0x59616a
    }),

    new THREE.MeshBasicMaterial({
        color:0x6c7076
    }),

    new THREE.MeshBasicMaterial({
        color:0x4b5964
    }),

    })

];


function createBuildings(){

    const geometry =
        new THREE.BoxGeometry(
            1,
            1,
            1
        );

    const total =
        100;

    const meshes =
        buildingMaterials.map(
            material =>
                new THREE.InstancedMesh(
                    geometry,
                    material,
                    25
                )
        );

    const dummy =
        new THREE.Object3D();

    let count = 0;

    while(
        count < total
    ){

        const x =
            Math.floor(
                random()*1200-600
            );

        const z =
            Math.floor(
                random()*1200-600
            );

        if(
            Math.abs(x)<35 ||
            Math.abs(z)<35
        ){

            continue;

        }

        let nearRoad =
            false;

        for(
            const p of roadPositions
        ){

            if(
                Math.abs(x-p)<12 ||
                Math.abs(z-p)<12
            ){

                nearRoad =
                    true;

                break;

            }

        }

        if(
            nearRoad
        ){

            continue;

        }

        const width =
            10 +
            random()*14;

        const depth =
            10 +
            random()*14;

        const height =
            7 +
            random()*30;

        dummy.position.set(
            x,
            height/2,
            z
        );

        dummy.scale.set(
            width,
            height,
            depth
        );

        dummy.rotation.y =
            random()>0.5
            ? Math.PI/2
            : 0;

        dummy.updateMatrix();

        const group =
            count % 4;

        const index =
            Math.floor(
                count/4
            );

        meshes[group]
            .setMatrixAt(
                index,
                dummy.matrix
            );

        count++;

    }

    for(
        const mesh of meshes
    ){

        mesh.instanceMatrix
            .needsUpdate = true;

        mesh.computeBoundingSphere();

        scene.add(mesh);

    }

}

function createTrees(){

    const trunkGeo =
        new THREE.CylinderGeometry(
            0.25,
            0.32,
            2.5,
            5
        );

    const leafGeo =
        new THREE.ConeGeometry(
            1.7,
            4.3,
            6
        );

    const trunkMat =
        new THREE.MeshBasicMaterial({
            color:0x503927
        });

    const leafMat =
        new THREE.MeshBasicMaterial({
            color:0x315c36
        });

    const count =
        55;

    const trunks =
        new THREE.InstancedMesh(
            trunkGeo,
            trunkMat,
            count
        );

    const leaves =
        new THREE.InstancedMesh(
            leafGeo,
            leafMat,
            count
        );

    const dummy =
        new THREE.Object3D();

    for(
        let i=0;
        i<count;
        i++
    ){

        let x;
        let z;

        do{

            x =
                random()*1200-600;

            z =
                random()*1200-600;

        }while(
            Math.abs(x)<40 ||
            Math.abs(z)<40
        );

        const scale =
            0.7 +
            random()*0.4;

        dummy.position.set(
            x,
            1.25,
            z
        );

        dummy.scale.setScalar(
            scale
        );

        dummy.updateMatrix();

        trunks.setMatrixAt(
            i,
            dummy.matrix
        );

        dummy.position.y =
            4;

        dummy.updateMatrix();

        leaves.setMatrixAt(
            i,
            dummy.matrix
        );

    }

    trunks.instanceMatrix
        .needsUpdate = true;

    leaves.instanceMatrix
        .needsUpdate = true;

    trunks.computeBoundingSphere();
    leaves.computeBoundingSphere();

    scene.add(trunks);
    scene.add(leaves);

}

const traffic = [];

function createTraffic(){

    const colors = [
        0xe53636,
        0x2c74dc,
        0xf1f1f1,
        0x20242a
    ];

    for(
        let i=0;
        i<5;
        i++
    ){

        const npc =
            new THREE.Group();

        const material =
            new THREE.MeshBasicMaterial({
                color:
                    colors[
                        i % colors.length
                    ]
            });

        const npcBody =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.85,
                    0.5,
                    3.7
                ),
                material
            );

        npc.add(npcBody);

        const npcRoof =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.35,
                    0.35,
                    1.8
                ),
                material
            );

        npcRoof.position.y =
            0.43;

        npc.add(npcRoof);


        if(
            i%2===0
        ){

            npc.position.set(
                -5.5,
                0.5,
                -500+i*160
            );

            npc.userData.axis =
                "z";

        }else{

            npc.position.set(
                -500+i*160,
                0.5,
                5.5
            );

            npc.userData.axis =
                "x";

        }

        npc.userData.speed =
            10+(i%3)*3;

        scene.add(npc);

        traffic.push(npc);

    }

}

function touch(
    id,
    key
){

    const element =
        document.getElementById(id);

    const down =
        e => {

            e.preventDefault();

            keys[key]=true;

        };

    const up =
        e => {

            e.preventDefault();

            keys[key]=false;

        };

    element.addEventListener(
        "pointerdown",
        down
    );

    element.addEventListener(
        "pointerup",
        up
    );

    element.addEventListener(
        "pointercancel",
        up
    );

    element.addEventListener(
        "pointerleave",
        up
    );

}

touch("left","left");
touch("right","right");
touch("accelerate","forward");
touch("brake","brake");


/* =====================================================
   PHYSIQUE
   ===================================================== */

let speed=0;
let steering=0;

function updateCar(delta){

    if(
        keys.forward
    ){

        speed +=
            27*delta;

    }
    else if(
        keys.backward
    ){

        speed -=
            20*delta;

    }
    else{

        speed *=
            Math.pow(
                0.035,
                delta
            );

    }


    if(
        keys.brake
    ){

        speed *=
            Math.pow(
                0.001,
                delta
            );

    }


    speed =
        THREE.MathUtils.clamp(
            speed,
            -14,
            48
        );


    let target=0;

    if(keys.left)
        target=1;

    if(keys.right)
        target=-1;


    steering =
        THREE.MathUtils.lerp(
            steering,
            target,
            1-Math.pow(
                0.001,
                delta
            )
        );


    const turn =
        1.8 *
        Math.min(
            1,
            Math.abs(speed)/10
        );


    car.rotation.y +=
        steering *
        turn *
        delta *
        Math.sign(
            speed || 1
        );


    const forward =
        new THREE.Vector3(
            0,
            0,
            1
        );

    forward.applyQuaternion(
        car.quaternion
    );

    car.position.addScaledVector(
        forward,
        speed*delta
    );


    car.position.x =
        THREE.MathUtils.clamp(
            car.position.x,
            -680,
            680
        );

    car.position.z =
        THREE.MathUtils.clamp(
            car.position.z,
            -680,
            680
        );


    car.rotation.z =
        THREE.MathUtils.lerp(
            car.rotation.z,
            -steering*0.035,
            delta*8
        );


    for(
        const wheel of wheels
    ){

        wheel.rotation.x -=
            speed*delta*1.7;

    }

}


/* =====================================================
   TRAFIC UPDATE
   ===================================================== */

function updateTraffic(delta){

    for(
        const npc of traffic
    ){

        const amount =
            npc.userData.speed *
            delta;

        if(
            npc.userData.axis==="z"
        ){

            npc.position.z +=
                amount;

            if(
                npc.position.z>680
            ){

                npc.position.z=-680;

            }

        }else{

            npc.position.x +=
                amount;

            if(
                npc.position.x>680
            ){

                npc.position.x=-680;

            }

        }

    }

}


/* =====================================================
   CAMERA
   ===================================================== */

const cameraTarget =
    new THREE.Vector3();

function updateCamera(delta){

    const offset =
        new THREE.Vector3(
            0,
            5.2,
            -10
        );

    offset.applyQuaternion(
        car.quaternion
    );

    const wanted =
        car.position
            .clone()
            .add(offset);

    camera.position.lerp(
        wanted,
        1-Math.pow(
            0.0005,
            delta
        )
    );

    cameraTarget.copy(
        car.position
    );

    cameraTarget.y +=
        0.75;

    camera.lookAt(
        cameraTarget
    );

}


/* =====================================================
   MINIMAP
   ===================================================== */

const mapCanvas =
    document.getElementById(
        "map"
    );

const mapContext =
    mapCanvas.getContext(
        "2d"
    );


function resizeMap(){

    mapCanvas.width =
        mapCanvas.clientWidth;

    mapCanvas.height =
        mapCanvas.clientHeight;

}

resizeMap();


function drawMap(){

    const w =
        mapCanvas.width;

    const h =
        mapCanvas.height;

    mapContext.clearRect(
        0,
        0,
        w,
        h
    );

    mapContext.fillStyle =
        "#101923";

    mapContext.fillRect(
        0,
        0,
        w,
        h
    );


    mapContext.strokeStyle =
        "#3b4650";

    mapContext.lineWidth=7;

    mapContext.beginPath();

    mapContext.moveTo(
        w/2,
        0
    );

    mapContext.lineTo(
        w/2,
        h
    );

    mapContext.moveTo(
        0,
        h/2
    );

    mapContext.lineTo(
        w,
        h/2
    );

    mapContext.stroke();


    const scale =
        w/1400;


    /* PNJ */

    mapContext.fillStyle =
        "#ff4c4c";

    for(
        const npc of traffic
    ){

        const x =
            w/2 +
            npc.position.x*scale;

        const y =
            h/2 +
            npc.position.z*scale;

        mapContext.fillRect(
            x-2,
            y-2,
            4,
            4
        );

    }


    /* joueur */

    const px =
        w/2 +
        car.position.x*scale;

    const py =
        h/2 +
        car.position.z*scale;

    mapContext.save();

    mapContext.translate(
        px,
        py
    );

    mapContext.rotate(
        -car.rotation.y
    );

    mapContext.fillStyle =
        "#4c91ff";

    mapContext.beginPath();

    mapContext.moveTo(
        0,
        -7
    );

    mapContext.lineTo(
        4,
        5
    );

    mapContext.lineTo(
        -4,
        5
    );

    mapContext.closePath();

    mapContext.fill();

    mapContext.restore();

}

let frameCount=0;
let fpsTime=0;
let mapTime=0;

function updateStats(delta){

    frameCount++;
    fpsTime+=delta;
    mapTime+=delta;

    if(
        fpsTime>=.5
    ){

        const fps =
            Math.round(
                frameCount/fpsTime
            );

        const info =
            renderer.info.render;

        statsText.textContent =
            "FPS "+fps+
            " · DRAW "+info.calls+
            " · TRI "+info.triangles;

        frameCount=0;
        fpsTime=0;

    }

    if(
        mapTime>=.1
    ){

        drawMap();

        mapTime=0;

    }

    speedText.textContent =
        Math.round(
            Math.abs(speed)*3.6
        )+
        " KM/H";

}

const clock =
    new THREE.Clock();

function animate(){

    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );

    if(!paused){

        updateCar(delta);

        updateTraffic(delta);

        updateCamera(delta);

        updateStats(delta);

    }

    renderer.render(
        scene,
        camera
    );

}
