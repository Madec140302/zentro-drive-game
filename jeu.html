<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZENTRO — Voitures</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#050609,#101722);
color:white;
min-height:100vh;
}

nav{
height:65px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
background:#080a0f;
border-bottom:1px solid #252a35;
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:4px;
}

nav a{
color:white;
text-decoration:none;
margin-left:15px;
font-size:13px;
}

nav a:hover{color:#4da3ff}

main{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

h1{
font-size:42px;
margin-bottom:5px;
}

.subtitle{
color:#8993a3;
margin-bottom:30px;
}

.cars{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:25px;
transition:.2s;
}

.card:hover{
transform:translateY(-5px);
border-color:#168cff;
}

.visual{
height:150px;
display:flex;
align-items:center;
justify-content:center;
font-size:90px;
}

h2{
margin:5px 0;
}

.stats{
color:#9da6b5;
line-height:1.8;
}

button{
width:100%;
padding:13px;
border:0;
border-radius:10px;
background:#168cff;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:12px;
}

button:hover{
background:#0876df;
}

.selected{
border:2px solid #168cff;
box-shadow:0 0 25px rgba(22,140,255,.15);
}

@media(max-width:700px){
.cars{grid-template-columns:1fr}
h1{font-size:32px}
}
</style>
</head>

<body>

<nav>

<div class="logo">ZENTRO</div>

<div>
<a href="index.html">🏠 ACCUEIL</a>
<a href="garage.html">🚗 GARAGE</a>
<a href="map.html">🗺️ MAP</a>
<a href="setting.html">⚙️ SETTINGS</a>
</div>

</nav>

<main>

<h1>🏎️ VOITURES</h1>
<div class="subtitle">Choisis ton véhicule</div>

<div class="cars">

<div class="card selected">

<div class="visual">🚗</div>

<h2>Golf R</h2>

<div class="stats">
⚡ 320 ch<br>
🏁 AWD<br>
🚀 0–100 km/h
</div>

<button onclick="selectCar('Golf R')">
SÉLECTIONNER
</button>

</div>


<div class="card">

<div class="visual">🏎️</div>

<h2>Sport GT</h2>

<div class="stats">
⚡ 380 ch<br>
🏁 RWD<br>
🚀 Haute vitesse
</div>

<button onclick="selectCar('Sport GT')">
SÉLECTIONNER
</button>

</div>


<div class="card">

<div class="visual">🚘</div>

<h2>City RS</h2>

<div class="stats">
⚡ 250 ch<br>
🏁 AWD<br>
🏙️ Ville
</div>

<button onclick="selectCar('City RS')">
SÉLECTIONNER
</button>

</div>


<div class="card">

<div class="visual">🏁</div>

<h2>Hyper X</h2>

<div class="stats">
⚡ 650 ch<br>
🏁 AWD<br>
🔥 Performance
</div>

<button onclick="selectCar('Hyper X')">
SÉLECTIONNER
</button>

</div>

</div>

</main>

<script>

function selectCar(name){

localStorage.setItem("zentroCar",name);

alert(name+" sélectionnée ! 🚗");

}

</script>

</body>
</html>
