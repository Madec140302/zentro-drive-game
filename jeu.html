<body>

<canvas id="game"></canvas>

<div id="loading">

<div id="hud">

    <button class="ctrl" id="brake">◀</button>
    <button class="ctrl" id="gas">▶</button>
</div>

<div id="pausePanel">
    <div class="panel">
        <h1>⏸️ ZENTRO</h1>
        <p>Jeu en pause</p>
        <button id="resume">▶ Reprendre</button>
        <button id="reset">↻ Recommencer</button>
        <button id="menu">🏠 Menu</button>
    </div>
</div>

<script type="module">

import * as THREE from "three";

const canvas = document.getElementById("game");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8fa7bc);
scene.fog = new THREE.Fog(0x8fa7bc,130,650);

const camera = new THREE.PerspectiveCamera(
    67,
    innerWidth/innerHeight,
    0.1,
    1200
);

camera.position.set(0,6,10);

const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;

/* =========================
   LUMIÈRES
========================= */

const hemi = new THREE.HemisphereLight(
    0xcfe4ff,
    0x4b5147,
    1.7
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
    0xffffff,
    1.7
);

sun.position.set(150,250,100);
scene.add(sun);

/* =========================
   SOL
========================= */

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1400,1400),
    new THREE.MeshLambertMaterial({
        color:0x68745e
    })
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);

/* =========================
   ROUTES
========================= */

const roadMat = new THREE.MeshLambertMaterial({
    color:0x292d32
});

const sidewalkMat = new THREE.MeshLambertMaterial({
    color:0x9a9a9a
});

function road(x,z,w,d){

    const r=new THREE.Mesh(
        new THREE.BoxGeometry(w,.08,d),
        roadMat
    );

    r.position.set(x,.04,z);
    scene.add(r);

    const s1=new THREE.Mesh(
        new THREE.BoxGeometry(w+.8,.12,2),
        sidewalkMat
    );

    s1.position.set(x,.09,z-d/2-1);
    scene.add(s1);

    const s2=s1.clone();
    s2.position.z=z+d/2+1;
    scene.add(s2);
}

road(0,0,28,1400);
road(0,250,1400,28);
road(0,-250,1400,28);
road(250,0,28,1400);
road(-250,0,28,1400);

/* lignes centrales */

const lineMat=new THREE.MeshBasicMaterial({
    color:0xf3e8a0
});

function roadLine(x,z,w,d){

    const line=new THREE.Mesh(
        new THREE.BoxGeometry(w,.1,d),
        lineMat
    );

    line.position.set(x,.1,z);
    scene.add(line);
}

for(let i=-650;i<650;i+=16){

    roadLine(0,i,.35,7);
    roadLine(250,i,.35,7);
    roadLine(-250,i,.35,7);

    roadLine(i,250,7,.35);
    roadLine(i,-250,7,.35);
}

/* =========================
   BÂTIMENTS
========================= */

const buildingMats=[
    0x7d8790,
    0x626d78,
    0x9a8e82,
    0x737b83,
    0x8c969e
].map(c=>new THREE.MeshLambertMaterial({color:c}));

function building(x,z){

    const w=16+Math.random()*22;
    const d=16+Math.random()*22;
    const h=15+Math.random()*70;

    const b=new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        buildingMats[
            Math.floor(Math.random()*buildingMats.length)
        ]
    );

    b.position.set(x,h/2,z);
    scene.add(b);
}

for(let x=-600;x<=600;x+=55){

    for(let z=-600;z<=600;z+=55){

        if(
            Math.abs(x)<40 ||
            Math.abs(z)<40 ||
            Math.abs(Math.abs(x)-250)<40 ||
            Math.abs(Math.abs(z)-250)<40
        ) continue;

        if(Math.random()<.82){
            building(
                x+(Math.random()-.5)*20,
                z+(Math.random()-.5)*20
            );
        }
    }
}

/* =========================
   ARBRES
========================= */

function tree(x,z){

    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(.5,.7,5,8),
        new THREE.MeshLambertMaterial({color:0x5b3924})
    );

    trunk.position.set(x,2.5,z);
    scene.add(trunk);

    const crown=new THREE.Mesh(
        new THREE.SphereGeometry(2.8,8,6),
        new THREE.MeshLambertMaterial({color:0x315c36})
    );

    crown.position.set(x,6,z);
    scene.add(crown);
}

for(let i=0;i<180;i++){

    const x=(Math.random()-.5)*1200;
    const z=(Math.random()-.5)*1200;

    if(
        Math.abs(x)<38 ||
        Math.abs(z)<38 ||
        Math.abs(Math.abs(x)-250)<38 ||
        Math.abs(Math.abs(z)-250)<38
    ) continue;

    tree(x,z);
}

/* =========================
   VOITURE JOUEUR
========================= */

const selectedCar=
    localStorage.getItem("zentroCar") || "Golf R";

const selectedColor=
    localStorage.getItem("zentroColor") || "black";

document.getElementById("carName").textContent=selectedCar;

const colors={
    black:0x111318,
    red:0xc92828,
    blue:0x246bdb,
    green:0x198754,
    white:0xe9edf2,
    orange:0xf07820
};

const player=new THREE.Group();
scene.add(player);

const bodyMat=new THREE.MeshStandardMaterial({
    color:colors[selectedColor] ?? colors.black,
    metalness:.55,
    roughness:.28
});

const body=new THREE.Mesh(
    new THREE.BoxGeometry(2.25,.65,4.5),
    bodyMat
);

body.position.y=.85;
player.add(body);

const roof=new THREE.Mesh(
    new THREE.BoxGeometry(1.65,.55,2.35),
    bodyMat
);

roof.position.set(0,1.28,-.05);
player.add(roof);

const glassMat=new THREE.MeshStandardMaterial({
    color:0x101c28,
    metalness:.25,
    roughness:.1,
    transparent:true,
    opacity:.82
});

const windshield=new THREE.Mesh(
    new THREE.BoxGeometry(1.45,.35,.12),
    glassMat
);

windshield.position.set(0,1.34,.82);
windshield.rotation.x=-.22;
player.add(windshield);

const wheelMat=new THREE.MeshStandardMaterial({
    color:0x101010,
    roughness:.75
});

const wheels=[];

for(const x of [-1.03,1.03]){

    for(const z of [-1.55,1.55]){

        const wheel=new THREE.Mesh(
            new THREE.CylinderGeometry(.42,.42,.28,16),
            wheelMat
        );

        wheel.rotation.z=Math.PI/2;
        wheel.position.set(x,.48,z);

        player.add(wheel);
        wheels.push(wheel);
    }
}

/* phares */

const lightMat=new THREE.MeshStandardMaterial({
    color:0xffffff,
    emissive:0xffffff,
    emissiveIntensity:2
});

for(const x of [-.68,.68]){

    const l=new THREE.Mesh(
        new THREE.BoxGeometry(.38,.18,.08),
        lightMat
    );

    l.position.set(x,.91,2.27);
    player.add(l);
}

/* =========================
   TRAFIC PNJ
========================= */

const traffic=[];

const trafficColors=[
    0xd63c3c,
    0x246bdb,
    0xe8e8e8,
    0x15171a,
    0xf08a24,
    0x2b9254
];

function createTrafficCar(){

    const g=new THREE.Group();

    const mat=new THREE.MeshStandardMaterial({
        color:trafficColors[
            Math.floor(Math.random()*trafficColors.length)
        ],
        metalness:.35,
        roughness:.4
    });

    const b=new THREE.Mesh(
        new THREE.BoxGeometry(1.8,.55,3.7),
        mat
    );

    b.position.y=.65;
    g.add(b);

    const r=new THREE.Mesh(
        new THREE.BoxGeometry(1.35,.45,1.9),
        mat
    );

    r.position.y=1.02;
    r.position.z=-.05;
    g.add(r);

    for(const x of [-.83,.83]){

        for(const z of [-1.25,1.25]){

            const w=new THREE.Mesh(
                new THREE.CylinderGeometry(.34,.34,.22,12),
                wheelMat
            );

            w.rotation.z=Math.PI/2;
            w.position.set(x,.35,z);
            g.add(w);
        }
    }

    scene.add(g);

    return g;
}

/* voies et sens de circulation */

const lanes=[
    {type:"z", value:-5, direction:1},
    {type:"z", value:5, direction:-1},
    {type:"z", value:245, direction:1},
    {type:"z", value:255, direction:-1},
    {type:"z", value:-245, direction:1},
    {type:"z", value:-255, direction:-1},

    {type:"x", value:-5, direction:-1},
    {type:"x", value:5, direction:1},
    {type:"x", value:245, direction:-1},
    {type:"x", value:255, direction:1},
    {type:"x", value:-245, direction:-1},
    {type:"x", value:-255, direction:1}
];

function spawnTraffic(index){

    const lane=lanes[
        index%lanes.length
    ];

    const car=createTrafficCar();

    const distance=(
        Math.random()*1200
    )-600;

    if(lane.type==="z"){

        car.position.set(
            lane.value,
            0,
            distance
        );

        car.rotation.y=
            lane.direction>0
            ? 0
            : Math.PI;

    }else{

        car.position.set(
            distance,
            0,
            lane.value
        );

        car.rotation.y=
            lane.direction>0
            ? Math.PI/2
            : -Math.PI/2;
    }

    traffic.push({
        mesh:car,
        lane,
        speed:12+Math.random()*15,
        distance
    });
}

for(let i=0;i<18;i++){
    spawnTraffic(i);
}

document.getElementById("trafficCount").textContent=
    "🚗 Trafic : "+traffic.length;

/* =========================
   CONTRÔLES
========================= */

const keys={};

addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;

    if(e.key==="Escape"){
        togglePause();
    }
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

const mobileButtons={
    left:"ArrowLeft",
    right:"ArrowRight",
    brake:" ",
    gas:"ArrowUp"
};

for(const [id,key] of Object.entries(mobileButtons)){

    const b=document.getElementById(id);

    b.addEventListener("pointerdown",e=>{
        e.preventDefault();
        keys[key]=true;
    });

    b.addEventListener("pointerup",e=>{
        e.preventDefault();
        keys[key]=false;
    });

    b.addEventListener("pointercancel",()=>{
        keys[key]=false;
    });

    b.addEventListener("pointerleave",()=>{
        keys[key]=false;
    });
}

/* =========================
   PHYSIQUE
========================= */

let speed=0;
let steer=0;

const maxSpeed=55;
const reverseSpeed=-18;
const acceleration=30;
const braking=45;
const friction=10;
const steeringPower=1.9;

let paused=false;

function updatePlayer(dt){

    if(paused) return;

    const gas=
        keys["w"] ||
        keys["arrowup"] ||
        keys["ArrowUp"];

    const brake=
        keys["s"] ||
        keys["arrowdown"] ||
        keys[" "];

    const left=
        keys["a"] ||
        keys["arrowleft"];

    const right=
        keys["d"] ||
        keys["arrowright"];

    if(gas){
        speed+=acceleration*dt;
    }else if(brake){
        speed-=braking*dt;
    }else{

        if(speed>0){
            speed=Math.max(
                0,
                speed-friction*dt
            );
        }

        if(speed<0){
            speed=Math.min(
                0,
                speed+friction*dt
            );
        }
    }

    speed=THREE.MathUtils.clamp(
        speed,
        reverseSpeed,
        maxSpeed
    );

    let targetSteer=0;

    if(left) targetSteer=1;
    if(right) targetSteer=-1;

    steer=THREE.MathUtils.lerp(
        steer,
        targetSteer,
        Math.min(1,dt*8)
    );

    const steeringAmount=
        steer*
        steeringPower*
        Math.min(1,Math.abs(speed)/12);

    player.rotation.y +=
        steeringAmount*dt;

    const forward=new THREE.Vector3(
        0,
        0,
        1
    );

    forward.applyQuaternion(
        player.quaternion
    );

    player.position.addScaledVector(
        forward,
        speed*dt
    );

    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -650,
            650
        );

    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -650,
            650
        );

    for(const wheel of wheels){
        wheel.rotation.x-=speed*dt*2.2;
    }

    document.getElementById("speed").textContent=
        Math.round(Math.abs(speed)*3.6);
}

/* =========================
   TRAFIC
========================= */

function updateTraffic(dt){

    for(const car of traffic){

        const dir=car.lane.direction;

        if(car.lane.type==="z"){

            car.mesh.position.z +=
                dir*car.speed*dt;

            car.mesh.rotation.y=
                dir>0 ? 0 : Math.PI;

        }else{

            car.mesh.position.x +=
                dir*car.speed*dt;

            car.mesh.rotation.y=
                dir>0 ? Math.PI/2 : -Math.PI/2;
        }

        if(car.mesh.position.x>700)
            car.mesh.position.x=-700;

        if(car.mesh.position.x<-700)
            car.mesh.position.x=700;

        if(car.mesh.position.z>700)
            car.mesh.position.z=-700;

        if(car.mesh.position.z<-700)
            car.mesh.position.z=700;
    }
}

/* =========================
   CAMÉRA
========================= */

const cameraTarget=new THREE.Vector3();

function updateCamera(dt){

    const desired=new THREE.Vector3(0,6.2,-10);

    desired.applyQuaternion(
        player.quaternion
    );

    desired.add(player.position);

    camera.position.lerp(
        desired,
        Math.min(1,dt*5)
    );

    cameraTarget.set(
        player.position.x,
        player.position.y+1,
        player.position.z
    );

    camera.lookAt(cameraTarget);
}

/* =========================
   PAUSE
========================= */

function togglePause(){

    paused=!paused;

    document.getElementById(
        "pausePanel"
    ).style.display=
        paused ? "flex" : "none";
}

document.getElementById("pauseBtn")
.addEventListener("click",togglePause);

document.getElementById("resume")
.addEventListener("click",togglePause);

document.getElementById("reset")
.addEventListener("click",()=>{

    player.position.set(0,0,0);
    player.rotation.y=0;
    speed=0;
    steer=0;

    for(const car of traffic){

        const lane=car.lane;
        const d=(Math.random()*1200)-600;

        if(lane.type==="z"){
            car.mesh.position.set(
                lane.value,
                0,
                d
            );
        }else{
            car.mesh.position.set(
                d,
                0,
                lane.value
            );
        }
    }

    paused=false;

    document.getElementById(
        "pausePanel"
    ).style.display="none";
});

document.getElementById("menu")
.addEventListener("click",()=>{
    location.href="index.html";
});

document.getElementById("carsBtn")
.addEventListener("click",()=>{
    location.href="voiture.html";
});

/* =========================
   FPS
========================= */

let last=performance.now();
let frames=0;
let fpsTime=performance.now();

function animate(now){

    requestAnimationFrame(animate);

    const dt=Math.min(
        (now-last)/1000,
        .05
    );

    last=now;

    if(!paused){

        updatePlayer(dt);
        updateTraffic(dt);
        updateCamera(dt);
    }

    renderer.render(
        scene,
        camera
    );

    frames++;

    if(now-fpsTime>500){

        const fps=Math.round(
            frames*1000/(now-fpsTime)
        );

        document.getElementById(
            "fps"
        ).textContent="FPS : "+fps;

        frames=0;
        fpsTime=now;
    }
}

requestAnimationFrame(animate);

/* =========================
   RESIZE
========================= */

addEventListener("resize",()=>{

    camera.aspect=
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
});

/* =========================
   FIN CHARGEMENT
========================= */

setTimeout(()=>{

    const loading=
        document.getElementById("loading");

    loading.style.opacity="0";

    setTimeout(()=>{
        loading.remove();
    },500);

},900);

</script>

</body>
</html>
