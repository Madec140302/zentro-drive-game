<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Zentro Drive - Monde Libre</title>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #05070a;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    user-select: none;

    -webkit-user-select: none;

    touch-action: none;
}


/* =========================================================
   GAME
========================================================= */

#game {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;
}


/* =========================================================
   LOADING
========================================================= */

#loading {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background:
        radial-gradient(
            circle at center,
            #18283d 0%,
            #070b11 55%,
            #020304 100%
        );

    transition:
        opacity 0.6s ease;
}


.loading-logo {

    font-size: 55px;

    font-weight: 1000;

    letter-spacing: 10px;

    color: white;

    margin-bottom: 25px;

    text-shadow:
        0 0 30px
        rgba(80,160,255,0.4);
}


.loading-text {

    color: #9aa9bc;

    font-size: 14px;

    letter-spacing: 2px;

    margin-bottom: 25px;
}


.loading-bar {

    width: 240px;

    height: 5px;

    border-radius: 10px;

    overflow: hidden;

    background:
        rgba(255,255,255,0.1);
}


.loading-progress {

    height: 100%;

    width: 0%;

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #60a5fa
        );

    animation:
        loading 1.4s ease forwards;
}


@keyframes loading {

    from {
        width: 0%;
    }

    to {
        width: 100%;
    }

}


/* =========================================================
   TOP HUD
========================================================= */

#hud {

    position: fixed;

    top: 20px;

    left: 20px;

    z-index: 100;

    display: flex;

    flex-direction: column;

    gap: 10px;

    pointer-events: none;
}


.hud-card {

    min-width: 180px;

    padding: 13px 16px;

    border-radius: 14px;

    background:
        rgba(3,7,13,0.72);

    border:
        1px solid
        rgba(255,255,255,0.1);

    backdrop-filter: blur(12px);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.2);
}


.hud-label {

    color: #77869a;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    margin-bottom: 4px;
}


.hud-value {

    color: white;

    font-size: 17px;

    font-weight: 900;
}


#speed {

    font-size: 28px;

    color: #60a5fa;
}


#speed-unit {

    color: #8190a4;

    font-size: 11px;

    margin-left: 4px;
}


/* =========================================================
   RIGHT BUTTONS
========================================================= */

#top-buttons {

    position: fixed;

    top: 20px;

    right: 20px;

    z-index: 100;

    display: flex;

    gap: 10px;
}


.ui-button {

    border: 1px solid
        rgba(255,255,255,0.12);

    color: white;

    background:
        rgba(3,7,13,0.75);

    backdrop-filter: blur(12px);

    border-radius: 12px;

    padding: 12px 15px;

    font-size: 13px;

    font-weight: 800;

    cursor: pointer;

    transition:
        transform 0.2s,
        background 0.2s;
}


.ui-button:hover {

    background:
        rgba(37,99,235,0.65);

    transform:
        translateY(-2px);
}


.ui-button:active {

    transform:
        scale(0.94);
}


/* =========================================================
   HELP
========================================================= */

#help {

    position: fixed;

    bottom: 20px;

    left: 20px;

    z-index: 100;

    padding: 12px 15px;

    border-radius: 12px;

    background:
        rgba(3,7,13,0.68);

    border:
        1px solid
        rgba(255,255,255,0.08);

    color: #a8b4c4;

    font-size: 12px;

    pointer-events: none;
}


/* =========================================================
   MOBILE CONTROLS
========================================================= */

#mobile-controls {

    position: fixed;

    inset: auto 0 20px 0;

    z-index: 200;

    display: none;

    justify-content: space-between;

    padding:
        0 20px;

    pointer-events: none;
}


.control-group {

    display: flex;

    gap: 12px;

    pointer-events: auto;
}


.control-button {

    width: 65px;

    height: 65px;

    border-radius: 18px;

    border:
        1px solid
        rgba(255,255,255,0.18);

    background:
        rgba(5,10,18,0.75);

    backdrop-filter:
        blur(10px);

    color: white;

    font-size: 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.25);

    touch-action: none;

    -webkit-tap-highlight-color:
        transparent;
}


.control-button:active {

    background:
        rgba(37,99,235,0.8);

    transform:
        scale(0.94);
}


/* =========================================================
   PAUSE PANEL
========================================================= */

#pause-panel {

    position: fixed;

    inset: 0;

    z-index: 500;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,0,0,0.55);

    backdrop-filter:
        blur(10px);
}


.pause-box {

    width:
        min(90%, 430px);

    padding: 35px;

    border-radius: 25px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(20,30,45,0.97),
            rgba(5,9,15,0.97)
        );

    border:
        1px solid
        rgba(255,255,255,0.1);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,0.5);
}


.pause-title {

    font-size: 34px;

    font-weight: 1000;

    margin-bottom: 10px;
}


.pause-text {

    color: #8492a5;

    margin-bottom: 25px;

    line-height: 1.6;
}


.pause-actions {

    display: flex;

    flex-direction: column;

    gap: 10px;
}


.pause-action {

    padding: 14px;

    border-radius: 12px;

    border: 0;

    cursor: pointer;

    font-weight: 900;

    color: white;

    background:
        rgba(255,255,255,0.08);
}


.pause-action.primary {

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width: 800px) {

    #mobile-controls {

        display: flex;
    }


    #help {

        display: none;
    }


    #hud {

        top: 12px;

        left: 12px;
    }


    .hud-card {

        min-width: 145px;

        padding: 10px 12px;
    }


    #speed {

        font-size: 23px;
    }


    #top-buttons {

        top: 12px;

        right: 12px;
    }


    .ui-button {

        padding:
            10px 12px;

        font-size: 11px;
    }

}


@media(max-width: 500px) {

    #top-buttons .garage-button {

        display: none;
    }


    .control-button {

        width: 60px;

        height: 60px;
    }

}

</style>

</head>

<!-- =========================================================
     GAME JAVASCRIPT
========================================================= -->

<script type="module">

import * as THREE from "three";


/* =========================================================
   BASIC SETUP
========================================================= */

const canvas =
    document.getElementById("game");


const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(0x8fa7bc);


scene.fog =
    new THREE.Fog(
        0x8fa7bc,
        130,
        650
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        65,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );


camera.position.set(
    0,
    5,
    10
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        canvas: canvas,

        antialias: false,

        powerPreference:
            "high-performance"

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.25
    )
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.shadowMap.enabled =
    false;


/* =========================================================
   LIGHTING
========================================================= */

const hemi =
    new THREE.HemisphereLight(
        0xddeeff,
        0x44505c,
        2.2
    );


scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.2
    );


sun.position.set(
    120,
    180,
    80
);


scene.add(sun);


/* =========================================================
   GROUND
========================================================= */

const groundMaterial =
    new THREE.MeshLambertMaterial({
        color: 0x4b6252
    });


const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            1400,
            1400
        ),

        groundMaterial

    );


ground.rotation.x =
    -Math.PI / 2;


ground.position.y =
    -0.03;


scene.add(ground);


/* =========================================================
   MATERIALS
========================================================= */

const roadMaterial =
    new THREE.MeshLambertMaterial({
        color: 0x252a30
    });


const sidewalkMaterial =
    new THREE.MeshLambertMaterial({
        color: 0x72777b
    });


const lineMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffffff
    });


const buildingMaterials = [

    new THREE.MeshLambertMaterial({
        color: 0x777f89
    }),

    new THREE.MeshLambertMaterial({
        color: 0x56606c
    }),

    new THREE.MeshLambertMaterial({
        color: 0x8b8178
    }),

    new THREE.MeshLambertMaterial({
        color: 0x626d78
    }),

    new THREE.MeshLambertMaterial({
        color: 0x73777c
    })

];


/* =========================================================
   ROADS
========================================================= */

function createRoad(
    x,
    z,
    width,
    length,
    horizontal
) {

    const road =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                horizontal
                    ? length
                    : width,

                0.08,

                horizontal
                    ? width
                    : length

            ),

            roadMaterial

        );


    road.position.set(
        x,
        0.01,
        z
    );


    scene.add(road);


    /* sidewalks */

    const sidewalk1 =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                horizontal
                    ? length
                    : 4,

                0.12,

                horizontal
                    ? 4
                    : length

            ),

            sidewalkMaterial

        );


    const sidewalk2 =
        sidewalk1.clone();


    if (horizontal) {

        sidewalk1.position.set(
            x,
            0.08,
            z + width / 2 + 2
        );


        sidewalk2.position.set(
            x,
            0.08,
            z - width / 2 - 2
        );

    } else {

        sidewalk1.position.set(
            x + width / 2 + 2,
            0.08,
            z
        );


        sidewalk2.position.set(
            x - width / 2 - 2,
            0.08,
            z
        );

    }


    scene.add(
        sidewalk1,
        sidewalk2
    );

}


/* main roads */

createRoad(
    0,
    0,
    28,
    1200,
    true
);


createRoad(
    0,
    0,
    28,
    1200,
    false
);


createRoad(
    0,
    250,
    24,
    1200,
    true
);


createRoad(
    250,
    0,
    24,
    1200,
    false
);


createRoad(
    0,
    -250,
    24,
    1200,
    true
);


createRoad(
    -250,
    0,
    24,
    1200,
    false
);


/* =========================================================
   ROAD LINES
========================================================= */

function createRoadLines() {

    for (
        let i = -580;
        i <= 580;
        i += 20
    ) {

        const line1 =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    8,
                    0.03,
                    0.35
                ),

                lineMaterial

            );


        line1.position.set(
            i,
            0.08,
            0
        );


        scene.add(line1);


        const line2 =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    0.35,
                    0.03,
                    8
                ),

                lineMaterial

            );


        line2.position.set(
            0,
            0.08,
            i
        );


        scene.add(line2);

    }

}


createRoadLines();


/* =========================================================
   BUILDINGS
========================================================= */

function createBuilding(
    x,
    z,
    width,
    depth,
    height,
    material
) {

    const building =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            material
        );


    building.position.set(
        x,
        height / 2,
        z
    );


    scene.add(building);


    /* roof */

    const roof =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width + 0.3,
                0.15,
                depth + 0.3
            ),

            material
        );


    roof.position.set(
        x,
        height + 0.08,
        z
    );


    scene.add(roof);

}


/* =========================================================
   CITY GRID
========================================================= */

const citySize = 12;

const blockSize = 75;


for (
    let gx = -citySize;
    gx <= citySize;
    gx++
) {

    for (
        let gz = -citySize;
        gz <= citySize;
        gz++
    ) {


        const x =
            gx * blockSize;


        const z =
            gz * blockSize;


        /* don't fill roads */

        const nearRoadX =
            Math.abs(x) % 250 < 38;


        const nearRoadZ =
            Math.abs(z) % 250 < 38;


        if (
            nearRoadX ||
            nearRoadZ
        ) {

            continue;

        }


        const width =
            35 +
            Math.random() * 20;


        const depth =
            35 +
            Math.random() * 20;


        const height =
            15 +
            Math.random() * 55;


        const material =
            buildingMaterials[
                Math.floor(
                    Math.random() *
                    buildingMaterials.length
                )
            ];


        createBuilding(
            x,
            z,
            width,
            depth,
            height,
            material
        );

    }

}


/* =========================================================
   TREES
========================================================= */

function createTree(
    x,
    z
) {

    const tree =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                0.3,
                0.4,
                3,
                6
            ),

            new THREE.MeshLambertMaterial({
                color: 0x65452e
            })

        );


    trunk.position.y =
        1.5;


    tree.add(trunk);


    const leaves =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                2.3,
                7,
                6
            ),

            new THREE.MeshLambertMaterial({
                color: 0x2d6a3b
            })

        );


    leaves.position.y =
        4;


    tree.add(leaves);


    tree.position.set(
        x,
        0,
        z
    );


    scene.add(tree);

}


for (
    let i = 0;
    i < 180;
    i++
) {

    const x =
        THREE.MathUtils.randFloat(
            -580,
            580
        );


    const z =
        THREE.MathUtils.randFloat(
            -580,
            580
        );


    if (
        Math.abs(x) < 25 ||
        Math.abs(z) < 25
    ) {

        continue;

    }


    createTree(
        x,
        z
    );

}


/* =========================================================
   CAR SETTINGS
========================================================= */

const selectedCar =
    localStorage.getItem(
        "zentroCar"
    ) || "Golf R";


const selectedColor =
    localStorage.getItem(
        "zentroColor"
    ) || "black";


document.getElementById(
    "car-name"
).textContent =
    selectedCar;


/* =========================================================
   CAR
========================================================= */

const car =
    new THREE.Group();


scene.add(car);


car.position.set(
    0,
    0.45,
    65
);


car.rotation.y =
    Math.PI;


/* =========================================================
   CAR COLORS
========================================================= */

let carColor =
    0x111111;


if (
    selectedColor === "red"
) {

    carColor =
        0xd92323;

}


if (
    selectedColor === "blue"
) {

    carColor =
        0x246bce;

}


if (
    selectedColor === "green"
) {

    carColor =
        0x2f9e58;

}


if (
    selectedColor === "white"
) {

    carColor =
        0xe8e8e8;

}


if (
    selectedColor === "orange"
) {

    carColor =
        0xf27b20;

}


/* =========================================================
   CAR BODY
========================================================= */

const bodyMaterial =
    new THREE.MeshPhongMaterial({

        color:
            carColor,

        shininess:
            90

    });


const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.25,
            0.65,
            4.5
        ),

        bodyMaterial

    );


body.position.y =
    0.7;


car.add(body);


/* =========================================================
   CAR ROOF
========================================================= */

const roof =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.75,
            0.55,
            2.25
        ),

        bodyMaterial

    );


roof.position.set(
    0,
    1.2,
    -0.1
);


car.add(roof);


/* =========================================================
   WINDOWS
========================================================= */

const windowMaterial =
    new THREE.MeshPhongMaterial({

        color:
            0x101923,

        shininess:
            100

    });


const windshield =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.6,
            0.36,
            1.05
        ),

        windowMaterial

    );


windshield.position.set(
    0,
    1.3,
    -0.55
);


windshield.rotation.x =
    -0.35;


car.add(windshield);


/* =========================================================
   REAR WINDOW
========================================================= */

const rearWindow =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.6,
            0.36,
            0.8
        ),

        windowMaterial

    );


rearWindow.position.set(
    0,
    1.3,
    0.55
);


rearWindow.rotation.x =
    0.35;


car.add(rearWindow);


/* =========================================================
   WHEELS
========================================================= */

const wheels = [];


const wheelMaterial =
    new THREE.MeshPhongMaterial({

        color:
            0x090909,

        shininess:
            50

    });


function createWheel(
    x,
    z
) {

    const wheel =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                0.43,
                0.43,
                0.32,
                16
            ),

            wheelMaterial

        );


    wheel.rotation.z =
        Math.PI / 2;


    wheel.position.set(
        x,
        0.45,
        z
    );


    car.add(wheel);


    wheels.push(wheel);

}


createWheel(
    -1.15,
    -1.45
);


createWheel(
    1.15,
    -1.45
);


createWheel(
    -1.15,
    1.45
);


createWheel(
    1.15,
    1.45
);


/* =========================================================
   HEADLIGHTS
========================================================= */

const headlightMaterial =
    new THREE.MeshBasicMaterial({

        color:
            0xffffff

    });


function createHeadlight(
    x
) {

    const light =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                0.45,
                0.18,
                0.08
            ),

            headlightMaterial

        );


    light.position.set(
        x,
        0.82,
        -2.28
    );


    car.add(light);


    const spot =
        new THREE.PointLight(
            0xffffff,
            0.7,
            15
        );


    spot.position.set(
        x,
        0.9,
        -2.5
    );


    car.add(spot);

}


createHeadlight(
    -0.65
);


createHeadlight(
    0.65
);

/* =========================================================
   EXHAUST FLAMES
========================================================= */

const flameMaterial =
    new THREE.MeshBasicMaterial({

        color:
            0xff6a00,

        transparent:
            true,

        opacity:
            0.8

    });


const flames = [];


function createFlame(
    x
) {

    const flame =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                0.14,
                0.6,
                8
            ),

            flameMaterial

        );


    flame.rotation.x =
        -Math.PI / 2;


    flame.position.set(
        x,
        0.48,
        2.72
    );


    flame.visible =
        false;


    car.add(flame);

    flames.push(flame);

}


createFlame(
    -0.55
);


createFlame(
    0.55
);


/* =========================================================
   CAR PHYSICS
========================================================= */

let speed = 0;

let steering = 0;

const maxSpeed =
    55;


const reverseSpeed =
    -18;


const acceleration =
    30;


const braking =
    45;


const friction =
    10;


const steeringPower =
    1.9;


/* =========================================================
   INPUT
========================================================= */

const keys = {};


window.addEventListener(
    "keydown",
    event => {

        keys[
            event.key.toLowerCase()
        ] = true;


        if (
            event.key === "Escape"
        ) {

            togglePause();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   MOBILE INPUT
========================================================= */

function bindTouch(
    id,
    key
) {

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            keys[key] = true;

        }
    );


    button.addEventListener(
        "pointerup",
        event => {

            event.preventDefault();

            keys[key] = false;

        }
    );


    button.addEventListener(
        "pointercancel",
        () => {

            keys[key] = false;

        }
    );


    button.addEventListener(
        "pointerleave",
        () => {

            keys[key] = false;

        }
    );

}


bindTouch(
    "left-button",
    "arrowleft"
);


bindTouch(
    "right-button",
    "arrowright"
);


bindTouch(
    "accelerate-button",
    "arrowup"
);


bindTouch(
    "brake-button",
    "arrowdown"
);


/* =========================================================
   PAUSE
========================================================= */

let paused = false;


const pausePanel =
    document.getElementById(
        "pause-panel"
    );


function togglePause() {

    paused =
        !paused;


    pausePanel.style.display =
        paused
            ? "flex"
            : "none";

}


document.getElementById(
    "pause-button"
).addEventListener(
    "click",
    togglePause
);


document.getElementById(
    "resume-button"
).addEventListener(
    "click",
    togglePause
);


/* =========================================================
   RESET
========================================================= */

function resetCar() {

    car.position.set(
        0,
        0.45,
        65
    );


    car.rotation.y =
        Math.PI;


    speed =
        0;

}


document.getElementById(
    "reset-button"
).addEventListener(
    "click",
    () => {

        resetCar();

        paused =
            false;

        pausePanel.style.display =
            "none";

    }
);

/* =========================================================
   UPDATE CAR
========================================================= */

function updateCar(
    delta
) {

    const forward =
        keys["w"] ||
        keys["arrowup"];


    const backward =
        keys["s"] ||
        keys["arrowdown"];


    const left =
        keys["a"] ||
        keys["arrowleft"];


    const right =
        keys["d"] ||
        keys["arrowright"];


    const brake =
        keys[" "];


    /* acceleration */

    if (forward) {

        speed +=
            acceleration *
            delta;

    }
    else if (backward) {

        speed -=
            acceleration *
            0.65 *
            delta;

    }
    else {

        if (speed > 0) {

            speed -=
                friction *
                delta;

            if (
                speed < 0
            ) {

                speed = 0;

            }

        }
        else if (speed < 0) {

            speed +=
                friction *
                delta;

            if (
                speed > 0
            ) {

                speed = 0;

            }

        }

    }


    /* brake */

    if (brake) {

        if (speed > 0) {

            speed -=
                braking *
                delta;

        }
        else if (speed < 0) {

            speed +=
                braking *
                delta;

        }

    }


    /* limits */

    speed =
        THREE.MathUtils.clamp(
            speed,
            reverseSpeed,
            maxSpeed
        );


    /* steering */

    let targetSteering =
        0;


    if (left) {

        targetSteering =
            1;

    }


    if (right) {

        targetSteering =
            -1;

    }


    steering =
        THREE.MathUtils.lerp(
            steering,
            targetSteering,
            8 * delta
        );


    const steeringAmount =
        steering *
        steeringPower *
        delta *
        Math.min(
            Math.abs(speed) / 8,
            1
        );


    car.rotation.y +=
        steeringAmount *
        Math.sign(
            speed || 1
        );


    /* movement */

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    direction.applyQuaternion(
        car.quaternion
    );


    car.position.addScaledVector(
        direction,
        speed * delta
    );


    /* keep inside world */

    car.position.x =
        THREE.MathUtils.clamp(
            car.position.x,
            -650,
            650
        );


    car.position.z =
        THREE.MathUtils.clamp(
            car.position.z,
            -650,
            650
        );


    /* wheel rotation */

    wheels.forEach(
        wheel => {

            wheel.rotation.x -=
                speed *
                delta *
                2;

        }
    );


    /* flames */

    const showFlames =
        forward &&
        speed > 18;


    flames.forEach(
        flame => {

            flame.visible =
                showFlames;

        }
    );

}


/* =========================================================
   CAMERA FOLLOW
========================================================= */

function updateCamera(
    delta
) {

    const offset =
        new THREE.Vector3(
            0,
            4.8,
            9.5
        );


    offset.applyQuaternion(
        car.quaternion
    );


    const target =
        car.position
            .clone()
            .add(offset);


    camera.position.lerp(
        target,
        5 * delta
    );


    const lookTarget =
        car.position
            .clone();


    lookTarget.y +=
        1;


    camera.lookAt(
        lookTarget
    );

}


/* =========================================================
   FPS
========================================================= */

let frameCount = 0;

let fpsTime = 0;


function updateFPS(
    delta
) {

    frameCount++;

    fpsTime += delta;


    if (
        fpsTime >= 0.5
    ) {

        const fps =
            Math.round(
                frameCount /
                fpsTime
            );


        document.getElementById(
            "fps"
        ).textContent =
            fps;


        frameCount =
            0;

        fpsTime =
            0;

    }

}


/* =========================================================
   SPEED HUD
========================================================= */

function updateHUD() {

    const kmh =
        Math.round(
            Math.abs(speed) *
            3.6
        );


    document.getElementById(
        "speed"
    ).textContent =
        kmh;

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                1.25
            )
        );

    }
);


/* =========================================================
   ANIMATION
========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    if (!paused) {

        updateCar(
            delta
        );


        updateCamera(
            delta
        );


        updateFPS(
            delta
        );


        updateHUD();

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   LOADING SCREEN
========================================================= */

setTimeout(
    () => {

        const loading =
            document.getElementById(
                "loading"
            );


        loading.style.opacity =
            "0";


        setTimeout(
            () => {

                loading.style.display =
                    "none";

            },
            600
        );

    },
    1200
);

</script>
