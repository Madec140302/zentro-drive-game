<script type="module">

import * as THREE from "three";

/* =========================================================
   CONFIGURATION
========================================================= */

const CONFIG = {

    worldSize:1300,

    roadWidth:28,

    maxSpeed:55,

    reverseSpeed:-18,

    acceleration:28,

    brakePower:46,

    friction:8,

    steering:2.15,

    trafficCount:26,

    treeCount:230,

    buildingStep:52,

    dayLength:180,

    defaultMoney:500,

    defaultXP:0

};

/* =========================================================
   DOM
========================================================= */

const canvas =
    document.getElementById("game");

const speedElement =
    document.getElementById("speed");

const carNameElement =
    document.getElementById("carName");

const moneyElement =
    document.getElementById("money");

const xpElement =
    document.getElementById("xp");

const trafficElement =
    document.getElementById("traffic");

const fpsElement =
    document.getElementById("fps");

const missionElement =
    document.getElementById("missionText");

const loadingProgress =
    document.getElementById("loadingProgress");

const notification =
    document.getElementById("notification");

const minimap =
    document.getElementById("minimap");

const minimapContext =
    minimap.getContext("2d");

/* =========================================================
   SAVE DATA
========================================================= */

const saveKey =
    "zentroDriveV3Save";

let saveData = {

    money:CONFIG.defaultMoney,

    xp:CONFIG.defaultXP,

    distance:0,

    missionProgress:0,

    time:0,

    quality:"medium",

    weather:"clear",

    dayNight:true

};

try{

    const oldSave =
        JSON.parse(
            localStorage.getItem(saveKey)
        );

    if(oldSave){

        saveData={
            ...saveData,
            ...oldSave
        };

    }

}catch(error){

    console.warn(
        "Sauvegarde impossible",
        error
    );

}

function saveGame(){

    localStorage.setItem(
        saveKey,
        JSON.stringify(saveData)
    );

}

/* =========================================================
   SELECTED CAR
========================================================= */

const selectedCar =
    localStorage.getItem(
        "zentroCar"
    ) || "Golf R";

const selectedColor =
    localStorage.getItem(
        "zentroColor"
    ) || "black";

carNameElement.textContent =
    selectedCar;

/* =========================================================
   THREE SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x8fa7bc
    );

scene.fog =
    new THREE.Fog(
        0x8fa7bc,
        100,
        720
    );

/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        66,
        innerWidth / innerHeight,
        .1,
        1500
    );

camera.position.set(
    0,
    5.5,
    -10
);

/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        canvas,

        antialias:
            true,

        powerPreference:
            "high-performance"

    });

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.5
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.15;

renderer.shadowMap.enabled =
    true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

/* =========================================================
   LIGHTS
========================================================= */

const hemisphereLight =
    new THREE.HemisphereLight(
        0xbfd9ff,
        0x38402e,
        1.7
    );

scene.add(
    hemisphereLight
);

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    -250,
    400,
    -200
);

sun.castShadow =
    true;

sun.shadow.mapSize.width =
    1024;

sun.shadow.mapSize.height =
    1024;

sun.shadow.camera.near =
    1;

sun.shadow.camera.far =
    1200;

sun.shadow.camera.left =
    -500;

sun.shadow.camera.right =
    500;

sun.shadow.camera.top =
    500;

sun.shadow.camera.bottom =
    -500;

scene.add(
    sun
);

/* =========================================================
   MOON LIGHT
========================================================= */

const moonLight =
    new THREE.DirectionalLight(
        0x7897ff,
        0
    );

moonLight.position.set(
    200,
    250,
    200
);

scene.add(
    moonLight
);

/* =========================================================
   WORLD GROUPS
========================================================= */

const world =
    new THREE.Group();

const buildingsGroup =
    new THREE.Group();

const treesGroup =
    new THREE.Group();

const roadsGroup =
    new THREE.Group();

const trafficGroup =
    new THREE.Group();

const effectsGroup =
    new THREE.Group();

scene.add(world);

world.add(
    buildingsGroup,
    treesGroup,
    roadsGroup,
    trafficGroup,
    effectsGroup
);

/* =========================================================
   MATERIAL CACHE
========================================================= */

const materialCache =
    new Map();

function getMaterial(
    color,
    roughness=.7,
    metalness=0
){

    const key =
        `${color}-${roughness}-${metalness}`;

    if(
        materialCache.has(key)
    ){

        return materialCache.get(key);

    }

    const material =
        new THREE.MeshStandardMaterial({

            color,

            roughness,

            metalness

        });

    materialCache.set(
        key,
        material
    );

    return material;

}

/* =========================================================
   GROUND
========================================================= */

const groundMaterial =
    getMaterial(
        0x5f7057,
        .95,
        0
    );

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            CONFIG.worldSize,
            CONFIG.worldSize
        ),
        groundMaterial
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow =
    true;

world.add(
    ground
);

/* =========================================================
   ROAD MATERIALS
========================================================= */

const roadMaterial =
    getMaterial(
        0x24272c,
        .92,
        0
    );

const sidewalkMaterial =
    getMaterial(
        0x858b91,
        .9,
        0
    );

const laneMaterial =
    getMaterial(
        0xe8d98b,
        .7,
        0
    );

const whiteLineMaterial =
    getMaterial(
        0xf2f2ed,
        .65,
        0
    );

/* =========================================================
   ROAD CREATION
========================================================= */

function createRoad(
    x,
    z,
    width,
    depth
){

    const road =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .08,
                depth
            ),
            roadMaterial
        );

    road.position.set(
        x,
        .04,
        z
    );

    road.receiveShadow =
        true;

    roadsGroup.add(
        road
    );

    const sidewalkNorth =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width + 2,
                .14,
                2.2
            ),
            sidewalkMaterial
        );

    sidewalkNorth.position.set(
        x,
        .09,
        z - depth/2 - 1.1
    );

    sidewalkNorth.receiveShadow =
        true;

    roadsGroup.add(
        sidewalkNorth
    );

    const sidewalkSouth =
        sidewalkNorth.clone();

    sidewalkSouth.position.z =
        z + depth/2 + 1.1;

    roadsGroup.add(
        sidewalkSouth
    );

}

/* =========================================================
   MAIN ROADS
========================================================= */

createRoad(
    0,
    0,
    32,
    CONFIG.worldSize
);

createRoad(
    250,
    0,
    32,
    CONFIG.worldSize
);

createRoad(
    -250,
    0,
    32,
    CONFIG.worldSize
);

createRoad(
    0,
    250,
    CONFIG.worldSize,
    32
);

createRoad(
    0,
    -250,
    CONFIG.worldSize,
    32
);

/* =========================================================
   ROAD LINES
========================================================= */

function addLine(
    x,
    z,
    w,
    d,
    material=laneMaterial
){

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                .095,
                d
            ),
            material
        );

    line.position.set(
        x,
        .095,
        z
    );

    roadsGroup.add(
        line
    );

}

/* vertical roads */

for(
    let p=-650;
    p<=650;
    p+=17
){

    addLine(
        -8,
        p,
        .28,
        8

function createCrosswalk(
    x,
    z,
    horizontal=true
){

    const group =
        new THREE.Group();

    for(
        let i=-5;
        i<=5;
        i++
    ){

        const stripe =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    horizontal ? 2.5 : .7,
                    .11,
                    horizontal ? .7 : 2.5
                ),
                whiteLineMaterial
            );

        if(horizontal){

            stripe.position.set(
                x + i*2.2,
                .11,
                z
            );

        }else{

            stripe.position.set(
                x,
                .11,
                z + i*2.2
            );

        }

        group.add(
            stripe
        );

    }

    roadsGroup.add(
        group
    );

}

        createTrafficCar();

    const position =
        THREE.MathUtils.randFloat(
            -620,
            620
        );

    const data = {

        mesh:car,

        route,

        speed:
            THREE.MathUtils.randFloat(
                9,
                18
            ),

        baseSpeed:
            THREE.MathUtils.randFloat(
                9,
                18
            ),

        wait:0,

        turnTimer:0,

        targetRotation:0

    };

    if(
        route.axis==="z"
    ){

        car.position.set(
            route.lane,
            0,
            position
        );

        car.rotation.y =
            route.direction>0
            ? 0
            : Math.PI;

    }else{

        car.position.set(
            position,
            0,
            route.lane
        );

        car.rotation.y =
            route.direction>0
            ? Math.PI/2
            : -Math.PI/2;

    }

    trafficCars.push(
        data
    );

}

        "pointerdown",
        event=>{

            event.preventDefault();

            keys[key]=true;

    button.addEventListener(

        "pointercancel",
        release
    );

    button.addEventListener(
        "pointerleave",
        release
    );

function updatePlayer(
    delta
){

    const gas =
        keys["w"] ||
        keys["arrowup"];

    const reverse =
        keys["s"] ||
        keys["arrowdown"];

    const left =
        keys["a"] ||
        keys["arrowleft"];

    const right =
        keys["d"] ||
        keys["arrowright"];

    braking =
        keys[" "];

    if(
        gas
    ){

        speed +=
            CONFIG.acceleration *
            delta;

    }else if(
        reverse
    ){

        if(
            speed>0
        ){

            speed -=
                CONFIG.brakePower *
                delta;

        }else{

            speed -=
                CONFIG.acceleration *
                .55 *
                delta;

        }

    }else if(
        braking
    ){

        if(
            speed>0
        ){

            speed -=
                CONFIG.brakePower *
                delta;

        }else if(
            speed<0
        ){

            speed +=
                CONFIG.brakePower *
                delta;

        }

    }else{

        if(
            speed>0
        ){

            speed =
                Math.max(
                    0,
                    speed -
                    CONFIG.friction *
                    delta
                );

        }

        if(
            speed<0
        ){

            speed =
                Math.min(
                    0,
                    speed +
                    CONFIG.friction *
                    delta
                );

        }

    }

    speed =
        THREE.MathUtils.clamp(
            speed,
            CONFIG.reverseSpeed,
            CONFIG.maxSpeed
        );

    let targetSteering=0;

    if(
        left
    ){

        targetSteering=1;

    }

    if(
        right
    ){

        targetSteering=-1;

    }

    steering =
        THREE.MathUtils.lerp(
            steering,
            targetSteering,
            Math.min(
                1,
                delta*8
            )
        );

    const steeringStrength =
        Math.min(
            1,
            Math.abs(speed)/10
        );

    player.rotation.y +=
        steering *
        CONFIG.steering *
        steeringStrength *
        delta;

    const forward =
        new THREE.Vector3(
            0,
            0,
            1
        );

    forward.applyQuaternion(
        player.quaternion
    );

    const previousPosition =
        player.position.clone();

    player.position.addScaledVector(
        forward,
        speed*delta
    );

    distanceTravelled +=
        previousPosition.distanceTo(
            player.position
        );

    saveData.distance +=
        previousPosition.distanceTo(
            player.position
        );

    /* world boundaries */

    const limit =
        CONFIG.worldSize/2-20;

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -limit,
            limit
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -limit,
            limit
        );

    /* wheel steering */

    const frontAngle =
        steering * .55;

    wheelGroups[2]
        .holder
        .rotation.y =
        frontAngle;

    wheelGroups[3]
        .holder
        .rotation.y =
        frontAngle;

    /* wheel rolling */

    for(
        const wheel
        of wheelGroups
    ){

        wheel.wheel.rotation.x -=
            speed *
            delta *
            2.2;

    }

    /* suspension */

    const suspension =
        Math.sin(
            performance.now()*.018
        ) *
        Math.min(
            .045,
            Math.abs(speed)*.001
        );

    playerBody.position.y =
        .88 +
        suspension;

    playerRoof.position.y =
        1.32 +
        suspension;

    updateExhaust();

    updateBrakeLights();

}

function updateExhaust(){

    const active =
        speed >
            CONFIG.maxSpeed*.45;

    for(
        let i=0;
        i<exhaustParticles.length;
        i++
    ){

        const particle =
            exhaustParticles[i];

        if(
            active &&
            Math.random()<.18
        ){

            particle.visible=true;

            particle.material.opacity =
                .7;

            const side =
                i%2===0
                ? -.55
                : .55;

            particle.position.copy(
                player.position
            );

            particle.position.y +=
                .48 +
                Math.random()*.1;

            particle.position.x +=
                side;

            particle.position.z -=
                2.3 +
                Math.random()*.5;

            particle.scale.setScalar(
                .6 +
                Math.random()*.7
            );

        }else{

            particle.material.opacity *=
                .82;

            if(
                particle.material.opacity<.03
            ){

                particle.visible=false;

            }

        }

    }

}

/* =========================================================
   TRAFFIC AI
========================================================= */

function distanceToIntersection(
    car
){

    const x =
        car.mesh.position.x;

    const z =
        car.mesh.position.z;

    const route =
        car.route;

    if(
        route.axis==="z"
    ){

        const points=[
            0,
            250,
            -250
        ];

        let nearest=Infinity;

        for(
            const point
            of points
        ){

            const d =
                Math.abs(
                    z-point
                );

            nearest =
                Math.min(
                    nearest,
                    d
                );

        }

        return nearest;

    }else{

        const points=[
            0,
            250,
            -250
        ];

        let nearest=Infinity;

        for(
            const point
            of points
        ){

            const d =
                Math.abs(
                    x-point
                );

            nearest =
                Math.min(
                    nearest,
                    d
                );

        }

        return nearest;

    }

}

function trafficLightState(
    time
){

    const cycle =
        time % 16;

    return cycle<8
        ? "vertical"
        : "horizontal";

}

function updateTraffic(
    delta
){

    const lightState =
        trafficLightState(
            worldTime
        );

    for(
        const car
        of trafficCars
    ){

        const route =
            car.route;

        let allowed=true;

        const near =
            distanceToIntersection(
                car
            );

        if(
            near<17 &&
            near>4
        ){

            const vertical =
                route.axis==="z";

            const green =
                vertical
                ? lightState==="vertical"
                : lightState==="horizontal";

            if(
                !green
            ){

                allowed=false;

            }

        }

        /* simple obstacle detection */

        let obstacle=false;

        for(
            const other
            of trafficCars
        ){

            if(
                other===car
            ){

                continue;

            }

            if(
                other.route.axis !==
                route.axis
            ){

                continue;

            }

            let distance;

            if(
                route.axis==="z"
            ){

                distance =
                    Math.abs(
                        other.mesh.position.z -
                        car.mesh.position.z
                    );

            }else{

                distance =
                    Math.abs(
                        other.mesh.position.x -
                        car.mesh.position.x
                    );

            }

            if(
                distance<7 &&
                distance>0
            ){

                obstacle=true;

                break;

            }

        }

        const targetSpeed =
            allowed &&
            !obstacle
            ? car.baseSpeed
            : 0;

        car.speed =
            THREE.MathUtils.lerp(
                car.speed,
                targetSpeed,
                Math.min(
                    1,
                    delta*3
                )
            );

        const movement =
            route.direction *
            car.speed *
            delta;

        if(
            route.axis==="z"
        ){

            car.mesh.position.z +=
                movement;

            car.mesh.rotation.y =
                route.direction>0
                ? 0
                : Math.PI;

        }else{

            car.mesh.position.x +=
                movement;

            car.mesh.rotation.y =
                route.direction>0
                ? Math.PI/2
                : -Math.PI/2;

        }

        /* loop */

        if(
            car.mesh.position.z>670
        ){

            car.mesh.position.z=-670;

        }

        if(
            car.mesh.position.z<-670
        ){

            car.mesh.position.z=670;

        }

        if(
            car.mesh.position.x>670
        ){

            car.mesh.position.x=-670;

        }

        if(
            car.mesh.position.x<-670
        ){

            car.mesh.position.x=670;

        }

    }

}

   COLLISION
========================================================= */

function updateCollisions(){

    const playerPosition =
        player.position;

    for(
        const car
        of trafficCars
    ){

        const distance =
            playerPosition.distanceTo(
                car.mesh.position
            );

        if(
            distance<3.1
        ){

            const push =
                playerPosition.clone()
                    .sub(
                        car.mesh.position
                    )
                    .normalize();

            player.position.addScaledVector(
                push,
                .18
            );

            speed *=
                .55;

            showNotification(
                "🚗 Attention au trafic !"
            );

        }

    }

}

function createTrafficLight(

            new THREE.CylinderGeometry(

            ),
            getMaterial(

            )

    );

    );

/* =========================================================
   DAY / NIGHT
========================================================= */

let worldTime =
    saveData.time || 35;

function updateDayNight(
    delta
){

    if(
        !saveData.dayNight
    ){

        return;

    }

    worldTime +=
        delta;

    if(
        worldTime >
        CONFIG.dayLength
    ){

        worldTime=0;

    }

    saveData.time =
        worldTime;

    const normalized =
        worldTime /
        CONFIG.dayLength;

    const angle =
        normalized *
        Math.PI*2 -
        Math.PI/2;

    const sunHeight =
        Math.sin(angle);

    const daylight =
        THREE.MathUtils.clamp(
            (sunHeight+.15)/1.15,
            0,
            1
        );

    const skyColor =
        new THREE.Color();

    const nightColor =
        new THREE.Color(
            0x07101f
        );

    const dayColor =
        new THREE.Color(
            0x8fa7bc
        );

    skyColor.lerpColors(
        nightColor,
        dayColor,
        daylight
    );

    scene.background =
        skyColor;

    scene.fog.color.copy(
        skyColor
    );

    sun.position.set(
        Math.cos(angle)*400,
        Math.max(
            15,
            sunHeight*500
        ),
        Math.sin(angle)*400
    );

    sun.intensity =
        .15 +
        daylight*2.1;

    moonLight.intensity =
        (1-daylight)*.65;

    hemisphereLight.intensity =
        .35 +
        daylight*1.4;

    const night =
        daylight<.25;

    for(
        const streetLight
        of streetLights
    ){

        streetLight
            .lampMaterial
            .emissiveIntensity =
            night ? 7 : 0;

    }

    for(
        const spot
        of headLights
    ){

        spot.intensity =
            night ? 10 : 0;

    }

}

/* =========================================================
   MINIMAP
========================================================= */

function drawMinimap(){

    const ctx =
        minimapContext;

    const width =
        minimap.width;

    const height =
        minimap.height;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    ctx.fillStyle =
        "#28332c";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    const scale =
        width /
        CONFIG.worldSize;

    function worldToMap(
        x,
        z
    ){

        return {

            x:
                width/2 +
                x*scale,

            y:
                height/2 +
                z*scale

        };

    }

    /* roads */

    ctx.fillStyle =
        "#3d4145";

    for(
        const p
        of [
            0,
            250,
            -250
        ]
    ){

        const px =
            width/2 +
            p*scale;

        ctx.fillRect(
            px-16,
            0,
            32,
            height
        );

        const py =
            height/2 +
            p*scale;

        ctx.fillRect(
            0,
            py-16,
            width,
            32
        );

    }

    /* traffic */

    ctx.fillStyle =
        "#ffad42";

    for(
        const car
        of trafficCars
    ){

        const p =
            worldToMap(
                car.mesh.position.x,
                car.mesh.position.z
            );

        ctx.fillRect(
            p.x-3,
            p.y-3,
            6,
            6
        );

    }

    /* player */

    const playerMap =
        worldToMap(
            player.position.x,
            player.position.z
        );

    ctx.save();

    ctx.translate(
        playerMap.x,
        playerMap.y
    );

    ctx.rotate(
        -player.rotation.y
    );

    ctx.fillStyle =
        "#52a1ff";

    ctx.beginPath();

    ctx.moveTo(
        0,
        -8
    );

    ctx.lineTo(
        5,
        6
    );

    ctx.lineTo(
        -5,
        6
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();

}

        fpsElement.textContent =
            fps;

        fpsFrames=0;

        fpsTimer=now;

    }

}

/* =========================================================
   CLOCK
========================================================= */

let lastTime =
    performance.now();

/* =========================================================
   ANIMATION LOOP
========================================================= */

function animate(
    time
){

    const delta =
        Math.min(
            (time-lastTime)/
            1000,
            .05
        );

    lastTime=time;

    if(
        !paused
    ){

        updatePlayer(
            delta
        );

        updateTraffic(
            delta
        );

        updateCollisions();

        updateTrafficLights();

        updateDayNight(
            delta
        );

        updateWeather(
            delta
        );

        updateCamera(
            delta
        );

        updateMission(
            delta
        );

        updateHUD();

        drawMinimap();

    }

    renderer.render(
        scene,
        camera
    );

    updateFPS(
        time
    );

}

/* =========================================================
   RENDER LOOP
========================================================= */

renderer.setAnimationLoop(
    animate
);

/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        applyQuality();

    }
);

/* =========================================================
   INITIALIZATION
========================================================= */

applyQuality();

updateHUD();

drawMinimap();

/* fake progressive loading */

let progress=0;

const loadingInterval =
    setInterval(
        ()=>{

            progress +=
                Math.random()*18;

            if(
                progress>=100
            ){

                progress=100;

                clearInterval(
                    loadingInterval
                );

                setTimeout(
                    ()=>{

                        document
                            .getElementById(
                                "loading"
                            )
                            .classList.add(
                                "hide"
                            );

                    },
                    250
                );

            }

            loadingProgress.style.width =
                progress+"%";

        },
        120
    );

/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            document.hidden &&
            !paused
        ){

            togglePause();

        }

    }
);

</script>
