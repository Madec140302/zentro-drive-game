<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Zentro Drive — Monde Libre</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070b;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* =========================
   HUD
========================= */

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

#topBar{
    position:absolute;
    top:14px;
    left:14px;
    right:14px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.panel{
    background:rgba(5,8,14,.78);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-radius:16px;
    box-shadow:0 10px 35px rgba(0,0,0,.25);
}

#brand{
    padding:11px 15px;
    font-size:17px;
    font-weight:900;
    letter-spacing:3px;
}

#carName{
    margin-top:3px;
    font-size:10px;
    letter-spacing:1.5px;
    color:#9da8b8;
}

#stats{
    display:flex;
    gap:8px;
    padding:8px;
}

.stat{
    min-width:74px;
    text-align:center;
}

.statLabel{
    font-size:9px;
    color:#8490a0;
    text-transform:uppercase;
    letter-spacing:1px;
}

.statValue{
    margin-top:2px;
    font-size:17px;
    font-weight:900;
}

#speedValue{
    color:#4d8dff;
}

#fpsValue{
    color:#59e391;
}

#gearValue{
    color:#ffffff;
}

/* =========================
   BOTTOM HUD
========================= */

#bottomHud{
    position:absolute;
    left:14px;
    bottom:14px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.smallInfo{
    padding:8px 11px;
    font-size:10px;
    color:#aeb7c6;
}

.smallInfo b{
    color:white;
}

/* =========================
   MINIMAP
========================= */

#minimap{
    position:absolute;
    right:14px;
    bottom:14px;

    width:170px;
    height:170px;

    border-radius:18px;
    overflow:hidden;

    border:1px solid rgba(255,255,255,.15);
    background:rgba(5,8,14,.82);

    box-shadow:0 10px 35px rgba(0,0,0,.35);
}

#mapCanvas{
    width:100%;
    height:100%;
}

/* =========================
   BUTTONS
========================= */

#actions{
    position:absolute;
    right:14px;
    top:100px;

    display:flex;
    flex-direction:column;
    gap:8px;

    pointer-events:auto;
}

.actionBtn{
    width:44px;
    height:44px;

    border:1px solid rgba(255,255,255,.13);
    border-radius:13px;

    background:rgba(7,10,16,.78);
    color:white;

    cursor:pointer;
    font-size:18px;

    transition:.15s;
}

.actionBtn:hover{
    background:#1769ff;
    transform:translateY(-1px);
}

/* =========================
   PAUSE
========================= */

#pauseScreen{
    position:fixed;
    inset:0;

    z-index:50;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.68);
    backdrop-filter:blur(12px);
}

.pauseBox{
    width:min(420px,90vw);
    padding:30px;

    border-radius:24px;
    background:#090d15;
    border:1px solid rgba(255,255,255,.12);

    text-align:center;
}

.pauseBox h1{
    font-size:34px;
    margin-bottom:8px;
}

.pauseBox p{
    color:#8994a4;
    margin-bottom:22px;
}

.pauseButtons{
    display:flex;
    gap:10px;
}

.pauseBtn{
    flex:1;
    padding:13px;
    border:none;
    border-radius:12px;

    color:white;
    background:#1769ff;

    font-weight:800;
    cursor:pointer;
}

.pauseBtn.secondary{
    background:#171d28;
}

/* =========================
   MOBILE CONTROLS
========================= */

#mobileControls{
    position:fixed;
    inset:0;

    z-index:20;
    pointer-events:none;
}

#steering{
    position:absolute;
    left:18px;
    bottom:20px;

    display:flex;
    gap:10px;
}

#pedals{
    position:absolute;
    right:18px;
    bottom:20px;

    display:flex;
    gap:10px;
}

.touchBtn{
    width:62px;
    height:62px;

    border-radius:18px;
    border:1px solid rgba(255,255,255,.18);

    background:rgba(5,8,14,.72);
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;
    font-weight:900;

    pointer-events:auto;
    user-select:none;
    -webkit-user-select:none;

    touch-action:none;
}

.touchBtn:active{
    background:#1769ff;
    transform:scale(.96);
}

#touchBrake{
    background:rgba(120,20,30,.55);
}

#touchThrottle{
    background:rgba(20,100,50,.55);
}

/* =========================
   HELP
========================= */

#help{
    position:absolute;
    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    padding:8px 13px;

    border-radius:12px;
    background:rgba(5,8,14,.7);

    font-size:10px;
    color:#9aa5b5;

    pointer-events:none;
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;
    z-index:100;

    background:#05070b;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.loadingLogo{
    font-size:36px;
    font-weight:1000;
    letter-spacing:8px;
}

.loadingText{
    margin-top:10px;
    color:#788394;
    font-size:12px;
}

.loader{
    width:180px;
    height:4px;

    margin-top:22px;

    border-radius:10px;
    background:#151c27;
    overflow:hidden;
}

.loaderBar{
    width:35%;
    height:100%;
    background:#1769ff;

    animation:load 1s infinite ease-in-out;
}

@keyframes load{
    0%{transform:translateX(-120%)}
    100%{transform:translateX(500%)}
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    #topBar{
        top:8px;
        left:8px;
        right:8px;
    }

    #brand{
        padding:8px 10px;
        font-size:13px;
    }

    #carName{
        font-size:8px;
    }

    #stats{
        padding:5px;
    }

    .stat{
        min-width:54px;
    }

    .statValue{
        font-size:13px;
    }

    .statLabel{
        font-size:7px;
    }

    #minimap{
        width:125px;
        height:125px;
        right:8px;
        bottom:95px;
    }

    #actions{
        right:8px;
        top:75px;
    }

    #help{
        display:none;
    }

    #bottomHud{
        left:8px;
        bottom:8px;
    }

    .smallInfo{
        padding:6px 8px;
        font-size:8px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div id="topBar">

        <div class="panel" id="brand">
            ZENTRO
            <div id="carName">STREET</div>
        </div>

        <div class="panel" id="stats">

            <div class="stat">
                <div class="statLabel">Vitesse</div>
                <div class="statValue">
                    <span id="speedValue">0</span>
                    <small>km/h</small>
                </div>
            </div>

            <div class="stat">
                <div class="statLabel">FPS</div>
                <div class="statValue" id="fpsValue">60</div>
            </div>

            <div class="stat">
                <div class="statLabel">Rapport</div>
                <div class="statValue" id="gearValue">N</div>
            </div>

        </div>

    </div>

    <div id="actions">

        <button class="actionBtn" id="pauseBtn">
            ⏸
        </button>

        <button class="actionBtn" id="resetBtn">
            ↻
        </button>

        <button class="actionBtn" id="menuBtn">
            🏠
        </button>

    </div>

    <div id="bottomHud">

        <div class="panel smallInfo">
            VOITURE :
            <b id="hudCar">Street</b>
        </div>

        <div class="panel smallInfo">
            QUALITÉ :
            <b id="qualityValue">Balanced</b>
        </div>

        <div class="panel smallInfo">
            DRAW :
            <b id="drawValue">0</b>
        </div>

        <div class="panel smallInfo">
            TRI :
            <b id="triValue">0</b>
        </div>

    </div>

    <div id="minimap">
        <canvas id="mapCanvas" width="340" height="340"></canvas>
    </div>

    <div id="help">
        W A S D / FLÈCHES — CONDUIRE · ESPACE — FREIN · P — PAUSE
    </div>

</div>

<!-- =========================
     MOBILE
========================= -->

<div id="mobileControls">

    <div id="steering">

        <button class="touchBtn" id="touchLeft">
            ◀
        </button>

        <button class="touchBtn" id="touchRight">
            ▶
        </button>

    </div>

    <div id="pedals">

        <button class="touchBtn" id="touchBrake">
            ▼
        </button>

        <button class="touchBtn" id="touchThrottle">
            ▲
        </button>

    </div>

</div>

<!-- =========================
     PAUSE
========================= -->

<div id="pauseScreen">

    <div class="pauseBox">

        <h1>PAUSE</h1>

        <p>
            Zentro Drive est en pause.
        </p>

        <div class="pauseButtons">

            <button class="pauseBtn" id="resumeBtn">
                ▶ Reprendre
            </button>

            <button class="pauseBtn secondary" id="pauseMenuBtn">
                🏠 Menu
            </button>

        </div>

    </div>

</div>

<!-- =========================
     LOADING
========================= -->

<div id="loading">

    <div class="loadingLogo">
        ZENTRO
    </div>

    <div class="loadingText">
        Chargement du monde libre...
    </div>

    <div class="loader">
        <div class="loaderBar"></div>
    </div>

</div>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from "three";

/* =========================================================
   ZENTRO DRIVE V2
   ========================================================= */

/* =========================
   LOCAL STORAGE
========================= */

const selectedCar =
    localStorage.getItem("zentroCar") || "street";

const selectedColor =
    localStorage.getItem("zentroColor") || "#1769ff";

const savedQuality =
    localStorage.getItem("zentroQuality") || "balanced";

const savedTraffic =
    localStorage.getItem("zentroTraffic") || "medium";

const savedCityDetail =
    localStorage.getItem("zentroCityDetail") || "medium";

const savedNight =
    localStorage.getItem("zentroNight") === "true";

const savedDynamicCamera =
    localStorage.getItem("zentroDynamicCamera") !== "false";

const savedAssist =
    localStorage.getItem("zentroAssist") !== "false";

/* =========================
   VEHICLE DATA
========================= */

const VEHICLES = {

    street:{
        name:"Zentro Street",
        short:"Street",
        maxSpeed:.65,
        acceleration:.55,
        brake:.90,
        turn:1.55,
        grip:.92,
        reverse:.30,
        width:1.15,
        length:2.10,
        height:0.55
    },

    formula:{
        name:"Zentro Formula",
        short:"Formula",
        maxSpeed:.95,
        acceleration:.82,
        brake:1.10,
        turn:1.75,
        grip:.98,
        reverse:.22,
        width:1.15,
        length:2.00,
        height:.32
    },

    van:{
        name:"Zentro Van",
        short:"Van",
        maxSpeed:.48,
        acceleration:.38,
        brake:.72,
        turn:1.10,
        grip:.84,
        reverse:.24,
        width:1.25,
        length:2.25,
        height:.95
    },

    truck:{
        name:"Zentro Truck",
        short:"Truck",
        maxSpeed:.34,
        acceleration:.24,
        brake:.58,
        turn:.78,
        grip:.75,
        reverse:.18,
        width:1.45,
        length:2.70,
        height:1.15
    }

};

const vehicleData =
    VEHICLES[selectedCar] || VEHICLES.street;

/* =========================
   UI
========================= */

document.getElementById("carName").textContent =
    vehicleData.name.toUpperCase();

document.getElementById("hudCar").textContent =
    vehicleData.name;

document.getElementById("qualityValue").textContent =
    savedQuality;

/* =========================
   QUALITY
========================= */

const QUALITY = {

    ultra:{
        pixelRatio:.45,
        buildings:120,
        trees:45,
        traffic:3,
        view:115
    },

    balanced:{
        pixelRatio:.60,
        buildings:180,
        trees:70,
        traffic:5,
        view:145
    },

    quality:{
        pixelRatio:.75,
        buildings:250,
        trees:95,
        traffic:7,
        view:180
    }

};

const quality =
    QUALITY[savedQuality] || QUALITY.balanced;

/* =========================
   TRAFFIC LEVEL
========================= */

let trafficCount = quality.traffic;

if(savedTraffic === "low"){
    trafficCount = Math.min(3,quality.traffic);
}

if(savedTraffic === "high"){
    trafficCount = Math.min(8,quality.traffic + 2);
}

/* =========================
   THREE
========================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        savedNight ? 0x06101d : 0x7aa7d9
    );

scene.fog =
    new THREE.Fog(
        savedNight ? 0x06101d : 0x7aa7d9,
        55,
        quality.view
    );

const camera =
    new THREE.PerspectiveCamera(
        65,
        window.innerWidth / window.innerHeight,
        .1,
        400
    );

camera.position.set(
    0,
    4.5,
    8
);

/* =========================
   RENDERER
========================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance",
        alpha:false
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        quality.pixelRatio
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById("game")
    .appendChild(renderer.domElement);

/*
  Pas de shadows dynamiques par défaut :
  priorité à la fluidité.
*/
renderer.shadowMap.enabled = false;

/* =========================
   LIGHTING
========================= */

const hemi =
    new THREE.HemisphereLight(
        savedNight ? 0x243b5d : 0xcfe6ff,
        savedNight ? 0x101522 : 0x66704c,
        savedNight ? 1.1 : 1.5
    );

scene.add(hemi);

const sun =
    new THREE.DirectionalLight(
        savedNight ? 0x5274aa : 0xffffff,
        savedNight ? .35 : 1.2
    );

sun.position.set(
    -80,
    120,
    -50
);

scene.add(sun);

/* =========================
   MATERIALS
========================= */

const matRoad =
    new THREE.MeshBasicMaterial({
        color:0x20242b
    });

const matSidewalk =
    new THREE.MeshBasicMaterial({
        color:0x686d74
    });

const matGrass =
    new THREE.MeshBasicMaterial({
        color:0x365a39
    });

const matLine =
    new THREE.MeshBasicMaterial({
        color:0xf4f0c8
    });

const matBuilding =
    new THREE.MeshLambertMaterial({
        color:0x747c89
    });

const matBuildingDark =
    new THREE.MeshLambertMaterial({
        color:0x4d5662
    });

const matTree =
    new THREE.MeshLambertMaterial({
        color:0x2f6d3a
    });

const matTreeDark =
    new THREE.MeshLambertMaterial({
        color:0x204a2a
    });

/* =========================
   GROUND
========================= */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            400,
            400
        ),
        matGrass
    );

ground.rotation.x =
    -Math.PI / 2;

scene.add(ground);

/* =========================================================
   CITY
========================================================= */

const citySize = 10;
const blockSize = 12;
const roadWidth = 5;

const totalSize =
    citySize * blockSize;

const cityOffset =
    totalSize / 2;

/* =========================
   ROADS
========================= */

function createRoads(){

    const roadGroup =
        new THREE.Group();

    const roadGeometry =
        new THREE.BoxGeometry(
            roadWidth,
            .04,
            totalSize
        );

    for(let x=0;x<citySize;x++){

        const road =
            new THREE.Mesh(
                roadGeometry,
                matRoad
            );

        road.position.set(
            x * blockSize - cityOffset + blockSize/2,
            .02,
            0
        );

        roadGroup.add(road);
    }

    const horizontalGeometry =
        new THREE.BoxGeometry(
            totalSize,
            .04,
            roadWidth
        );

    for(let z=0;z<citySize;z++){

        const road =
            new THREE.Mesh(
                horizontalGeometry,
                matRoad
            );

        road.position.set(
            0,
            .021,
            z * blockSize - cityOffset + blockSize/2
        );

        roadGroup.add(road);
    }

    scene.add(roadGroup);
}

createRoads();

/* =========================
   ROAD LINES INSTANCED
========================= */

function createRoadLines(){

    const geo =
        new THREE.BoxGeometry(
            .10,
            .045,
            1.5
        );

    const max =
        citySize * citySize * 20;

    const mesh =
        new THREE.InstancedMesh(
            geo,
            matLine,
            max
        );

    const dummy =
        new THREE.Object3D();

    let index=0;

    for(let x=0;x<citySize;x++){

        const px =
            x * blockSize -
            cityOffset +
            blockSize/2;

        for(let z=-cityOffset;z<cityOffset;z+=4){

            if(index>=max) break;

            dummy.position.set(
                px,
                .055,
                z
            );

            dummy.rotation.set(
                0,
                0,
                0
            );

            dummy.updateMatrix();

            mesh.setMatrixAt(
                index++,
                dummy.matrix
            );
        }
    }

    mesh.count=index;

    scene.add(mesh);
}

createRoadLines();

/* =========================================================
   BUILDINGS
========================================================= */

function createBuildings(){

    const max =
        savedCityDetail === "low"
            ? 100
            : savedCityDetail === "high"
                ? quality.buildings
                : Math.min(
                    quality.buildings,
                    180
                );

    const geo =
        new THREE.BoxGeometry(
            1,
            1,
            1
        );

    const mesh =
        new THREE.InstancedMesh(
            geo,
            matBuilding,
            max
        );

    const dummy =
        new THREE.Object3D();

    let index=0;

    for(
        let gx=0;
        gx<citySize;
        gx++
    ){

        for(
            let gz=0;
            gz<citySize;
            gz++
        ){

            const blockX =
                gx * blockSize -
                cityOffset +
                blockSize/2;

            const blockZ =
                gz * blockSize -
                cityOffset +
                blockSize/2;

            const spots=[
                [-3,-3],
                [3,-3],
                [-3,3],
                [3,3]
            ];

            for(
                let s=0;
                s<spots.length;
                s++
            ){

                if(index>=max)
                    break;

                const x =
                    blockX +
                    spots[s][0];

                const z =
                    blockZ +
                    spots[s][1];

                const w =
                    2.3 +
                    ((gx*13+gz*7+s)%5)*.25;

                const d =
                    2.3 +
                    ((gx*9+gz*11+s)%4)*.3;

                const h =
                    2.5 +
                    ((gx*17+gz*5+s)%7)*.75;

                dummy.position.set(
                    x,
                    h/2,
                    z
                );

                dummy.scale.set(
                    w,
                    h,
                    d
                );

                dummy.rotation.y =
                    ((gx+gz+s)%4) * .08;

                dummy.updateMatrix();

                mesh.setMatrixAt(
                    index++,
                    dummy.matrix
                );
            }
        }
    }

    mesh.count=index;

    scene.add(mesh);
}

createBuildings();

/* =========================================================
   TREES
========================================================= */

function createTrees(){

    const count =
        savedCityDetail === "low"
            ? 30
            : quality.trees;

    const trunkGeo =
        new THREE.CylinderGeometry(
            .09,
            .12,
            .65,
            6
        );

    const leafGeo =
        new THREE.ConeGeometry(
            .45,
            1.2,
            7
        );

    const trunkMesh =
        new THREE.InstancedMesh(
            trunkGeo,
            new THREE.MeshBasicMaterial({
                color:0x5a3b27
            }),
            count
        );

    const leafMesh =
        new THREE.InstancedMesh(
            leafGeo,
            matTree,
            count
        );

    const dummy =
        new THREE.Object3D();

    for(let i=0;i<count;i++){

        const gx =
            ((i*37)%citySize);

        const gz =
            ((i*61)%citySize);

        const x =
            gx*blockSize -
            cityOffset +
            1.8;

        const z =
            gz*blockSize -
            cityOffset +
            1.8;

        dummy.position.set(
            x,
            .32,
            z
        );

        dummy.scale.set(
            1,
            1,
            1
        );

        dummy.updateMatrix();

        trunkMesh.setMatrixAt(
            i,
            dummy.matrix
        );

        dummy.position.y =
            1.05;

        dummy.scale.set(
            .95 + (i%3)*.1,
            .95 + (i%2)*.1,
            .95 + (i%3)*.1
        );

        dummy.updateMatrix();

        leafMesh.setMatrixAt(
            i,
            dummy.matrix
        );
    }

    scene.add(trunkMesh);
    scene.add(leafMesh);
}

createTrees();

/* =========================================================
   VEHICLE
========================================================= */

let car =
    new THREE.Group();

scene.add(car);

const carBodyGroup =
    new THREE.Group();

car.add(carBodyGroup);

const carWheels = [];

let frontLeftWheel;
let frontRightWheel;

const carColor =
    new THREE.Color(selectedColor);

/* =========================
   MATERIALS VEHICLE
========================= */

const bodyMaterial =
    new THREE.MeshLambertMaterial({
        color:carColor
    });

const darkMaterial =
    new THREE.MeshLambertMaterial({
        color:0x101319
    });

const glassMaterial =
    new THREE.MeshBasicMaterial({
        color:0x152338,
        transparent:true,
        opacity:.82

========================= */

function pressed(...codes){

    for(
        const code of codes
    ){

        if(keys[code])
            return true;
    }

    return false;
}

/* =========================================================
   TOUCH
========================================================= */

function bindTouch(
    element,
    code
){

    const start = e => {

        e.preventDefault();

        keys[code]=true;
    };

    const end = e => {

        e.preventDefault();

        keys[code]=false;
    };

    element.addEventListener(
        "pointerdown",
        start
    );

    element.addEventListener(
        "pointerup",
        end
    );

    element.addEventListener(
        "pointercancel",
        end
    );

    element.addEventListener(
        "pointerleave",
        end
    );
}

/* =========================
   COLLISION
========================= */

function checkTrafficCollision(){

    const px =
        car.position.x;

    const pz =
        car.position.z;

    const collisionDistance =
        1.55;

    for(
        const npc of traffic
    ){

        const dx =
            npc.mesh.position.x - px;

        const dz =
            npc.mesh.position.z - pz;

        const distSq =
            dx*dx + dz*dz;

        if(
            distSq <
            collisionDistance *
            collisionDistance
        ){

            speed *= -.25;

            const dist =
                Math.sqrt(
                    Math.max(
                        distSq,
                        .0001
                    )
                );

            car.position.x -=
                dx/dist*.08;

            car.position.z -=
                dz/dist*.08;
        }
    }
}

/* =========================
   WORLD BOUNDS
========================= */

function keepInsideWorld(){

    const limit =
        totalSize/2 - 2;

    if(car.position.x > limit)
        car.position.x = limit;

    if(car.position.x < -limit)
        car.position.x = -limit;

    if(car.position.z > limit)
        car.position.z = limit;

    if(car.position.z < -limit)
        car.position.z = -limit;
}

/* =========================================================
   TRAFFIC UPDATE
========================================================= */

function updateTraffic(dt){

    for(
        const npc of traffic
    ){

        npc.mesh.position.z +=
            npc.speed * dt * 60;

        if(
            npc.mesh.position.z >
            totalSize/2 + 15
        ){

            npc.mesh.position.z =
                -totalSize/2 - 15;
        }
    }
}

/* =========================================================
   VEHICLE UPDATE
========================================================= */

function updateVehicle(dt){

    const throttle =
        pressed(
            "KeyW",
            "ArrowUp"
        );

    const brake =
        pressed(
            "KeyS",
            "ArrowDown"
        );

    const left =
        pressed(
            "KeyA",
            "ArrowLeft"
        );

    const right =
        pressed(
            "KeyD",
            "ArrowRight"
        );

    const handBrake =
        pressed("Space");

    /* =====================
       ACCELERATION
    ===================== */

    if(throttle){

        speed +=
            vehicleData.acceleration *
            dt;

    }
    else if(brake){

        if(speed > .03){

            speed -=
                vehicleData.brake *
                dt;

        }
        else{

            speed -=
                vehicleData.reverse *
                dt;
        }

    }
    else{

        speed *=
            Math.pow(
                .985,
                dt*60
            );
    }

    /* =====================
       LIMIT
    ===================== */

    const max =
        vehicleData.maxSpeed;

    if(speed > max)
        speed=max;

    if(speed < -vehicleData.reverse)
        speed=-vehicleData.reverse;

    /* =====================
       HANDBRAKE
    ===================== */

    if(handBrake){

        speed *=
            Math.pow(
                .92,
                dt*60
            );
    }

    /* =====================
       STEERING
    ===================== */

    let steerTarget=0;

    if(left)
        steerTarget=-1;

    if(right)
        steerTarget=1;

    steering +=
        (
            steerTarget -
            steering
        ) *
        Math.min(
            1,
            dt*8
        );

    const steerStrength =
        vehicleData.turn *
        Math.min(
            1,
            Math.abs(speed) /
            Math.max(
                .1,
                vehicleData.maxSpeed
            )
        );

    carAngle +=
        steering *
        steerStrength *
        speed *
        dt *
        2.2;

    /* =====================
       MOVE
    ===================== */

    forward.set(
        Math.sin(carAngle),
        0,
        Math.cos(carAngle)
    );

    car.position.x +=
        forward.x *
        speed *
        dt *
        60;

    car.position.z +=
        forward.z *
        speed *
        dt *
        60;

    /* =====================
       ROTATION
    ===================== */

    car.rotation.y =
        carAngle;

    /* =====================
       WHEEL STEERING
    ===================== */

    const wheelSteer =
        steering*.55;

    if(frontLeftWheel)
        frontLeftWheel.rotation.y =
            wheelSteer;

    if(frontRightWheel)
        frontRightWheel.rotation.y =
            wheelSteer;

    /* =====================
       ASSIST
    ===================== */

    if(savedAssist){

        const maxLateral =
            vehicleData.grip;

        if(Math.abs(steering)<.05){

            car.rotation.z *=
                Math.pow(
                    .92,
                    dt*60
                );
        }
    }

    keepInsideWorld();

    checkTrafficCollision();
}

function updateCamera(dt){

    if(!savedDynamicCamera){

        targetCamera.set(
            car.position.x,

            car.position.z + 7.0
        );

    else{

        const cameraDistance =
            selectedCar === "truck"

        targetCamera.set(
            car.position.x -

            (
                selectedCar === "truck"
                    ? 4.7
                    : 3.8
            ),

            car.position.z -
            forward.z *
            cameraDistance
        );
    }

    camera.position.lerp(
        targetCamera,
        Math.min(
            1,
            dt*5
        )
    );

    targetLook.set(
        car.position.x +
        forward.x*2.5,

        car.position.y +
        .5,

        car.position.z +
        forward.z*2.5
    );

    camera.lookAt(
        targetLook
    );
}

/* =========================================================
   MINIMAP
========================================================= */

const mapCanvas =
    document.getElementById(
        "mapCanvas"
    );

const mapCtx =
    mapCanvas.getContext("2d");

let lastMapUpdate=0;

function updateMinimap(time){

    if(time-lastMapUpdate < 100)
        return;

    lastMapUpdate=time;

    const w =
        mapCanvas.width;

    const h =
        mapCanvas.height;

    mapCtx.fillStyle =
        savedNight
            ? "#07101b"
            : "#18201b";

    mapCtx.fillRect(
        0,
        0,
        w,
        h
    );

    const scale =
        w / totalSize;

    /* roads */

    mapCtx.strokeStyle =
        "#555b63";

    mapCtx.lineWidth =
        roadWidth*scale;

    for(let i=0;i<citySize;i++){

        const p =
            (
                i*blockSize -
                cityOffset +
                blockSize/2
            )*scale +
            w/2;

        mapCtx.beginPath();

        mapCtx.moveTo(
            p,
            0
        );

        mapCtx.lineTo(
            p,
            h
        );

        mapCtx.stroke();

        mapCtx.beginPath();

        mapCtx.moveTo(
            0,
            p
        );

        mapCtx.lineTo(
            w,
            p
        );

        mapCtx.stroke();
    }

    /* player */

    const px =
        car.position.x*scale +
        w/2;

    const pz =
        car.position.z*scale +
        h/2;

    mapCtx.save();

    mapCtx.translate(
        px,
        pz
    );

    mapCtx.rotate(
        carAngle
    );

    mapCtx.fillStyle =
        "#1769ff";

    mapCtx.beginPath();

    mapCtx.moveTo(
        0,
        -7
    );

    mapCtx.lineTo(
        5,
        6
    );

    mapCtx.lineTo(
        -5,
        6
    );

    mapCtx.closePath();

    mapCtx.fill();

    mapCtx.restore();

    /* traffic */

    mapCtx.fillStyle =
        "#ff3030";

    for(
        const npc of traffic
    ){

        const x =
            npc.mesh.position.x*scale+
            w/2;

        const z =
            npc.mesh.position.z*scale+
            h/2;

        mapCtx.fillRect(
            x-3,
            z-3,
            6,
            6
        );
    }
}

    speed=0;
    steering=0;
    carAngle=0;

    car.rotation.set(
        0,
        0,
        0
    );
}

document.getElementById(
    "resetBtn"
).addEventListener(
    "click",
    resetCar
);

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                quality.pixelRatio
            )
        );
    }
);

/* =========================================================
   START
========================================================= */

let firstFrame=true;

function animate(time){

    if(firstFrame){

        firstFrame=false;

        document.getElementById(
            "loading"
        ).style.display="none";
    }

    if(paused){

        renderer.render(
            scene,
            camera
        );

        return;
    }

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    updateVehicle(dt);

    updateTraffic(dt);

    updateCamera(dt);

    updateHUD();

    updateMinimap(time);

    updatePerformance(time);

    updateDayNight(time);

    renderer.render(
        scene,
        camera
    );
}

/* =========================================================
   START ANIMATION
========================================================= */

renderer.setAnimationLoop(
    animate
);

   DEBUG
========================================================= */

    "Zentro Drive V2"
);

console.log(

    selectedCar
);

console.log(
    "Color:",
    selectedColor
);

console.log(
    "Quality:",
    savedQuality
);

console.log(
    "Traffic:",
    trafficCount
);

</script>
