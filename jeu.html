<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Zentro Drive V2</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070b;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* =========================
   HUD
========================= */

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
}

#top{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    gap:10px;
}

.panel{
    background:rgba(5,8,14,.80);
    border:1px solid rgba(255,255,255,.12);
    border-radius:15px;

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

#logo{
    padding:10px 14px;
    font-size:17px;
    font-weight:900;
    letter-spacing:3px;
}

#vehicleName{
    margin-top:4px;
    color:#9ca8b8;
    font-size:9px;
    letter-spacing:1px;
}

#stats{
    display:flex;
    gap:6px;
    padding:7px;
}

.stat{
    min-width:70px;
    text-align:center;
}

.statLabel{
    color:#8490a0;
    font-size:8px;
    text-transform:uppercase;
}

.statValue{
    margin-top:2px;
    font-size:16px;
    font-weight:900;
}

#speed{
    color:#4d8dff;
}

#fps{
    color:#57df91;
}

#gear{
    color:white;
}

/* =========================
   BUTTONS
========================= */

#buttons{
    position:absolute;
    right:12px;
    top:90px;

    display:flex;
    flex-direction:column;
    gap:7px;

    pointer-events:auto;
}

.gameButton{
    width:43px;
    height:43px;

    border:none;
    border-radius:13px;

    background:rgba(5,8,14,.82);
    border:1px solid rgba(255,255,255,.12);

    color:white;
    font-size:17px;

    cursor:pointer;
}

.gameButton:hover{
    background:#1769ff;
}

/* =========================
   MINIMAP
========================= */

#minimap{
    position:absolute;

    right:12px;
    bottom:12px;

    width:165px;
    height:165px;

    border-radius:16px;

    overflow:hidden;

    background:#11151b;

    border:1px solid rgba(255,255,255,.15);
}

#map{
    width:100%;
    height:100%;
}

/* =========================
   INFOS
========================= */

#info{
    position:absolute;
    left:12px;
    bottom:12px;

    display:flex;
    gap:7px;

    flex-wrap:wrap;
}

.infoBox{
    padding:7px 10px;

    font-size:9px;
    color:#9ca8b8;
}

.infoBox b{
    color:white;
}

/* =========================
   HELP
========================= */

#help{
    position:absolute;

    left:50%;
    bottom:15px;

    transform:translateX(-50%);

    padding:7px 12px;

    border-radius:10px;

    background:rgba(5,8,14,.72);

    color:#a4adbb;

    font-size:9px;

    white-space:nowrap;
}

/* =========================
   MOBILE
========================= */

#mobile{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:30;
}

#directionButtons{
    position:absolute;

    left:15px;
    bottom:18px;

    display:flex;
    gap:8px;
}

#pedalButtons{
    position:absolute;

    right:15px;
    bottom:18px;

    display:flex;
    gap:8px;
}

.touch{
    width:62px;
    height:62px;

    border-radius:17px;

    border:1px solid rgba(255,255,255,.16);

    background:rgba(5,8,14,.75);

    color:white;

    font-size:23px;
    font-weight:900;

    pointer-events:auto;

    touch-action:none;
    user-select:none;
}

.touch:active{
    background:#1769ff;
    transform:scale(.95);
}

/* =========================
   PAUSE
========================= */

#pauseScreen{
    position:fixed;
    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.7);

    backdrop-filter:blur(10px);
}

.pauseBox{
    width:min(420px,90vw);

    padding:30px;

    border-radius:23px;

    background:#090d15;

    border:1px solid rgba(255,255,255,.12);

    text-align:center;
}

.pauseBox h1{
    font-size:32px;
    margin-bottom:8px;
}

.pauseBox p{
    color:#8994a4;
    margin-bottom:20px;
}

.pauseButtons{
    display:flex;
    gap:9px;
}

.pauseBtn{
    flex:1;

    padding:13px;

    border:none;
    border-radius:12px;

    background:#1769ff;

    color:white;

    font-weight:800;

    cursor:pointer;
}

.pauseBtn.secondary{
    background:#171d28;
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;

    z-index:200;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:#05070b;
}

.loadingLogo{
    font-size:38px;
    font-weight:1000;
    letter-spacing:8px;
}

.loadingText{
    margin-top:10px;
    color:#7f8998;
    font-size:11px;
}

.loadingBar{
    width:190px;
    height:4px;

    margin-top:20px;

    overflow:hidden;

    border-radius:10px;

    background:#161d28;
}

.loadingBar div{
    width:40%;
    height:100%;

    background:#1769ff;

    animation:loading 1s infinite;
}

@keyframes loading{

    from{
        transform:translateX(-150%);
    }

    to{
        transform:translateX(500%);
    }

}

@media(max-width:700px){

    #top{
        top:7px;
        left:7px;
        right:7px;
    }

    #logo{
        padding:8px 10px;
        font-size:13px;
    }

    #stats{
        padding:5px;
    }

    .stat{
        min-width:52px;
    }

    .statValue{
        font-size:12px;
    }

    .statLabel{
        font-size:6px;
    }

    #minimap{
        width:125px;
        height:125px;

        right:7px;
        bottom:95px;
    }

    #buttons{
        right:7px;
        top:70px;
    }

    #help{
        display:none;
    }

    #info{
        left:7px;
        bottom:7px;
    }

    .infoBox{
        font-size:7px;
        padding:5px 7px;
    }

}

</style>
</head>

<body>

<div id="game"></div>

<!-- HUD -->

<div id="hud">

    <div id="top">

        <div class="panel" id="logo">

            ZENTRO

            <div id="vehicleName">
                STREET
            </div>

        </div>

        <div class="panel" id="stats">

            <div class="stat">

                <div class="statLabel">
                    Vitesse
                </div>

                <div class="statValue">

                    <span id="speed">0</span>

                    <small>km/h</small>

                </div>

            </div>

            <div class="stat">

                <div class="statLabel">
                    FPS
                </div>

                <div
                    class="statValue"
                    id="fps"

                    60
                </div>

            </div>

            <div class="stat">

                    class="statValue"

        W / ↑ ACCÉLÉRER
        ·

        ·

</div>

<!-- MOBILE -->

<div id="mobile">

    <div id="directionButtons">

        <button
            class="touch"

        <button

    </div>

    <div id="pedalButtons">

        <button
            class="touch"
            id="brakeButton"
        >
            ▼
        </button>

        <button
            class="touch"
            id="gasButton"
        >
            ▲
        </button>

    </div>

</div>

<!-- PAUSE -->

<div id="pauseScreen">

    <div class="pauseBox">

        <h1>
            PAUSE
        </h1>

        <p>
            Zentro Drive
        </p>

        <div class="pauseButtons">

            <button
                class="pauseBtn"
                id="resumeButton"
            >
                ▶ Reprendre
            </button>

            <button
                class="pauseBtn secondary"
                id="pauseHomeButton"

                🏠 Menu
            </button>

        </div>

    </div>

</div>

<!-- LOADING -->

<div id="loading">

    <div class="loadingLogo">
        ZENTRO
    </div>

    <div class="loadingText">

        <div></div>

</div>

<!-- THREE.JS -->

<script type="importmap">
{
    "imports":{
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from "three";

/* =========================================================
   ZENTRO DRIVE
========================================================= */

/* =========================
   LOCAL STORAGE
========================= */

const selectedCar =
    localStorage.getItem("zentroCar")
    || "street";

const selectedColor =
    localStorage.getItem("zentroColor")
    || "#1769ff";

const qualityName =
    localStorage.getItem("zentroQuality")
    || "balanced";

const trafficSetting =
    localStorage.getItem("zentroTraffic")
    || "medium";

const citySetting =
    localStorage.getItem("zentroCityDetail")
    || "medium";

const nightMode =
    localStorage.getItem("zentroNight")
    === "true";

/* =========================
   VEHICLES
========================= */

const VEHICLES = {

    street:{
        name:"Zentro Street",
        maxSpeed:.65,
        acceleration:.55,
        brake:.90,
        reverse:.30,
        turn:1.55,
        width:1.15,
        length:2.10
    },

    formula:{
        name:"Zentro Formula",
        maxSpeed:.95,
        acceleration:.82,
        brake:1.10,
        reverse:.22,
        turn:1.75,
        width:1.15,
        length:2.00
    },

    van:{
        name:"Zentro Van",
        maxSpeed:.48,
        acceleration:.38,
        brake:.72,
        reverse:.24,
        turn:1.10,
        width:1.25,
        length:2.25
    },

    truck:{
        name:"Zentro Truck",
        maxSpeed:.34,
        acceleration:.24,
        brake:.58,
        reverse:.18,
        turn:.78,
        width:1.45,
        length:2.70
    }

};

const vehicle =
    VEHICLES[selectedCar]
    || VEHICLES.street;

/* =========================
   QUALITY
========================= */

const QUALITY = {

    ultra:{
        pixel:.45,
        buildings:100,
        trees:35,
        traffic:3,
        view:110
    },

    balanced:{
        pixel:.60,
        buildings:150,
        trees:55,
        traffic:5,
        view:140
    },

    quality:{
        pixel:.75,
        buildings:200,
        trees:75,
        traffic:7,
        view:170
    }

};

const quality =
    QUALITY[qualityName]
    || QUALITY.balanced;

/* =========================
   HUD
========================= */

document.getElementById(
    "vehicleName"
).textContent =
    vehicle.name.toUpperCase();

document.getElementById(
    "carInfo"
).textContent =
    vehicle.name;

document.getElementById(
    "qualityInfo"
).textContent =
    qualityName;

/* =========================
   SCENE
========================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        nightMode
            ? 0x07111e
            : 0x82add8
    );

scene.fog =
    new THREE.Fog(

        nightMode
            ? 0x07111e
            : 0x82add8,

        55,
        quality.view

    );

/* =========================
   CAMERA
========================= */

const camera =
    new THREE.PerspectiveCamera(

        65,

        window.innerWidth /
        window.innerHeight,

        .1,

        400

    );

/* =========================
   RENDERER
========================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias:false,

        powerPreference:
            "high-performance"

    });

renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        quality.pixel
    )

);

renderer.setSize(

    window.innerWidth,
    window.innerHeight

);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.shadowMap.enabled =
    false;

document
    .getElementById("game")
    .appendChild(
        renderer.domElement
    );

/* =========================
   LIGHT
========================= */

const hemisphere =
    new THREE.HemisphereLight(

        nightMode
            ? 0x345070
            : 0xd9ebff,

        nightMode
            ? 0x111827
            : 0x536048,

        nightMode
            ? 1.0
            : 1.5

    );

scene.add(
    hemisphere
);

const sunlight =
    new THREE.DirectionalLight(

        nightMode
            ? 0x5d78a0
            : 0xffffff,

        nightMode
            ? .35
            : 1.2

    );

sunlight.position.set(
    -80,
    100,
    -50
);

scene.add(
    sunlight
);

/* =========================
   MATERIALS
========================= */

const roadMaterial =
    new THREE.MeshBasicMaterial({
        color:0x20242b
    });

const grassMaterial =
    new THREE.MeshBasicMaterial({
        color:0x315637
    });

const lineMaterial =
    new THREE.MeshBasicMaterial({
        color:0xf4efc8
    });

const buildingMaterial =
    new THREE.MeshLambertMaterial({
        color:0x69717d
    });

const treeMaterial =
    new THREE.MeshLambertMaterial({
        color:0x2f6b38
    });

/* =========================
   CITY
========================= */

const CITY = 10;
const BLOCK = 12;
const ROAD = 5;
const TOTAL = CITY * BLOCK;
const OFFSET = TOTAL / 2;

/* =========================
   GROUND
========================= */

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            400,
            400
        ),

        grassMaterial

    );

ground.rotation.x =
    -Math.PI / 2;

scene.add(
    ground
);

/* =========================
   ROADS
========================= */

function createRoads(){

    const group =
        new THREE.Group();

    const vertical =
        new THREE.BoxGeometry(
            ROAD,
            .04,
            TOTAL
        );

    for(
        let i=0;
        i<CITY;
        i++
    ){

        const road =
            new THREE.Mesh(
                vertical,
                roadMaterial
            );

        road.position.set(

            i * BLOCK -
            OFFSET +
            BLOCK / 2,

            .02,

            0

        );

        group.add(
            road
        );

    }

    const horizontal =
        new THREE.BoxGeometry(
            TOTAL,
            .04,
            ROAD
        );

    for(
        let i=0;
        i<CITY;
        i++
    ){

        const road =
            new THREE.Mesh(
                horizontal,
                roadMaterial
            );

        road.position.set(

            0,

            .021,

            i * BLOCK -
            OFFSET +
            BLOCK / 2

        );

        group.add(
            road
        );

    }

    scene.add(
        group
    );

}

createRoads();

/* =========================
   ROAD LINES
========================= */

function createRoadLines(){

    const geometry =
        new THREE.BoxGeometry(
            .10,
            .045,
            1.5
        );

    const max =
        CITY *
        CITY *
        20;

    const mesh =
        new THREE.InstancedMesh(

            geometry,
            lineMaterial,
            max

        );

    const dummy =
        new THREE.Object3D();

    let index=0;

    for(
        let x=0;
        x<CITY;
        x++
    ){

        const roadX =
            x * BLOCK -
            OFFSET +
            BLOCK / 2;

        for(
            let z=-OFFSET;
            z<OFFSET;
            z+=4
        ){

            if(
                index>=max
            ){

                break;

            }

            dummy.position.set(

                roadX,
                .055,
                z

            );

            dummy.rotation.set(
                0,
                0,
                0
            );

            dummy.scale.set(
                1,
                1,
                1
            );

            dummy.updateMatrix();

            mesh.setMatrixAt(
                index,
                dummy.matrix
            );

            index++;

        }

    }

    mesh.count =
        index;

    scene.add(
        mesh
    );

}

createRoadLines();

/* =========================
   BUILDINGS
========================= */

function createBuildings(){

    let count =
        quality.buildings;

    if(
        citySetting === "low"
    ){

        count=90;

    }

    if(
        citySetting === "high"
    ){

        count+=60;

    }

    const geometry =
        new THREE.BoxGeometry(
            1,
            1,
            1
        );

    const mesh =
        new THREE.InstancedMesh(

            geometry,
            buildingMaterial,
            count

        );

    const dummy =
        new THREE.Object3D();

    let index=0;

    for(
        let x=0;
        x<CITY;
        x++
    ){

        for(
            let z=0;
            z<CITY;
            z++
        ){

            const centerX =
                x * BLOCK -
                OFFSET +
                BLOCK / 2;

            const centerZ =
                z * BLOCK -
                OFFSET +
                BLOCK / 2;

            const positions=[

                [-3,-3],
                [3,-3],
                [-3,3],
                [3,3]

            ];

            for(
                let p=0;
                p<positions.length;
                p++
            ){

                if(
                    index>=count
                ){

                    break;

                }

                const px =
                    centerX +
                    positions[p][0];

                const pz =
                    centerZ +
                    positions[p][1];

                const height =
                    2.5 +
                    (
                        (
                            x*17 +
                            z*9 +
                            p*3
                        ) % 7
                    ) * .7;

                const width =
                    2.2 +
                    (
                        (x+z+p)%4
                    ) * .2;

                const depth =
                    2.2 +
                    (
                        (x*2+z+p)%4
                    ) * .2;

                dummy.position.set(

                    px,
                    height/2,
                    pz

                );

                dummy.scale.set(

                    width,
                    height,
                    depth

                );

                dummy.rotation.y =
                    (
                        (x+z+p)%3
                    ) * .08;

                dummy.updateMatrix();

                mesh.setMatrixAt(
                    index,
                    dummy.matrix
                );

                index++;

            }

        }

    }

    mesh.count =
        index;

    scene.add(
        mesh
    );

}

createBuildings();

/* =========================
   TREES
========================= */

function createTrees(){

    const count =
        citySetting === "low"
            ? 25
            : quality.trees;

    const trunkGeometry =
        new THREE.CylinderGeometry(
            .09,
            .12,
            .65,
            6
        );

    const leavesGeometry =
        new THREE.ConeGeometry(
            .45,
            1.2,
            7
        );

    const trunkMaterial =
        new THREE.MeshBasicMaterial({
            color:0x583a26
        });

    const trunks =
        new THREE.InstancedMesh(

            trunkGeometry,
            trunkMaterial,
            count

        );

    const leaves =
        new THREE.InstancedMesh(

            leavesGeometry,
            treeMaterial,
            count

        );

    const dummy =
        new THREE.Object3D();

    for(
        let i=0;
        i<count;
        i++
    ){

        const gx =
            (i*37)%CITY;

        const gz =
            (i*61)%CITY;

        const x =
            gx*BLOCK -
            OFFSET +
            1.7;

        const z =
            gz*BLOCK -
            OFFSET +
            1.7;

        dummy.position.set(
            x,
            .32,
            z
        );

        dummy.scale.set(
            1,
            1,
            1
        );

        dummy.updateMatrix();

        trunks.setMatrixAt(
            i,
            dummy.matrix
        );

        dummy.position.y =
            1.0;

        dummy.updateMatrix();

        leaves.setMatrixAt(
            i,
            dummy.matrix
        );

    }

    scene.add(
        trunks
    );

    scene.add(
        leaves
    );

}

createTrees();

/* =========================
   PLAYER CAR
========================= */

const car =
    new THREE.Group();

scene.add(
    car
);

const bodyMaterial =
    new THREE.MeshLambertMaterial({

        color:
            new THREE.Color(
                selectedColor
            )

    });

const blackMaterial =
    new THREE.MeshLambertMaterial({
        color:0x101318
    });

const glassMaterial =
    new THREE.MeshBasicMaterial({

        color:0x142338,

        transparent:true,

        opacity:.85

    });

const whiteLight =
    new THREE.MeshBasicMaterial({
        color:0xffffff
    });

const redLight =
    new THREE.MeshBasicMaterial({
        color:0xff2020
    });

const wheels=[];

let frontWheelLeft=null;
let frontWheelRight=null;

/* =========================
   BOX HELPER
========================= */

function box(

    width,
    height,
    depth,
    material,
    x,
    y,
    z

){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            material

        );

    mesh.position.set(
        x,
        y,
        z
    );

    return mesh;

}

/* =========================
   WHEEL
========================= */

function wheel(

    x,
    z,

            event.code==="ArrowUp" ||
            event.code==="ArrowDown" ||
            event.code==="ArrowLeft" ||
            event.code==="ArrowRight" ||
            event.code==="Space"

        ){

            event.preventDefault();

        }

        if(
            event.code==="KeyP"
        ){

            togglePause();

        }

    },

    {
        passive:false
    }

);

window.addEventListener(

    "keyup",

    function(event){

        keys[event.code]=false;

    }

);

/* =========================
   INPUT
========================= */

function isPressed(...codes){

    for(
        const code of codes
    ){

        if(
            keys[code]
        ){

            return true;

        }

    }

    return false;

}

/* =========================
   VEHICLE UPDATE
========================= */

function updateVehicle(dt){

    const gas =
        isPressed(
            "KeyW",
            "ArrowUp"
        );

    const brake =
        isPressed(
            "KeyS",
            "ArrowDown"
        );

    const left =
        isPressed(
            "KeyA",
            "ArrowLeft"
        );

    const right =
        isPressed(
            "KeyD",
            "ArrowRight"
        );

    const handBrake =
        isPressed(
            "Space"
        );

    /* =====================
       ACCELERATION
    ===================== */

    if(gas){

        speed +=
            vehicle.acceleration *
            dt;

    }
    else if(brake){

        if(
            speed > .025
        ){

            speed -=
                vehicle.brake *
                dt;

        }
        else{

            speed -=
                vehicle.reverse *
                dt;

        }

    }
    else{

        speed *=
            Math.pow(
                .985,
                dt*60
            );

    }

    /* =====================
       LIMIT
    ===================== */

    speed =
        THREE.MathUtils.clamp(

            speed,

            -vehicle.reverse,

            vehicle.maxSpeed

        );

    /* =====================
       HANDBRAKE
    ===================== */

    if(handBrake){

        speed *=
            Math.pow(
                .90,
                dt*60
            );

    }

    /* =====================
       STEERING
    ===================== */

    let targetSteering=0;

    /*
       A = -1
       = gauche

       D = +1
       = droite
    */

    if(left){

        targetSteering=-1;

    }

    if(right){

        targetSteering=1;

    }

    steering +=

        (
            targetSteering -
            steering
        )

        *

        Math.min(
            1,
            dt*10
        );

    /* =====================
       TURN
    ===================== */

    const speedRatio =
        Math.min(

            1,

            Math.abs(speed) /
            vehicle.maxSpeed

        );

    const reverseSign =
        speed >= 0
            ? 1
            : -1;

    /*
       CORRECTION IMPORTANTE :

       Le signe "-" fait maintenant :

       A -> GAUCHE
       D -> DROITE

       Tout le reste utilise
       exactement le même angle.
    */

    carAngle -=

        steering *

        vehicle.turn *

        (
            .12 +
            speedRatio*.88
        ) *

        reverseSign *

        dt;

    /* =====================
       FORWARD
    ===================== */

    forward.set(

        Math.sin(
            carAngle
        ),

        0,

        Math.cos(
            carAngle
        )

    );

    /* =====================
       MOVEMENT
    ===================== */

    const movementSpeed =
        speed *
        dt *
        60;

    car.position.x +=
        forward.x *
        movementSpeed;

    car.position.z +=
        forward.z *
        movementSpeed;

    /* =====================
       ROTATION
    ===================== */

    car.rotation.y =
        carAngle;

    car.rotation.x=0;
    car.rotation.z=0;

    /* =====================
       WHEELS
    ===================== */

    if(
        frontWheelLeft
    ){

        frontWheelLeft.rotation.y =
            steering*.55;

    }

    if(
        frontWheelRight
    ){

        frontWheelRight.rotation.y =
            steering*.55;

    }

    /* =====================
       WORLD LIMIT
    ===================== */

    const limit =
        TOTAL/2-2;

    if(
        car.position.x > limit
    ){

        car.position.x=limit;

        speed*=.4;

    }

    if(
        car.position.x < -limit
    ){

        car.position.x=-limit;

        speed*=.4;

    }

    if(
        car.position.z > limit
    ){

        car.position.z=limit;

        speed*=.4;

    }

    if(
        car.position.z < -limit
    ){

        car.position.z=-limit;

        speed*=.4;

    }

}

/* =========================
   COLLISION
========================= */

function collisionCheck(){

    const collisionDistance =
        1.55;

    for(
        const npc of traffic
    ){

        const dx =
            npc.mesh.position.x -
            car.position.x;

        const dz =
            npc.mesh.position.z -
            car.position.z;

        const distanceSquared =
            dx*dx+
            dz*dz;

        if(

            distanceSquared <
            collisionDistance *
            collisionDistance

        ){

            speed*=.25;

        }

    }

}

        )

    );

        car.position.x +
        forward.x*2.5,

        car.position.y +
        .45,

        car.position.z +
        forward.z*2.5

    );

    camera.lookAt(
        cameraLook
    );

}

/* =========================
   MINIMAP
========================= */

const mapCanvas =
    document.getElementById(
        "map"
    );

const mapContext =
    mapCanvas.getContext(
        "2d"
    );

let mapTimer=0;

function updateMinimap(time){

    if(
        time-mapTimer < 100
    ){

        return;

    }

    mapTimer=time;

    const w =
        mapCanvas.width;

    const h =
        mapCanvas.height;

    mapContext.fillStyle =
        nightMode
            ? "#08111b"
            : "#172019";

    mapContext.fillRect(
        0,
        0,
        w,
        h
    );

    const scale =
        w/TOTAL;

    /* ROADS */

    mapContext.strokeStyle =
        "#565c63";

    mapContext.lineWidth =
        ROAD*scale;

    for(
        let i=0;
        i<CITY;
        i++
    ){

        const p =

            (
                i*BLOCK -
                OFFSET +
                BLOCK/2
            ) *
            scale +
            w/2;

        mapContext.beginPath();

        mapContext.moveTo(
            p,
            0
        );

        mapContext.lineTo(
            p,
            h
        );

        mapContext.stroke();

        mapContext.beginPath();

        mapContext.moveTo(
            0,
            p
        );

        mapContext.lineTo(
            w,
            p
        );

        mapContext.stroke();

    }

    /* PLAYER */

    const playerX =

        car.position.x *
        scale +
        w/2;

    const playerZ =

        car.position.z *
        scale +
        h/2;

    mapContext.save();

    mapContext.translate(
        playerX,
        playerZ
    );

    mapContext.rotate(
        carAngle
    );

    mapContext.fillStyle =
        "#1769ff";

    mapContext.beginPath();

    mapContext.moveTo(
        0,
        9
    );

    mapContext.lineTo(
        -5,
        -5
    );

    mapContext.lineTo(
        5,
        -5
    );

    mapContext.closePath();

    mapContext.fill();

    mapContext.restore();

    /* TRAFFIC */

    mapContext.fillStyle =
        "#ff3030";

    for(
        const npc of traffic
    ){

        const x =

            npc.mesh.position.x *
            scale +
            w/2;

        const z =

            npc.mesh.position.z *
            scale +
            h/2;

        mapContext.fillRect(

            x-3,
            z-3,
            6,
            6

        );

    }

}

      ↓
      -Z
    CAMERA
*/

camera.position.set(
    0,
    4,
    -7
);

camera.lookAt(
    0,
    .5,
    3
);

/* =========================
   CLOCK
========================= */

const clock =
    new THREE.Clock();

let firstFrame=true;

/* =========================
   GAME LOOP
========================= */

function animate(time){

    if(firstFrame){

        firstFrame=false;

        document.getElementById(
            "loading"
        ).style.display =
            "none";

    }

    if(paused){

        renderer.render(
            scene,
            camera
        );

        return;

    }

    const dt =

        Math.min(
            clock.getDelta(),
            .05
        );

    updateVehicle(dt);

    updateTraffic(dt);

    collisionCheck();

    updateCamera(dt);

    updateHUD();

    updateMinimap(time);

    updateFPS(time);

    renderer.render(
        scene,
        camera
    );

}

/* =========================
   START LOOP
========================= */

renderer.setAnimationLoop(
    animate
);
