<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zentro Drive</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070a;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    width:100%;
    height:100%;
    display:block;
}

#loading{
    position:fixed;
    inset:0;
    background:#05070a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:20;
}

#loading h1{
    font-size:42px;
    margin:0 0 10px;
}

#loading p{
    opacity:.7;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    color:white;
    z-index:5;
    text-shadow:0 2px 5px #000;
    pointer-events:none;
}

#speed{
    font-size:34px;
    font-weight:bold;
}

#unit{
    font-size:14px;
    opacity:.7;
}

#controls{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

.btn{
    position:absolute;
    width:75px;
    height:75px;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    border:2px solid rgba(255,255,255,.3);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    user-select:none;
    pointer-events:auto;
    backdrop-filter:blur(8px);
}

#left{left:20px;bottom:25px}
#right{left:110px;bottom:25px}
#brake{right:110px;bottom:25px}
#gas{right:20px;bottom:25px}

#boost{
    right:20px;
    bottom:115px;
    width:65px;
    height:65px;
    font-size:18px;
}

@media (min-width:900px){
    .btn{
        opacity:.55;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="loading">
    <h1>ZENTRO</h1>
    <p>Chargement de la ville...</p>
</div>

<div id="hud">
    <div id="speed">0</div>
    <div id="unit">KM/H</div>
</div>

<div id="controls">
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
    <div class="btn" id="brake">↙</div>
    <div class="btn" id="gas">▲</div>
    <div class="btn" id="boost">NITRO</div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

/* =========================
   BASE 3D
========================= */

const canvas=document.getElementById("game");

const renderer=new THREE.WebGLRenderer({
    canvas,
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.5)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x91b7d4);

scene.fog=new THREE.Fog(
    0x91b7d4,
    100,
    500
);

/* =========================
   CAMERA
========================= */

const camera=new THREE.PerspectiveCamera(
    65,
    window.innerWidth/window.innerHeight,
    .1,
    1000
);

camera.position.set(
    0,
    5,
    10
);

/* =========================
   LIGHTING
========================= */

const hemi=new THREE.HemisphereLight(
    0xbfdcff,
    0x39432f,
    2
);

scene.add(hemi);

const sun=new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(
    -80,
    120,
    60
);

sun.castShadow=true;

sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;

sun.shadow.camera.left=-100;
sun.shadow.camera.right=100;
sun.shadow.camera.top=100;
sun.shadow.camera.bottom=-100;

scene.add(sun);

/* =========================
   SOL
========================= */

const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(1000,1000),
    new THREE.MeshStandardMaterial({
        color:0x496348,
        roughness:1
    })
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);

/* =========================
   ROUTES
========================= */

const roadMat=new THREE.MeshStandardMaterial({
    color:0x24272a,
    roughness:.95
});

const sidewalkMat=new THREE.MeshStandardMaterial({
    color:0x777777,
    roughness:1
});

function createRoad(x,z,w,d){

    const road=new THREE.Mesh(
        new THREE.BoxGeometry(w,.08,d),
        roadMat
    );

    road.position.set(x,.04,z);
    road.receiveShadow=true;

    scene.add(road);

    /* trottoirs */

    const side1=new THREE.Mesh(
        new THREE.BoxGeometry(w+2,.15,2),
        sidewalkMat
    );

    side1.position.set(
        x,.075,z-d/2-1
    );

    scene.add(side1);

    const side2=side1.clone();

    side2.position.z=z+d/2+1;

    scene.add(side2);
}

/* Grande grille urbaine */

for(let i=-200;i<=200;i+=50){

    createRoad(
        i,
        0,
        10,
        450
    );

    createRoad(
        0,
        i,
        450,
        10
    );
}

/* =========================
   IMMEUBLES
========================= */

function building(x,z,w,d,h){

    const mat=new THREE.MeshStandardMaterial({
        color:new THREE.Color(
            0.25+
            Math.random()*.25,
            0.25+
            Math.random()*.25,
            0.28+
            Math.random()*.25
        ),
        roughness:.8
    });

    const b=new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        mat
    );

    b.position.set(
        x,
        h/2,
        z
    );

    b.castShadow=true;
    b.receiveShadow=true;

    scene.add(b);

    /* fenêtres simples */

    for(let yy=5;yy<h-2;yy+=5){

        for(let xx=-w/2+2;xx<w/2-1;xx+=4){

            const win=new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.5,
                    1.8,
                    .08
                ),
                new THREE.MeshStandardMaterial({
                    color:0x91b9cc,
                    emissive:0x112233
                })
            );

            win.position.set(
                x+xx,
                yy,
                z-d/2-.05
            );

            scene.add(win);
        }
    }
}

/* Génération de la ville */

for(let x=-225;x<=225;x+=25){

    for(let z=-225;z<=225;z+=25){

        const nearRoad=
            Math.abs(x%50)<15 ||
            Math.abs(z%50)<15;

        if(!nearRoad){

            const h=
                12+
                Math.random()*45;

            building(
                x+(Math.random()*4-2),
                z+(Math.random()*4-2),
                18,
                18,
                h
            );
        }
    }
}

/* =========================
   ARBRES
========================= */

function tree(x,z){

    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .3,
            .4,
            3
        ),
        new THREE.MeshStandardMaterial({
            color:0x60412c
        })
    );

    trunk.position.set(x,1.5,z);

    scene.add(trunk);

    const crown=new THREE.Mesh(
        new THREE.SphereGeometry(
            2.5,
            10,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0x1e5b31
        })
    );

    crown.position.set(
        x,
        4,
        z
    );

    crown.castShadow=true;

    scene.add(crown);
}

for(let i=0;i<120;i++){

    const x=
        Math.round(
            (Math.random()*440-220)/10
        )*10;

    const z=
        Math.round(
            (Math.random()*440-220)/10
        )*10;

    if(
        Math.abs(x%50)>8 &&
        Math.abs(z%50)>8
    ){
        tree(x,z);
    }
}

/* =========================
   VOITURE
========================= */

const car=new THREE.Group();

scene.add(car);

car.position.set(
    0,
    .7,
    0
);

/* carrosserie */

const bodyMat=new THREE.MeshStandardMaterial({
    color:0x155fbd,
    metalness:.75,
    roughness:.22
});

const body=new THREE.Mesh(
    new THREE.BoxGeometry(
        2.15,
        .55,
        4.5
    ),
    bodyMat
);

body.position.y=.65;

body.castShadow=true;

car.add(body);

/* toit */

const roof=new THREE.Mesh(
    new THREE.BoxGeometry(
        1.75,
        .55,
        2.2
    ),
    bodyMat
);

roof.position.set(
    0,
    1.15,
    .25
);

roof.rotation.x=.02;

roof.castShadow=true;

car.add(roof);

/* vitres */

const glassMat=new THREE.MeshStandardMaterial({
    color:0x111a22,
    metalness:.5,
    roughness:.08
});

const glass=new THREE.Mesh(
    new THREE.BoxGeometry(
        1.65,
        .42,
        1.8
    ),
    glassMat
);

glass.position.set(
    0,
    1.18,
    .25
);

car.add(glass);

/* roues */

const wheelMat=new THREE.MeshStandardMaterial({
    color:0x090909,
    roughness:.8
});

const wheels=[];

for(const x of [-1.05,1.05]){

    for(const z of [-1.5,1.5]){

        const wheel=new THREE.Mesh(
            new THREE.CylinderGeometry(
                .42,
                .42,
                .28,
                16
            ),
            wheelMat
        );

        wheel.rotation.z=Math.PI/2;

        wheel.position.set(
            x,
            .42,
            z
        );

        wheel.castShadow=true;

        car.add(wheel);

        wheels.push(wheel);
    }
}

/* phares */

const headLightMat=
    new THREE.MeshStandardMaterial({
        color:0xffffff,
        emissive:0xffffff,
        emissiveIntensity:3
    });

for(const x of [-.7,.7]){

    const light=new THREE.Mesh(
        new THREE.BoxGeometry(
            .4,
            .18,
            .08
        ),
        headLightMat
    );

    light.position.set(
        x,
        .78,
        -2.28
    );

    car.add(light);
}

/* =========================
   FEUX
========================= */

const rearLightMat=
    new THREE.MeshStandardMaterial({
        color:0xff0000,
        emissive:0xff0000,
        emissiveIntensity:2
    });

for(const x of [-.7,.7]){

    const light=new THREE.Mesh(
        new THREE.BoxGeometry(
            .45,
            .18,
            .08
        ),
        rearLightMat
    );

    light.position.set(
        x,
        .75,
        2.28
    );

    car.add(light);
}

/* =========================
   PNJ VOITURES
========================= */

const traffic=[];

function createTraffic(){

    const c=new THREE.Group();

    const mat=new THREE.MeshStandardMaterial({
        color:
            new THREE.Color().setHSL(
                Math.random(),
                .65,
                .45
            )
    });

    const b=new THREE.Mesh(
        new THREE.BoxGeometry(
            1.9,
            .55,
            3.8
        ),
        mat
    );

    b.position.y=.55;

    c.add(b);

    const wmat=new THREE.MeshStandardMaterial({
        color:0x080808
    });

    for(const x of [-.9,.9]){
        for(const z of [-1.2,1.2]){

            const w=new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .35,
                    .35,
                    .25,
                    12
                ),
                wmat
            );

            w.rotation.z=Math.PI/2;

            w.position.set(
                x,
                .35,
                z
            );

            c.add(w);
        }
    }

    c.position.set(
        (Math.floor(Math.random()*9)-4)*50,
        .5,
        (Math.floor(Math.random()*9)-4)*50
    );

    c.userData.speed=
        0.04+
        Math.random()*.05;

    scene.add(c);

    traffic.push(c);
}

for(let i=0;i<25;i++){
    createTraffic();
}

/* =========================
   PHYSIQUE
========================= */

let speed=0;
let steering=0;

const maxSpeed=.85;
const reverseSpeed=-.35;

let accelerating=false;
let braking=false;
let boost=false;

const keys={};

window.addEventListener(
    "keydown",
    e=>{
        keys[e.key.toLowerCase()]=true;

        if(e.key==="ArrowUp")
            accelerating=true;

        if(e.key==="ArrowDown")
            braking=true;

        if(e.key==="ArrowLeft")
            steering=-1;

        if(e.key==="ArrowRight")
            steering=1;

        if(e.code==="Space")
            boost=true;
    }
);

window.addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;

        if(e.key==="ArrowUp")
            accelerating=false;

        if(e.key==="ArrowDown")
            braking=false;

        if(e.key==="ArrowLeft" ||
           e.key==="ArrowRight")
            steering=0;

        if(e.code==="Space")
            boost=false;
    }
);

/* =========================
   TOUCH
========================= */

function touchButton(id,down,up){

    const el=document.getElementById(id);

    el.addEventListener(
        "touchstart",
        e=>{
            e.preventDefault();
            down();
        },
        {passive:false}
    );

    el.addEventListener(
        "touchend",
        e=>{
            e.preventDefault();
            up();
        },
        {passive:false}
    );
}

touchButton(
    "gas",
    ()=>accelerating=true,
    ()=>accelerating=false
);

touchButton(
    "brake",
    ()=>braking=true,
    ()=>braking=false
);

touchButton(
    "left",
    ()=>steering=-1,
    ()=>steering=0
);

touchButton(
    "right",
    ()=>steering=1,
    ()=>steering=0
);

touchButton(
    "boost",
    ()=>boost=true,
    ()=>boost=false
);

/* =========================
   PHYSIQUE DE CONDUITE
========================= */

function updateCar(){

    if(accelerating){

        speed+=.018;

    }else{

        speed*=.985;
    }

    if(braking){

        speed-=.035;
    }

    if(boost){

        speed+=.025;
    }

    speed=
        Math.max(
            reverseSpeed,
            Math.min(
                boost ? 1.25 : maxSpeed,
                speed
            )
        );

    /* direction */

    car.rotation.y+=
        steering*
        speed*
        .045;

    car.translateZ(
        -speed
    );

    /* roues */

    for(const w of wheels){

        w.rotation.x+=speed*.5;
    }

    /* légère suspension */

    car.position.y=
        .7+
        Math.sin(
            performance.now()*.01
        )*.015;
}

/* =========================
   TRAFIC
========================= */

function updateTraffic(){

    for(const c of traffic){

        c.translateZ(
            -c.userData.speed
        );

        if(c.position.z<-230){
            c.position.z=230;
        }
    }
}

/* =========================
   CAMERA
========================= */

function updateCamera(){

    const offset=
        new THREE.Vector3(
            0,
            4.3,
            8
        );

    offset.applyQuaternion(
        car.quaternion
    );

    const target=
        car.position.clone()
        .add(offset);

    camera.position.lerp(
        target,
        .08
    );

    const look=
        car.position.clone();

    look.y+=.8;

    camera.lookAt(look);
}

/* =========================
   HUD
========================= */

const speedText=
    document.getElementById("speed");

function updateHUD(){

    const kmh=
        Math.abs(speed)*120;

    speedText.textContent=
        Math.round(kmh);
}

/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    ()=>{
        camera.aspect=
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

/* =========================
   START
========================= */

setTimeout(
    ()=>{
        document.getElementById(
            "loading"
        ).style.display="none";
    },
    1200
);

/* =========================
   GAME LOOP
========================= */

const clock=new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    clock.getDelta();

    updateCar();
    updateTraffic();
    updateCamera();
    updateHUD();

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>

</body>
</html>
