/* =========================================================
   BUILDINGS
========================================================= */

const buildingMats = [

    0x747b83,
    0x8a8f94,
    0x59616a,
    0x6f625a,
    0x4e5960,
    0x78736a

];


function createBuilding(
    x,
    z,
    w,
    d,
    h
){

    const mat =
        new THREE.MeshStandardMaterial({
            color:
                buildingMats[
                    Math.floor(
                        Math.random() *
                        buildingMats.length
                    )
                ],
            roughness:.8
        });

    const building =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            mat
        );

    building.position.set(
        x,
        h/2,
        z
    );

    building.castShadow = true;
    building.receiveShadow = true;

    scene.add(building);


    /* fenêtres */

    const windowMat =
        new THREE.MeshBasicMaterial({
            color:0x9ed8ff
        });


    const rows =
        Math.max(
            1,
            Math.floor(h/5)
        );

    const cols =
        Math.max(
            1,
            Math.floor(w/4)
        );


    for(
        let r=0;
        r<rows;
        r++
    ){

        for(
            let c=0;
            c<cols;
            c++
        ){

            if(
                Math.random() < .3
            ) continue;


            const win =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .7,
                        1,
                        .08
                    ),
                    windowMat
                );

            win.position.set(

                x -
                w/2 +
                1.5 +
                c*3.2,

                2.5 +
                r*4,

                z +
                d/2 +
                .05

            );

            scene.add(win);

        }

    }

}

            x,
            z,
            w,
            d,
            h

}

/* =========================================================
   VOITURE DE SECOURS
========================================================= */

function createFallbackCar(){

    const car =
        new THREE.Group();


    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.3,
                .65,
                4.7
            ),

            new THREE.MeshPhysicalMaterial({
                color:0x050505,
                metalness:1,
                roughness:.22,
                clearcoat:1
            })

        );

    body.position.y =
        .85;

    body.castShadow = true;

    car.add(body);


    const roof =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.75,
                .55,
                2.2
            ),

            new THREE.MeshPhysicalMaterial({
                color:0x090909,
                metalness:.8,
                roughness:.2
            })

        );

    roof.position.set(
        0,
        1.35,
        -.1
    );

    roof.castShadow = true;

    car.add(roof);


    const glass =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.65,
                .35,
                1.9
            ),

            new THREE.MeshPhysicalMaterial({
                color:0x071018,
                metalness:.2,
                roughness:.08,
                transmission:.1
            })

        );

    glass.position.set(
        0,
        1.55,
        -.1
    );

    car.add(glass);


    const wheelMat =
        new THREE.MeshStandardMaterial({
            color:0x050505,
            roughness:.8
        });


    const wheelGeo =
        new THREE.CylinderGeometry(
            .48,
            .48,
            .35,
            20
        );


    const wheels=[];


    [
        [-1.15,.5,1.5],
        [1.15,.5,1.5],
        [-1.15,.5,-1.5],
        [1.15,.5,-1.5]
    ].forEach(
        p=>{

            const wheel =
                new THREE.Mesh(
                    wheelGeo,
                    wheelMat
                );

            wheel.rotation.z =
                Math.PI/2;

            wheel.position.set(
                ...p
            );

            wheel.castShadow = true;

            car.add(wheel);

            wheels.push(wheel);

        }
    );


    car.userData.wheels =
        wheels;


    return car;

}

/* =========================================================
   CHARGEMENT FERRARI THREE.JS
========================================================= */

const FERRARI_URL =
"https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/ferrari.glb";


const loader =
    new GLTFLoader();


loader.load(

    FERRARI_URL,

    function(gltf){

        const model =
            gltf.scene;


        /* taille */

        model.scale.set(
            1.35,
            1.35,
            1.35
        );


        model.position.set(
            0,
            .25,
            0
        );


        model.rotation.y =
            Math.PI;


        /* ombres */

        model.traverse(
            function(obj){

                if(
                    obj.isMesh
                ){

                    obj.castShadow =
                        true;

                    obj.receiveShadow =
                        true;

                    if(
                        obj.material
                    ){

                        obj.material.needsUpdate =
                            true;

                    }

                }

            }
        );


        /* noir brillant */

        model.traverse(
            function(obj){

                if(
                    obj.isMesh &&
                    obj.material
                ){

                    if(
                        obj.name
                            .toLowerCase()
                            .includes("body")
                    ){

                        obj.material =
                            new THREE.MeshPhysicalMaterial({

                                color:0x030303,

                                metalness:1,

                                roughness:.22,

                                clearcoat:1,

                                clearcoatRoughness:.04

                            });

                    }

                }

            }
        );


        scene.remove(car);

        car =
            model;

        scene.add(car);


        car.position.set(
            0,
            .25,
            18
        );


        document.getElementById(
            "loadingText"
        ).textContent =
            "Ville chargée";


        setTimeout(
            ()=>{
                document.getElementById(
                    "loading"
                ).style.display =
                    "none";
            },
            400
        );

    },

    undefined,

    function(error){

        console.warn(
            "Ferrari GLB non chargé :",
            error
        );


        document.getElementById(
            "loadingText"
        ).textContent =
            "Zentro Drive prêt";


        setTimeout(
            ()=>{
                document.getElementById(
                    "loading"
                ).style.display =
                    "none";
            },
            500
        );

    }

);

/* =========================================================
   CONTROLES
========================================================= */

const keys={

    forward:false,
    back:false,
    left:false,
    right:false,
    brake:false

};


function setKey(
    key,
    value
){

    if(
        key==="ArrowUp" ||
        key==="w" ||
        key==="W"
    )
        keys.forward=value;


    if(
        key==="ArrowDown" ||
        key==="s" ||
        key==="S"
    )
        keys.back=value;


    if(
        key==="ArrowLeft" ||
        key==="a" ||
        key==="A"
    )
        keys.left=value;


    if(
        key==="ArrowRight" ||
        key==="d" ||
        key==="D"
    )
        keys.right=value;


    if(
        key===" "
    )
        keys.brake=value;

}


addEventListener(
    "keydown",
    e=>{
        setKey(
            e.key,
            true
        );
    }
);


addEventListener(
    "keyup",
    e=>{
        setKey(
            e.key,
            false
        );
    }
);


/* =========================================================
   TOUCH
========================================================= */

function touchButton(
    id,
    key
){

    const el =
        document.getElementById(id);


    const down =
        e=>{
            e.preventDefault();
            keys[key]=true;
        };


    const up =
        e=>{
            e.preventDefault();
            keys[key]=false;
        };


    el.addEventListener(
        "pointerdown",
        down
    );

    el.addEventListener(
        "pointerup",
        up
    );

    el.addEventListener(
        "pointercancel",
        up
    );

    el.addEventListener(
        "pointerleave",
        up
    );

}


touchButton(
    "left",
    "left"
);

touchButton(
    "right",
    "right"
);

touchButton(
    "forward",
    "forward"
);

touchButton(
    "brake",
    "brake"
);


/* =========================================================
   PHYSIQUE
========================================================= */

let velocity=0;

let steering=0;

const clock =
    new THREE.Clock();


function resetCar(){

    car.position.set(
        0,
        .25,
        18
    );

    car.rotation.y =
        Math.PI;

    velocity=0;

    steering=0;

}


document.getElementById(
    "reset"
).onclick =
    resetCar;


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .033
        );


    /* accélération */

    if(
        keys.forward
    ){

        velocity +=
            25 * dt;

    }


    if(
        keys.back
    ){

        velocity -=
            16 * dt;

    }


    if(
        keys.brake
    ){

        velocity *=
            Math.pow(
                .02,
                dt
            );

    }


    /* friction */

    if(
        !keys.forward &&
        !keys.back
    ){

        velocity *=
            Math.pow(
                .35,
                dt
            );

    }


    velocity =
        THREE.MathUtils.clamp(
            velocity,
            -15,
            52
        );


    /* direction */

    const targetSteer =
        (
            keys.left
                ? 1
                : 0
        )
        -
        (
            keys.right
                ? 1
                : 0
        );


    steering =
        THREE.MathUtils.lerp(
            steering,
            targetSteer,
            1-Math.pow(
                .001,
                dt
            )
        );


    car.rotation.y +=
        steering *
        velocity *
        .012 *
        dt *
        60;


    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyQuaternion(
        car.quaternion
    );


    car.position.addScaledVector(
        forward,
        velocity*dt
    );


    /* =====================================================
       FLAMMES
    ===================================================== */

    const flame =
        keys.forward &&
        velocity > 12 &&
        Math.random() < .25;


    if(
        flameLeft &&
        flameRight
    ){

        flameLeft.visible =
            flame;

        flameRight.visible =
            flame;

        if(flame){

            const s =
                .7 +
                Math.random()*.8;

            flameLeft.scale.set(
                s,
                s,
                s
            );

            flameRight.scale.set(
                s,
                s,
                s
            );

        }

    }


    /* =====================================================
       TRAFIC
    ===================================================== */

    for(
        const t of traffic
    ){

        t.position.z +=
            t.userData.speed *
            dt;


        if(
            t.position.z > 400
        ){

            t.position.z =
                -400;

        }

    }


    /* =====================================================
       CAMERA
    ===================================================== */

    const camOffset =
        new THREE.Vector3(
            0,
            4.5,
            10
        );


    camOffset.applyQuaternion(
        car.quaternion
    );


    const targetCam =
        car.position
            .clone()
            .add(
                camOffset
            );


    camera.position.lerp(
        targetCam,
        1-Math.pow(
            .001,
            dt
        )
    );


    const look =
        car.position
            .clone();


    look.y +=
        1.2;


    camera.lookAt(
        look
    );


    /* =====================================================
       HUD
    ===================================================== */

    document.getElementById(
        "speed"
    ).textContent =
        Math.round(
            Math.abs(velocity)*3.6
        ) +
        " km/h";


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{
        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
