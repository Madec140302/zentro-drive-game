<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>ZENTRO DRIVE</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#loading{
    position:fixed;
    inset:0;
    background:#050505;
    color:white;
    z-index:20;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

#loading h1{
    font-size:44px;
    letter-spacing:6px;
    margin:0 0 10px;
}

#loading p{
    opacity:.7;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,.45);
    padding:12px 16px;
    border-radius:12px;
}

#speed{
    font-size:30px;
    font-weight:bold;
}

#fps{
    font-size:12px;
    opacity:.7;
}

#reset{
    position:fixed;
    right:15px;
    top:15px;
    z-index:10;
    border:0;
    border-radius:10px;
    padding:11px 15px;
    font-weight:bold;
}

#touch{
    position:fixed;
    bottom:18px;
    left:0;
    right:0;
    z-index:10;
    display:flex;
    justify-content:space-between;
    padding:0 18px;
    pointer-events:none;
}

.group{
    display:flex;
    gap:10px;
    pointer-events:auto;
}

.btn{
    width:64px;
    height:64px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(0,0,0,.45);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    user-select:none;
    touch-action:none;
}
</style>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>
</head>

<body>

<div id="loading">
    <h1>ZENTRO</h1>
    <p>Chargement de la ville...</p>
</div>

<div id="hud">
    <div id="speed">0 km/h</div>
    <div id="fps">FPS : --</div>
</div>

<button id="reset">↻ RESET</button>

<div id="touch">

    <div class="group">
        <div class="btn" id="left">◀</div>
        <div class="btn" id="right">▶</div>
    </div>

    <div class="group">
        <div class="btn" id="brake">●</div>
        <div class="btn" id="forward">▲</div>
    </div>

</div>


<script type="module">

import * as THREE from "three";


/* =====================================================
   SCÈNE
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x8fb9d8);

scene.fog =
    new THREE.Fog(
        0x8fb9d8,
        80,
        400
    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        65,
        innerWidth / innerHeight,
        .1,
        700
    );

camera.position.set(
    0,
    4,
    10
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.2
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.shadowMap.enabled = false;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LUMIÈRES
===================================================== */

const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x53616b,
        2.2
    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        1.8
    );

sun.position.set(
    100,
    150,
    100
);

scene.add(sun);


/* =====================================================
   SOL
===================================================== */

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            900,
            900
        ),

        new THREE.MeshLambertMaterial({
            color:0x435143
        })

    );

ground.rotation.x =
    -Math.PI/2;

scene.add(ground);


/* =====================================================
   ROUTES
===================================================== */

const roadMaterial =
    new THREE.MeshLambertMaterial({
        color:0x24272a
    });


function createRoad(
    x,
    z,
    width,
    length
){

    const r =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                length
            ),
            roadMaterial
        );

    r.rotation.x =
        -Math.PI/2;

    r.position.set(
        x,
        .02,
        z
    );

    scene.add(r);
}


/* routes principales */

createRoad(
    0,
    0,
    30,
    900
);

createRoad(
    0,
    0,
    900,
    30
);

createRoad(
    170,
    0,
    26,
    900
);

createRoad(
    -170,
    0,
    26,
    900
);

createRoad(
    0,
    170,
    900,
    26
);

createRoad(
    0,
    -170,
    900,
    26
);


/* =====================================================
   LIGNES BLANCHES
===================================================== */

const lineMaterial =
    new THREE.MeshBasicMaterial({
        color:0xffffff
    });


function roadLine(
    x,
    z,
    w,
    d
){

    const line =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                w,
                d
            ),
            lineMaterial
        );

    line.rotation.x =
        -Math.PI/2;

    line.position.set(
        x,
        .04,
        z
    );

    scene.add(line);
}


for(
    let z=-430;
    z<430;
    z+=22
){

    roadLine(
        0,
        z,
        .35,
        9
    );

    roadLine(
        170,
        z,
        .35,
        9
    );

    roadLine(
        -170,
        z,
        .35,
        9
    );
}


for(
    let x=-430;
    x<430;
    x+=22
){

    roadLine(
        x,
        0,
        9,
        .35
    );

    roadLine(
        x,
        170,
        9,
        .35
    );

    roadLine(
        x,
        -170,
        9,
        .35
    );
}


/* =====================================================
   BÂTIMENTS
===================================================== */

const buildingMaterials = [

    new THREE.MeshLambertMaterial({
        color:0x687078
    }),

    new THREE.MeshLambertMaterial({
        color:0x77716a
    }),

    new THREE.MeshLambertMaterial({
        color:0x59636a
    }),

    new THREE.MeshLambertMaterial({
        color:0x727980
    })

];


function createBuilding(
    x,
    z
){

    const width =
        20 +
        Math.random()*12;

    const depth =
        20 +
        Math.random()*12;

    const height =
        10 +
        Math.random()*35;


    const building =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            buildingMaterials[
                Math.floor(
                    Math.random() *
                    buildingMaterials.length
                )
            ]

        );

    building.position.set(
        x,
        height/2,
        z
    );

    scene.add(
        building
    );
}


/* ville */

for(
    let x=-400;
    x<=400;
    x+=60
){

    for(
        let z=-400;
        z<=400;
        z+=60
    ){

        if(
            Math.abs(x%170)<30 ||
            Math.abs(z%170)<30
        )
            continue;


        createBuilding(
            x,
            z
        );

    }

}


/* =====================================================
   ARBRES
===================================================== */

const trunkMaterial =
    new THREE.MeshLambertMaterial({
        color:0x5a3824
    });

const leafMaterial =
    new THREE.MeshLambertMaterial({
        color:0x26733c
    });


function createTree(
    x,
    z
){

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .3,
                .4,
                2.5,
                6
            ),
            trunkMaterial
        );

    trunk.position.set(
        x,
        1.25,
        z
    );

    scene.add(
        trunk
    );


    const leaves =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.8,
                8,
                6
            ),
            leafMaterial
        );

    leaves.position.set(
        x,
        3.2,
        z
    );

    scene.add(
        leaves
    );
}


for(
    let i=0;
    i<60;
    i++
){

    const x =
        (Math.random()-.5)*750;

    const z =
        (Math.random()-.5)*750;


    if(
        Math.abs(x)<30 &&
        Math.abs(z)<30
    )
        continue;


    createTree(
        x,
        z
    );
}


/* =====================================================
   VOITURE
===================================================== */

const car =
    new THREE.Group();

scene.add(
    car
);

car.position.set(
    0,
    0,
    18
);

car.rotation.y =
    Math.PI;


/* =====================================================
   CARROSSERIE
===================================================== */

const bodyMaterial =
    new THREE.MeshPhysicalMaterial({

        color:0x050505,

        metalness:.95,

        roughness:.22,

        clearcoat:1,

        clearcoatRoughness:.05

    });


const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.35,
            .65,
            4.7
        ),

        bodyMaterial

    );

body.position.y =
    .85;

car.add(
    body
);


/* =====================================================
   CAPOT
===================================================== */

const hood =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.2,
            .25,
            1.55
        ),

        bodyMaterial

    );

hood.position.set(
    0,
    1.12,
    -1.25
);

car.add(
    hood
);


/* =====================================================
   TOIT
===================================================== */

const roofMaterial =
    new THREE.MeshPhysicalMaterial({

        color:0x070707,

        metalness:.8,

        roughness:.18,

        clearcoat:1

    });


const roof =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.72,
            .58,
            2.15
        ),

        roofMaterial

    );

roof.position.set(
    0,
    1.38,
    .05
);

car.add(
    roof
);


/* =====================================================
   VITRES
===================================================== */

const glassMaterial =
    new THREE.MeshPhysicalMaterial({

        color:0x061019,

        metalness:.2,

        roughness:.08,

        transparent:true,

        opacity:.78

    });


const windshield =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.58,
            .36,
            1.9
        ),

        glassMaterial

    );

windshield.position.set(
    0,
    1.58,
    -.15
);

car.add(
    windshield
);


/* =====================================================
   ROUES
===================================================== */

const wheelMaterial =
    new THREE.MeshStandardMaterial({
        color:0x070707,
        roughness:.8
    });


const rimMaterial =
    new THREE.MeshStandardMaterial({
        color:0x777777,
        metalness:.8,
        roughness:.25
    });


const wheelGeometry =
    new THREE.CylinderGeometry(
        .47,
        .47,
        .34,
        16
    );


const wheels=[];


function createWheel(
    x,
    z
){

    const wheel =
        new THREE.Mesh(
            wheelGeometry,
            wheelMaterial
        );

    wheel.rotation.z =
        Math.PI/2;

    wheel.position.set(
        x,
        .5,
        z
    );

    car.add(
        wheel
    );

    wheels.push(
        wheel
    );


    const rim =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .22,
                .22,
                .36,
                12
            ),

            rimMaterial

        );

    rim.rotation.z =
        Math.PI/2;

    rim.position.copy(
        wheel.position
    );

    car.add(
        rim
    );
}


createWheel(
    -1.15,
    1.45
);

createWheel(
    1.15,
    1.45
);

createWheel(
    -1.15,
    -1.45
);

createWheel(
    1.15,
    -1.45
);


/* =====================================================
   PHARES
===================================================== */

const headlightMaterial =
    new THREE.MeshBasicMaterial({
        color:0xffffff
    });


function createHeadlight(
    x
){

    const light =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .55,
                .16,
                .08
            ),

            headlightMaterial

        );

    light.position.set(
        x,
        .92,
        -2.36
    );

    car.add(
        light
    );


    const spot =
        new THREE.SpotLight(
            0xffffff,
            4,
            35,
            Math.PI/7,
            .5
        );

    spot.position.set(
        x,
        .95,
        -2.3
    );

    spot.target.position.set(
        x,
        .2,
        -18
    );

    car.add(
        spot
    );

    car.add(
        spot.target
    );
}


createHeadlight(
    -.7
);

createHeadlight(
    .7
);


/* =====================================================
   FEUX ARRIÈRE
===================================================== */

const rearMaterial =
    new THREE.MeshBasicMaterial({
        color:0xff0808
    });


const rearLeft =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .6,
            .16,
            .08
        ),

        rearMaterial

    );

rearLeft.position.set(
    -.7,
    .92,
    2.36
);

car.add(
    rearLeft
);


const rearRight =
    rearLeft.clone();

rearRight.position.x =
    .7;

car.add(
    rearRight
);


/* =====================================================
   ÉCHAPPEMENTS
===================================================== */

const exhaustMaterial =
    new THREE.MeshStandardMaterial({
        color:0x222222,
        metalness:.9,
        roughness:.25
    });


function createExhaust(
    x
){

    const exhaust =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .12,
                .12,
                .3,
                12
            ),

            exhaustMaterial

        );

    exhaust.rotation.x =
        Math.PI/2;

    exhaust.position.set(
        x,
        .62,
        2.48
    );

    car.add(
        exhaust
    );
}


createExhaust(
    -.42
);

createExhaust(
    .42
);


/* =====================================================
   FLAMMES
===================================================== */

const flameMaterial =
    new THREE.MeshBasicMaterial({

        color:0xff6a00,

        transparent:true,

        opacity:.9

    });


function createFlame(
    x
){

    const flame =
        new THREE.Mesh(

            new THREE.ConeGeometry(
                .13,
                .8,
                8
            ),

            flameMaterial

        );

    flame.rotation.x =
        Math.PI/2;

    flame.position.set(
        x,
        .62,
        2.9
    );

    flame.visible =
        false;

    car.add(
        flame
    );

    return flame;
}


const flameLeft =
    createFlame(-.42);

const flameRight =
    createFlame(.42);


/* =====================================================
   TRAFIC
===================================================== */

const traffic=[];


function createTraffic(){

    const vehicle =
        new THREE.Group();


    const material =
        new THREE.MeshLambertMaterial({

            color:
                new THREE.Color().setHSL(
                    Math.random(),
                    .65,
                    .45
                )

        });


    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.8,
                .55,
                3.7
            ),

            material

        );

    body.position.y =
        .65;

    vehicle.add(
        body
    );


    vehicle.userData.speed =
        7 +
        Math.random()*7;


    return vehicle;
}


for(
    let i=0;
    i<10;
    i++
){

    const vehicle =
        createTraffic();


    vehicle.position.set(

        i%2===0
            ? -6
            : 6,

        0,

        -300 +
        i*55

    );


    scene.add(
        vehicle
    );

    traffic.push(
        vehicle
    );
}


/* =====================================================
   CONTRÔLES
===================================================== */

const keys={

    forward:false,
    back:false,
    left:false,
    right:false,
    brake:false

};


function setKey(
    key,
    value
){

    if(
        key==="ArrowUp" ||
        key==="w" ||
        key==="W"
    )
        keys.forward=value;


    if(
        key==="ArrowDown" ||
        key==="s" ||
        key==="S"
    )
        keys.back=value;


    if(
        key==="ArrowLeft" ||
        key==="a" ||
        key==="A"
    )
        keys.left=value;


    if(
        key==="ArrowRight" ||
        key==="d" ||
        key==="D"
    )
        keys.right=value;


    if(
        key===" "
    )
        keys.brake=value;

}


addEventListener(
    "keydown",
    e=>{
        setKey(
            e.key,
            true
        );
    }
);


addEventListener(
    "keyup",
    e=>{
        setKey(
            e.key,
            false
        );
    }
);


/* =====================================================
   COMMANDES TACTILES
===================================================== */

function touchButton(
    id,
    key
){

    const button =
        document.getElementById(
            id
        );


    button.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );


    function release(e){

        e.preventDefault();
        keys[key]=false;

    }


    button.addEventListener(
        "pointerup",
        release
    );

    button.addEventListener(
        "pointercancel",
        release
    );

    button.addEventListener(
        "pointerleave",
        release
    );
}


touchButton(
    "left",
    "left"
);

touchButton(
    "right",
    "right"
);

touchButton(
    "forward",
    "forward"
);

touchButton(
    "brake",
    "brake"
);


/* =====================================================
   PHYSIQUE
===================================================== */

let velocity=0;

let steering=0;

const clock =
    new THREE.Clock();


/* =====================================================
   RESET
===================================================== */

function resetCar(){

    car.position.set(
        0,
        0,
        18
    );

    car.rotation.y =
        Math.PI;

    velocity=0;

    steering=0;
}


document.getElementById(
    "reset"
).onclick =
    resetCar;


/* =====================================================
   FPS
===================================================== */

let frames=0;

let fpsTimer=0;


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .033
        );


    /* FPS */

    frames++;

    fpsTimer+=dt;


    if(
        fpsTimer>=1
    ){

        document.getElementById(
            "fps"
        ).textContent =
            "FPS : " +
            Math.round(
                frames/fpsTimer
            );

        frames=0;

        fpsTimer=0;

    }


    /* accélération */

    if(
        keys.forward
    ){

        velocity +=
            24*dt;

    }


    if(
        keys.back
    ){

        velocity -=
            15*dt;

    }


    /* frein */

    if(
        keys.brake
    ){

        velocity *=
            Math.pow(
                .02,
                dt
            );

    }


    /* friction */

    if(
        !keys.forward &&
        !keys.back
    ){

        velocity *=
            Math.pow(
                .35,
                dt
            );

    }


    velocity =
        THREE.MathUtils.clamp(
            velocity,
            -14,
            52
        );


    /* direction */

    const targetSteering =
        (
            keys.left
            ? 1
            : 0
        )
        -
        (
            keys.right
            ? 1
            : 0
        );


    steering =
        THREE.MathUtils.lerp(
            steering,
            targetSteering,
            .12
        );


    car.rotation.y +=
        steering *
        velocity *
        .0015;


    /* déplacement */

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        car.quaternion
    );


    car.position.addScaledVector(
        direction,
        velocity*dt
    );


    /* =================================================
       ROUES
    ================================================= */

    for(
        const wheel of wheels
    ){

        wheel.rotation.x -=
            velocity *
            dt *
            2.5;

    }


    /* =================================================
       FLAMMES
    ================================================= */

    const flamesOn =
        keys.forward &&
        velocity>10 &&
        Math.random()<.3;


    flameLeft.visible =
        flamesOn;

    flameRight.visible =
        flamesOn;


    if(
        flamesOn
    ){

        const scale =
            .6 +
            Math.random()*.8;

        flameLeft.scale.set(
            scale,
            scale,
            scale
        );

        flameRight.scale.set(
            scale,
            scale,
            scale
        );

    }


    /* =================================================
       TRAFIC
    ================================================= */

    for(
        const vehicle of traffic
    ){

        vehicle.position.z +=
            vehicle.userData.speed*
            dt;


        if(
            vehicle.position.z>400
        ){

            vehicle.position.z=-400;

        }

    }


    /* =================================================
       CAMERA
    ================================================= */

    const cameraOffset =
        new THREE.Vector3(
            0,
            4,
            10
        );


    cameraOffset.applyQuaternion(
        car.quaternion
    );


    const desired =
        car.position
            .clone()
            .add(
                cameraOffset
            );


    camera.position.lerp(
        desired,
        .08
    );


    const target =
        car.position
            .clone();

    target.y+=1;


    camera.lookAt(
        target
    );


    /* =================================================
       VITESSE
    ================================================= */

    document.getElementById(
        "speed"
    ).textContent =
        Math.round(
            Math.abs(velocity)*3.6
        ) +
        " km/h";


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   RESIZE
===================================================== */

addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                1.2
            )
        );

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =====================================================
   FIN DU CHARGEMENT
===================================================== */

setTimeout(
    ()=>{
        document.getElementById(
            "loading"
        ).style.display="none";
    },
    700
);

</script>

</body>
</html>
