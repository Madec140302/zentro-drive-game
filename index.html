<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZENTRO DRIVE</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070a;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}
canvas{
  display:block;
  width:100%;
  height:100%;
}
#loading{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#05070a;
  color:white;
}
#loading h1{
  margin:0 0 12px;
  font-size:42px;
  letter-spacing:4px;
}
#loading p{color:#aaa}
#hud{
  position:fixed;
  top:18px;
  left:18px;
  z-index:5;
  color:white;
  text-shadow:0 2px 5px #000;
  pointer-events:none;
}
#logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:3px;
}
#speed{
  margin-top:8px;
  font-size:34px;
  font-weight:bold;
}
#fps{
  font-size:13px;
  color:#ddd;
}
#help{
  position:fixed;
  top:18px;
  right:18px;
  z-index:5;
  padding:9px 13px;
  border-radius:12px;
  background:rgba(0,0,0,.45);
  color:white;
  font-size:13px;
  backdrop-filter:blur(8px);
}
#touch{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
}
.btn{
  position:absolute;
  width:72px;
  height:72px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(20,25,32,.65);
  color:white;
  font-size:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:auto;
  user-select:none;
  -webkit-user-select:none;
  backdrop-filter:blur(8px);
}
#left{left:20px;bottom:30px}
#right{left:105px;bottom:30px}
#brake{right:105px;bottom:30px;font-size:22px}
#gas{right:20px;bottom:30px}
#reset{
  position:absolute;
  right:20px;
  top:80px;
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(20,25,32,.65);
  color:white;
  pointer-events:auto;
}
@media(min-width:800px){
  #touch{display:none}
}
</style>
</head>

<body>

<div id="loading">
  <h1>ZENTRO</h1>
  <p>Préparation de la ville...</p>
</div>

<div id="hud">
  <div id="logo">ZENTRO</div>
  <div id="speed">0 km/h</div>
  <div id="fps">FPS : --</div>
</div>

<div id="help">WASD / ↑↓←→</div>

<div id="touch">
  <div class="btn" id="left">◀</div>
  <div class="btn" id="right">▶</div>
  <div class="btn" id="brake">FREIN</div>
  <div class="btn" id="gas">▲</div>
  <button id="reset">↻</button>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================
   SCÈNE
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9bb4c9);

scene.fog = new THREE.Fog(
  0x9bb4c9,
  80,
  420
);

const camera = new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  0.1,
  700
);

camera.position.set(0,5,10);

const renderer = new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1,1.5)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


/* =========================
   LUMIÈRES
========================= */

const hemi = new THREE.HemisphereLight(
  0xddeeff,
  0x39404a,
  2.2
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
  0xffffff,
  3
);

sun.position.set(
  -80,
  120,
  60
);

sun.castShadow = true;

sun.shadow.mapSize.set(1024,1024);

sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);


/* =========================
   MATÉRIAUX
========================= */

const roadMat = new THREE.MeshStandardMaterial({
  color:0x25282c,
  roughness:.95
});

const sidewalkMat = new THREE.MeshStandardMaterial({
  color:0x85898b,
  roughness:1
});

const grassMat = new THREE.MeshStandardMaterial({
  color:0x3f713d,
  roughness:1
});

const buildingMats = [
  new THREE.MeshStandardMaterial({color:0x8b9298}),
  new THREE.MeshStandardMaterial({color:0xa5a0a0}),
  new THREE.MeshStandardMaterial({color:0x777f89}),
  new THREE.MeshStandardMaterial({color:0xb0aaa0}),
  new THREE.MeshStandardMaterial({color:0x666f78})
];


/* =========================
   SOL
========================= */

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(650,650),
  grassMat
);

ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;

scene.add(ground);


/* =========================
   ROUTES
========================= */

function box(w,h,d,mat,x,y,z){

  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    mat
  );

  m.position.set(x,y,z);

  m.castShadow = false;
  m.receiveShadow = true;

  scene.add(m);

  return m;
}


/* grande route centrale */

box(
  18,
  .08,
  600,
  roadMat,
  0,
  .03,
  0
);

box(
  600,
  .08,
  18,
  roadMat,
  0,
  .04,
  0
);


/* routes secondaires */

for(let i=-250;i<=250;i+=50){

  box(
    10,
    .07,
    600,
    roadMat,
    i,
    .05,
    0
  );

  box(
    600,
    .07,
    10,
    roadMat,
    0,
    .06,
    i
  );
}


/* =========================
   MARQUAGES
========================= */

const lineMat = new THREE.MeshBasicMaterial({
  color:0xffffff
});

for(let x=-270;x<=270;x+=50){

  for(let z=-280;z<280;z+=14){

    box(
      .16,
      .03,
      6,
      lineMat,
      x,
      .1,
      z
    );

  }
}

for(let z=-270;z<=270;z+=50){

  for(let x=-280;x<280;x+=14){

    box(
      6,
      .03,
      .16,
      lineMat,
      x,
      .1,
      z
    );

  }
}


/* =========================
   BÂTIMENTS
========================= */

function createBuilding(x,z){

  const width =
    14 + Math.random()*15;

  const depth =
    14 + Math.random()*15;

  const height =
    10 + Math.random()*45;

  const mat =
    buildingMats[
      Math.floor(Math.random()*buildingMats.length)
    ];

  const building = new THREE.Mesh(
    new THREE.BoxGeometry(
      width,
      height,
      depth
    ),
    mat
  );

  building.position.set(
    x,
    height/2,
    z
  );

  building.castShadow = false;
  building.receiveShadow = true;

  scene.add(building);

  /* toit */

  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(
      width+.5,
      .5,
      depth+.5
    ),
    new THREE.MeshStandardMaterial({
      color:0x30343a
    })
  );

  roof.position.set(
    x,
    height+.25,
    z
  );

  scene.add(roof);
}


/* grille de ville */

for(let x=-280;x<=280;x+=50){

  for(let z=-280;z<=280;z+=50){

    const nearRoad =
      Math.abs(x%50)<20 ||
      Math.abs(z%50)<20;

    if(!nearRoad){

      createBuilding(
        x+(Math.random()*10-5),
        z+(Math.random()*10-5)
      );

    }

  }
}


/* =========================
   ARBRES
========================= */

function tree(x,z){

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(.35,.45,4,8),
    new THREE.MeshStandardMaterial({
      color:0x65462f
    })
  );

  trunk.position.set(x,2,z);

  scene.add(trunk);

  const crown = new THREE.Mesh(
    new THREE.SphereGeometry(2.7,8,6),
    new THREE.MeshStandardMaterial({
      color:0x285a31,
      roughness:1
    })
  );

  crown.position.set(x,5,z);

  scene.add(crown);
}

for(let i=0;i<100;i++){

  const x =
    Math.round((Math.random()*560-280)/25)*25;

  const z =
    Math.round((Math.random()*560-280)/25)*25;

  if(Math.abs(x)<35 || Math.abs(z)<35)
    continue;

  tree(x,z);
}


/* =========================
   VOITURE
========================= */

const car = new THREE.Group();

scene.add(car);

car.position.set(
  0,
  .65,
  20
);


/* carrosserie */

const bodyMat = new THREE.MeshStandardMaterial({
  color:0x1c4f91,
  metalness:.75,
  roughness:.25
});

const body = new THREE.Mesh(
  new THREE.BoxGeometry(
    2.1,
    .55,
    4.2
  ),
  bodyMat
);

body.position.y=.35;
body.castShadow=true;

car.add(body);


/* toit */

const roof = new THREE.Mesh(
  new THREE.BoxGeometry(
    1.75,
    .65,
    2.15
  ),
  bodyMat
);

roof.position.set(
  0,
  .85,
  -.25
);

roof.castShadow=true;

car.add(roof);


/* vitres */

const glassMat = new THREE.MeshStandardMaterial({
  color:0x111b27,
  metalness:.5,
  roughness:.1
});

const windshield = new THREE.Mesh(
  new THREE.BoxGeometry(
    1.58,
    .48,
    .05
  ),
  glassMat
);

windshield.position.set(
  0,
  .92,
  .9
);

windshield.rotation.x=-.25;

car.add(windshield);

const rearGlass = windshield.clone();

rearGlass.position.z=-1.35;
rearGlass.rotation.x=.25;

car.add(rearGlass);


/* roues */

const wheelMat = new THREE.MeshStandardMaterial({
  color:0x090909,
  roughness:.8
});

const wheels=[];

function createWheel(x,z){

  const wheel = new THREE.Mesh(
    new THREE.CylinderGeometry(
      .42,
      .42,
      .28,
      16
    ),
    wheelMat
  );

  wheel.rotation.z=Math.PI/2;

  wheel.position.set(
    x,
    .27,
    z
  );

  wheel.castShadow=true;

  car.add(wheel);

  wheels.push(wheel);

  return wheel;
}

createWheel(-1.08,-1.35);
createWheel(1.08,-1.35);
createWheel(-1.08,1.35);
createWheel(1.08,1.35);


/* phares */

const headlightMat =
  new THREE.MeshBasicMaterial({
    color:0xffffff
  });

function headlight(x,z){

  const h = new THREE.Mesh(
    new THREE.BoxGeometry(
      .45,
      .18,
      .08
    ),
    headlightMat
  );

  h.position.set(
    x,
    .48,
    z
  );

  car.add(h);
}

headlight(-.62,2.08);
headlight(.62,2.08);


/* =========================
   FEUX
========================= */

const redMat =
  new THREE.MeshBasicMaterial({
    color:0xff1010
  });

function taillight(x){

  const h = new THREE.Mesh(
    new THREE.BoxGeometry(
      .42,
      .18,
      .08
    ),
    redMat
  );

  h.position.set(
    x,
    .48,
    -2.08
  );

  car.add(h);
}

taillight(-.62);
taillight(.62);


/* =========================
   TRAFIC
========================= */

const traffic=[];

function createTraffic(){

  const t = new THREE.Group();

  const mat =
    new THREE.MeshStandardMaterial({
      color:
        [0xb92323,0xf0f0f0,0x111111,0xc8a832]
        [Math.floor(Math.random()*4)],
      metalness:.5,
      roughness:.35
    });

  const b = new THREE.Mesh(
    new THREE.BoxGeometry(
      2,
      .65,
      4
    ),
    mat
  );

  b.position.y=.55;

  t.add(b);

  for(const x of [-1,1]){

    const w = new THREE.Mesh(
      new THREE.CylinderGeometry(
        .38,.38,.25,12
      ),
      wheelMat
    );

    w.rotation.z=Math.PI/2;
    w.position.set(x, .28, 1.25);

    t.add(w);

    const w2=w.clone();
    w2.position.z=-1.25;

    t.add(w2);
  }

  t.position.set(
    (Math.random()>.5?1:-1)*4.5,
    0,
    Math.random()*500-250
  );

  scene.add(t);

  traffic.push({
    mesh:t,
    speed:8+Math.random()*12
  });
}

for(let i=0;i<14;i++)
  createTraffic();


/* =========================
   CONTRÔLES
========================= */

const keys={
  forward:false,
  backward:false,
  left:false,
  right:false
};

function setKey(k,v){

  if(k==="w"||k==="ArrowUp")
    keys.forward=v;

  if(k==="s"||k==="ArrowDown")
    keys.backward=v;

  if(k==="a"||k==="ArrowLeft")
    keys.left=v;

  if(k==="d"||k==="ArrowRight")
    keys.right=v;
}

addEventListener("keydown",e=>{
  setKey(e.key,true);
});

addEventListener("keyup",e=>{
  setKey(e.key,false);
});


/* =========================
   TOUCH
========================= */

function touchButton(id,key){

  const el=document.getElementById(id);

  const down=e=>{
    e.preventDefault();
    keys[key]=true;
  };

  const up=e=>{
    e.preventDefault();
    keys[key]=false;
  };

  el.addEventListener("pointerdown",down);
  el.addEventListener("pointerup",up);
  el.addEventListener("pointercancel",up);
  el.addEventListener("pointerleave",up);
}

touchButton("left","left");
touchButton("right","right");
touchButton("gas","forward");
touchButton("brake","backward");


document.getElementById("reset")
.addEventListener("click",()=>{
  car.position.set(0,.65,20);
  car.rotation.y=0;
  velocity=0;
});


/* =========================
   PHYSIQUE
========================= */

let velocity=0;
let steering=0;

const maxSpeed=48;
const reverseSpeed=-18;
const acceleration=25;
const braking=35;
const friction=8;

const clock=new THREE.Clock();

function updateCar(dt){

  if(keys.forward){

    velocity += acceleration*dt;

  }else if(keys.backward){

    velocity -= braking*dt;

  }else{

    if(velocity>0)
      velocity=Math.max(
        0,
        velocity-friction*dt
      );

    if(velocity<0)
      velocity=Math.min(
        0,
        velocity+friction*dt
      );
  }

  velocity=THREE.MathUtils.clamp(
    velocity,
    reverseSpeed,
    maxSpeed
  );


  const targetSteer =
    (keys.left?-1:0)+
    (keys.right?1:0);

  steering=THREE.MathUtils.lerp(
    steering,
    targetSteer,
    Math.min(1,dt*8)
  );


  const speedFactor =
    Math.min(Math.abs(velocity)/20,1);

  car.rotation.y -=
    steering *
    .035 *
    speedFactor;


  const direction =
    new THREE.Vector3(
      Math.sin(car.rotation.y),
      0,
      Math.cos(car.rotation.y)
    );

  car.position.addScaledVector(
    direction,
    velocity*dt
  );


  /* limites de la ville */

  car.position.x=
    THREE.MathUtils.clamp(
      car.position.x,
      -290,
      290
    );

  car.position.z=
    THREE.MathUtils.clamp(
      car.position.z,
      -290,
      290
    );


  /* animation roues */

  for(const wheel of wheels){

    wheel.rotation.x -=
      velocity*dt*1.8;

  }
}


/* =========================
   TRAFIC
========================= */

function updateTraffic(dt){

  for(const t of traffic){

    t.mesh.position.z +=
      t.speed*dt;

    if(t.mesh.position.z>300)
      t.mesh.position.z=-300;

  }
}


/* =========================
   CAMÉRA
========================= */

const cameraTarget=new THREE.Vector3();

function updateCamera(dt){

  const behind =
    new THREE.Vector3(
      0,
      4.5,
      -9
    );

  behind.applyQuaternion(
    car.quaternion
  );

  const desired =
    car.position.clone()
    .add(behind);

  camera.position.lerp(
    desired,
    1-Math.pow(.001,dt)
  );

  cameraTarget.lerp(
    car.position.clone()
      .add(new THREE.Vector3(0,1,0)),
    1-Math.pow(.0005,dt)
  );

  camera.lookAt(cameraTarget);
}


/* =========================
   FPS
========================= */

let frames=0;
let fpsTime=0;

function updateHUD(dt){

  frames++;
  fpsTime+=dt;

  if(fpsTime>=.5){

    const fps=
      Math.round(frames/fpsTime);

    document.getElementById("fps")
      .textContent=
      "FPS : "+fps;

    frames=0;
    fpsTime=0;
  }

  document.getElementById("speed")
    .textContent=
    Math.round(Math.abs(velocity)*3.6)
    +" km/h";
}


/* =========================
   REDIMENSIONNEMENT
========================= */

addEventListener("resize",()=>{

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

});


/* =========================
   DÉMARRAGE
========================= */

document.getElementById("loading")
  .style.display="none";


/* =========================
   BOUCLE
========================= */

function animate(){

  requestAnimationFrame(animate);

  const dt=
    Math.min(clock.getDelta(),.05);

  updateCar(dt);
  updateTraffic(dt);
  updateCamera(dt);
  updateHUD(dt);

  renderer.render(
    scene,
    camera
  );
}

animate();

</script>

</body>
</html>
