<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZENTRO DRIVE</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:Arial,sans-serif;
}

canvas{display:block}

#loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#050505;
    color:white;
}

#loading h1{
    margin:0;
    font-size:42px;
    letter-spacing:8px;
}

#loading p{
    color:#aaa;
    margin:12px 0;
}

#start{
    display:none;
    margin-top:20px;
    padding:14px 25px;
    border:0;
    border-radius:12px;
    background:white;
    color:#111;
    font-weight:bold;
    cursor:pointer;
}

#hud{
    position:fixed;
    z-index:20;
    top:15px;
    left:15px;
    color:white;
    text-shadow:0 2px 8px #000;
    pointer-events:none;
}

#logo{
    font-size:22px;
    font-weight:bold;
    letter-spacing:4px;
}

#speed{
    margin-top:6px;
    font-size:34px;
    font-weight:bold;
}

#speed small{
    font-size:13px;
    color:#ccc;
}

#info,#fps{
    font-size:11px;
    color:#ccc;
    margin-top:4px;
}

button{
    font-family:Arial,sans-serif;
}

#reset,#dayNight{
    position:fixed;
    z-index:30;
    right:15px;
    border:1px solid #555;
    background:rgba(0,0,0,.55);
    color:white;
    border-radius:10px;
    padding:10px 13px;
    cursor:pointer;
}

#reset{top:15px}
#dayNight{top:62px}

#touch{
    position:fixed;
    z-index:30;
    left:0;
    right:0;
    bottom:15px;
    display:flex;
    justify-content:space-between;
    padding:0 18px;
    pointer-events:none;
}

.group{
    display:flex;
    gap:10px;
}

.touch{
    width:65px;
    height:65px;
    border-radius:50%;
    border:1px solid #777;
    background:rgba(0,0,0,.5);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
    pointer-events:auto;
    user-select:none;
}

@media(min-width:900px){
    #touch{display:none}
}
</style>
</head>

<body>

<div id="loading">
    <h1>ZENTRO</h1>
    <p id="loadText">Préparation de la ville...</p>
    <button id="start">ENTRER DANS LE JEU 🚗</button>
</div>

<div id="hud">
    <div id="logo">ZENTRO DRIVE</div>
    <div id="speed">0 <small>KM/H</small></div>
    <div id="info">WASD / FLÈCHES • ESPACE = FREIN</div>
    <div id="fps">FPS: --</div>
</div>

<button id="reset">↻ RESET</button>
<button id="dayNight">☀️ JOUR</button>

<div id="touch">
    <div class="group">
        <div class="touch" id="left">←</div>
        <div class="touch" id="right">→</div>
    </div>

    <div class="group">
        <div class="touch" id="brake">■</div>
        <div class="touch" id="forward">▲</div>
    </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {GLTFLoader} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================================================
   VARIABLES
========================================================= */

let scene;
let camera;
let renderer;

let player;
let playerModel;

let speed = 0;
let steering = 0;

let night = false;

let flame1;
let flame2;

let traffic = [];

const keys = {
    forward:false,
    backward:false,
    left:false,
    right:false,
    brake:false
};

const clock = new THREE.Clock();

let fpsFrames = 0;
let fpsTimer = performance.now();


/* =========================================================
   SCÈNE
========================================================= */

scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x87b8e8);

scene.fog =
    new THREE.Fog(
        0x87b8e8,
        80,
        420
    );


/* =========================================================
   CAMÉRA
========================================================= */

camera =
    new THREE.PerspectiveCamera(
        65,
        innerWidth/innerHeight,
        .1,
        1000
    );

camera.position.set(
    0,
    5,
    12
);


/* =========================================================
   RENDERER
========================================================= */

renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled = true;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.1;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LUMIÈRES
========================================================= */

const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x39434d,
        2
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    100,
    150,
    80
);

sun.castShadow = true;

sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;

scene.add(sun);


/* =========================================================
   SOL
========================================================= */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            1000,
            1000
        ),
        new THREE.MeshStandardMaterial({
            color:0x444a46,
            roughness:1
        })
    );

ground.rotation.x =
    -Math.PI/2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================================================
   ROUTES
========================================================= */

function road(
    x,
    z,
    width,
    depth
){

    const r =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .08,
                depth
            ),
            new THREE.MeshStandardMaterial({
                color:0x202124,
                roughness:1
            })
        );

    r.position.set(
        x,
        .04,
        z
    );

    r.receiveShadow = true;

    scene.add(r);
}

road(0,0,18,1000);
road(0,0,1000,18);

road(90,0,14,1000);
road(-90,0,14,1000);

road(0,90,1000,14);
road(0,-90,1000,14);


/* =========================================================
   LIGNES
========================================================= */

const lineMat =
    new THREE.MeshBasicMaterial({
        color:0xffffff
    });

for(
    let z=-480;
    z<480;
    z+=20
){

    const l =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .3,
                .03,
                8
            ),
            lineMat
        );

    l.position.set(
        0,
        .1,
        z
    );

    scene.add(l);
}

for(
    let x=-480;
    x<480;
    x+=20
){

    const l =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                8,
                .03,
                .3
            ),
            lineMat
        );

    l.position.set(
        x,
        .1,
        0
    );

    scene.add(l);
}


/* =========================================================
   BÂTIMENTS
========================================================= */

function createBuilding(x,z){

    const h =
        10 + Math.random()*35;

    const w =
        8 + Math.random()*15;

    const d =
        8 + Math.random()*15;

    const material =
        new THREE.MeshStandardMaterial({
            color:
                new THREE.Color().setHSL(
                    .58,
                    .08,
                    .16+Math.random()*.15
                ),
            roughness:.9
        });

    const b =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,h,d
            ),
            material
        );

    b.position.set(
        x,
        h/2,
        z
    );

    b.castShadow = true;
    b.receiveShadow = true;

    scene.add(b);
}


for(
    let x=-450;
    x<=450;
    x+=30
){

    for(
        let z=-450;
        z<=450;
        z+=30
    ){

        if(
            Math.abs(x)>20 &&
            Math.abs(z)>20
        ){

            createBuilding(
                x+(Math.random()-.5)*8,
                z+(Math.random()-.5)*8
            );
        }
    }
}


/* =========================================================
   ARBRES
========================================================= */

function tree(x,z){

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .3,
                .45,
                4,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x5a3a20
            })
        );

    trunk.position.set(
        x,
        2,
        z
    );

    trunk.castShadow=true;

    scene.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.5,
                10,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x246b38
            })
        );

    leaves.position.set(
        x,
        5,
        z
    );

    leaves.castShadow=true;

    scene.add(leaves);
}


for(let i=0;i<150;i++){

    const x =
        (Math.random()-.5)*800;

    const z =
        (Math.random()-.5)*800;

    if(
        Math.abs(x)>25 &&
        Math.abs(z)>25
    ){

        tree(x,z);
    }
}


/* =========================================================
   VOITURE
========================================================= */

player =
    new THREE.Group();

player.position.set(
    0,
    .3,
    40
);

scene.add(player);


/* =========================================================
   VOITURE DE SECOURS
   utilisée immédiatement si le GLB échoue
========================================================= */

function createFallbackCar(){

    const car =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.2,
                .65,
                4.4
            ),
            new THREE.MeshPhysicalMaterial({
                color:0x08090b,
                metalness:1,
                roughness:.25,
                clearcoat:1
            })
        );

    body.position.y=.75;

    body.castShadow=true;

    car.add(body);


    const roof =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.75,
                .65,
                2.1
            ),
            new THREE.MeshPhysicalMaterial({
                color:0x101820,
                metalness:.4,
                roughness:.12,
                transmission:.05
            })
        );

    roof.position.set(
        0,
        1.25,
        -.25
    );

    roof.castShadow=true;

    car.add(roof);


    /* roues */

    for(
        const x of [-1.05,1.05]
    ){

        for(
            const z of [-1.45,1.45]
        ){

            const wheel =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .42,
                        .42,
                        .3,
                        20
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x111111,
                        roughness:.5
                    })
                );

            wheel.rotation.z =
                Math.PI/2;

            wheel.position.set(
                x,
                .45,
                z
            );

            wheel.castShadow=true;

            car.add(wheel);
        }
    }


    /* phares */

    const white =
        new THREE.MeshBasicMaterial({
            color:0xffffff
        });

    const hl1 =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .65,
                .12,
                .05
            ),
            white
        );

    const hl2=hl1.clone();

    hl1.position.set(
        -.7,
        .9,
        2.2
    );

    hl2.position.set(
        .7,
        .9,
        2.2
    );

    car.add(
        hl1,
        hl2
    );


    /* feux */

    const red =
        new THREE.MeshBasicMaterial({
            color:0xff0000
        });

    const tl1 =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .55,
                .12,
                .05
            ),
            red
        );

    const tl2=tl1.clone();

    tl1.position.set(
        -.7,
        .85,
        -2.2
    );

    tl2.position.set(
        .7,
        .85,
        -2.2
    );

    car.add(
        tl1,
        tl2
    );


    return car;
}


/* =========================================================
   CRÉATION IMMÉDIATE
========================================================= */

playerModel =
    createFallbackCar();

player.add(
    playerModel
);


/* =========================================================
   FLAMMES
========================================================= */

function createFlames(){

    const mat =
        new THREE.MeshBasicMaterial({
            color:0xff6500,
            transparent:true,
            opacity:0
        });


    flame1 =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .15,
                .8,
                8
            ),
            mat.clone()
        );

    flame2 =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .15,
                .8,
                8
            ),
            mat.clone()
        );


    flame1.rotation.x =
        -Math.PI/2;

    flame2.rotation.x =
        -Math.PI/2;


    flame1.position.set(
        -.45,
        .35,
        -2.35
    );

    flame2.position.set(
        .45,
        .35,
        -2.35
    );


    player.add(
        flame1,
        flame2
    );
}

createFlames();


/* =========================================================
   CHARGEMENT DU MODÈLE 3D
========================================================= */

const loader =
    new GLTFLoader();


const CAR_URL =
"https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/ferrari.glb";


loader.load(

    CAR_URL,

    gltf=>{

        /*
        Le modèle a réussi à charger.
        On remplace automatiquement
        la voiture de secours.
        */

        player.remove(
            playerModel
        );

        playerModel =
            gltf.scene;

        playerModel.scale.setScalar(
            1.35
        );

        playerModel.rotation.y =
            Math.PI;

        playerModel.position.y =
            .15;


        playerModel.traverse(
            obj=>{

                if(obj.isMesh){

                    obj.castShadow=true;
                    obj.receiveShadow=true;
                }
            }
        );


        player.add(
            playerModel
        );

        document.getElementById(
            "loadText"
        ).textContent =
            "Ville prête 🚗";

        document.getElementById(
            "start"
        ).style.display="block";

    },

    xhr=>{

        if(xhr.total){

            const percent =
                Math.round(
                    xhr.loaded/xhr.total*100
                );

            document.getElementById(
                "loadText"
            ).textContent =
                "Chargement voiture "+
                percent+"%";
        }
    },

    error=>{

        /*
        IMPORTANT :
        on ne bloque PAS le jeu.
        La voiture de secours reste affichée.
        */

        console.warn(
            "Modèle 3D externe indisponible.",
            error
        );

        document.getElementById(
            "loadText"
        ).textContent =
            "Zentro est prêt 🚗";

        document.getElementById(
            "start"
        ).style.display="block";
    }
);


/* =========================================================
   TRAFIC
========================================================= */

function trafficCar(
    x,
    z,
    horizontal
){

    const c =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                horizontal?4:2,
                .8,
                horizontal?2:4
            ),
            new THREE.MeshStandardMaterial({
                color:
                    new THREE.Color().setHSL(
                        Math.random(),
                        .7,
                        .45
                    ),
                metalness:.4,
                roughness:.5
            })
        );

    c.position.set(
        x,
        .6,
        z
    );

    c.castShadow=true;

    scene.add(c);

    traffic.push({
        mesh:c,
        horizontal,
        direction:
            Math.random()>.5?1:-1,
        speed:
            7+Math.random()*8
    });
}


for(let i=0;i<15;i++){

    trafficCar(
        Math.random()>.5?5:-5,
        -400+Math.random()*800,
        false
    );
}


for(let i=0;i<15;i++){

    trafficCar(
        -400+Math.random()*800,
        Math.random()>.5?5:-5,
        true
    );
}


/* =========================================================
   CLAVIER
========================================================= */

addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="w"||
            e.key==="ArrowUp"
        )
            keys.forward=true;

        if(
            e.key==="s"||
            e.key==="ArrowDown"
        )
            keys.backward=true;

        if(
            e.key==="a"||
            e.key==="ArrowLeft"
        )
            keys.left=true;

        if(
            e.key==="d"||
            e.key==="ArrowRight"
        )
            keys.right=true;

        if(e.code==="Space")
            keys.brake=true;
    }
);


addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="w"||
            e.key==="ArrowUp"
        )
            keys.forward=false;

        if(
            e.key==="s"||
            e.key==="ArrowDown"
        )
            keys.backward=false;

        if(
            e.key==="a"||
            e.key==="ArrowLeft"
        )
            keys.left=false;

        if(
            e.key==="d"||
            e.key==="ArrowRight"
        )
            keys.right=false;

        if(e.code==="Space")
            keys.brake=false;
    }
);


/* =========================================================
   TOUCH
========================================================= */

function touch(id,key){

    const el =
        document.getElementById(id);

    el.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );

    el.addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            keys[key]=false;
        }
    );

    el.addEventListener(
        "pointercancel",
        ()=>{
            keys[key]=false;
        }
    );
}

touch("left","left");
touch("right","right");
touch("forward","forward");
touch("brake","brake");


/* =========================================================
   PHYSIQUE
========================================================= */

function updateCar(dt){

    if(keys.forward)
        speed += 25*dt;

    else if(keys.backward)
        speed -= 16*dt;

    else
        speed *= Math.pow(.985,dt*60);


    if(keys.brake)
        speed *= Math.pow(.90,dt*60);


    speed =
        THREE.MathUtils.clamp(
            speed,
            -12,
            52
        );


    let target=0;

    if(keys.left)
        target=1;

    if(keys.right)
        target=-1;


    steering =
        THREE.MathUtils.lerp(
            steering,
            target,
            Math.min(1,dt*8)
        );


    player.rotation.y +=
        steering*
        Math.min(Math.abs(speed)/18,1)*
        1.7*
        dt*
        Math.sign(speed||1);


    const direction =
        new THREE.Vector3(
            0,
            0,
            1
        );

    direction.applyQuaternion(
        player.quaternion
    );


    player.position.addScaledVector(
        direction,
        speed*dt
    );


    /* flammes */

    if(flame1 && flame2){

        const active =
            keys.forward &&
            speed>12 &&
            Math.random()<.2;

        flame1.material.opacity =
            active ? .8 : 0;

        flame2.material.opacity =
            active ? .8 : 0;

        const s =
            .6+Math.random()*.8;

        flame1.scale.setScalar(s);
        flame2.scale.setScalar(s);
    }
}


/* =========================================================
   TRAFIC UPDATE
========================================================= */

function updateTraffic(dt){

    for(const t of traffic){

        if(t.horizontal){

            t.mesh.position.x +=
                t.direction*
                t.speed*
                dt;

        }else{

            t.mesh.position.z +=
                t.direction*
                t.speed*
                dt;
        }


        if(
            t.mesh.position.x>500 ||
            t.mesh.position.x<-500
        ){

            t.mesh.position.x =
                -t.mesh.position.x;
        }


        if(
            t.mesh.position.z>500 ||
            t.mesh.position.z<-500
        ){

            t.mesh.position.z =
                -t.mesh.position.z;
        }
    }
}


/* =========================================================
   CAMÉRA
========================================================= */

function updateCamera(dt){

    const wanted =
        new THREE.Vector3(
            0,
            4.8,
            -10
        );

    wanted.applyQuaternion(
        player.quaternion
    );

    wanted.add(
        player.position
    );


    camera.position.lerp(
        wanted,
        1-Math.pow(.001,dt)
    );


    const look =
        new THREE.Vector3(
            0,
            1,
            5
        );

    look.applyQuaternion(
        player.quaternion
    );

    look.add(
        player.position
    );

    camera.lookAt(
        look
    );
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById(
        "speed"
    ).innerHTML =
        Math.round(
            Math.abs(speed)*3.6
        )+
        ' <small>KM/H</small>';
}


/* =========================================================
   JOUR / NUIT
========================================================= */

document.getElementById(
    "dayNight"
).onclick=()=>{

    night=!night;

    if(night){

        scene.background.set(
            0x050817
        );

        scene.fog.color.set(
            0x050817
        );

        ambient.intensity=.4;
        sun.intensity=.5;

        document.getElementById(
            "dayNight"
        ).textContent="🌙 NUIT";

    }else{

        scene.background.set(
            0x87b8e8
        );

        scene.fog.color.set(
            0x87b8e8
        );

        ambient.intensity=2;
        sun.intensity=3;

        document.getElementById(
            "dayNight"
        ).textContent="☀️ JOUR";
    }
};


/* =========================================================
   RESET
========================================================= */

document.getElementById(
    "reset"
).onclick=()=>{

    player.position.set(
        0,
        .3,
        40
    );

    player.rotation.set(
        0,
        0,
        0
    );

    speed=0;
    steering=0;
};


/* =========================================================
   START
========================================================= */

document.getElementById(
    "start"
).onclick=()=>{

    document.getElementById(
        "loading"
    ).style.display="none";
};


/* =========================================================
   FPS
========================================================= */

function updateFPS(){

    fpsFrames++;

    const now =
        performance.now();

    if(now-fpsTimer>1000){

        document.getElementById(
            "fps"
        ).textContent =
            "FPS: "+
            fpsFrames;

        fpsFrames=0;
        fpsTimer=now;
    }
}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    updateCar(dt);
    updateTraffic(dt);
    updateCamera(dt);
    updateHUD();
    updateFPS();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio,
                1.5
            )
        );
    }
);

</script>

</body>
</html>
