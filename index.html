<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZENTRO DRIVE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#050609;
    color:white;
}

body{
    background:
        radial-gradient(circle at 50% 35%, #202735 0%, #0b0d12 40%, #030407 100%);
}

/* =========================
   FOND
========================= */

.background{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.grid{
    position:absolute;
    inset:-50%;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:55px 55px;
    transform:perspective(500px) rotateX(60deg);
    transform-origin:center bottom;
    animation:gridMove 8s linear infinite;
}

@keyframes gridMove{
    from{
        transform:perspective(500px) rotateX(60deg)
        translateY(0);
    }
    to{
        transform:perspective(500px) rotateX(60deg)
        translateY(55px);
    }
}

.glow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(0,140,255,.10);
    filter:blur(100px);
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
}

/* =========================
   LOGO
========================= */

.logo{
    position:absolute;
    top:35px;
    left:50%;
    transform:translateX(-50%);

    font-size:48px;
    font-weight:1000;
    letter-spacing:12px;

    color:white;

    text-shadow:
        0 0 10px rgba(255,255,255,.4),
        0 0 35px rgba(0,140,255,.35);

    z-index:5;
}

.subtitle{
    position:absolute;
    top:92px;
    left:50%;
    transform:translateX(-50%);

    color:#8f98a8;
    font-size:12px;
    letter-spacing:4px;
    text-transform:uppercase;

    z-index:5;
}

/* =========================
   MENU
========================= */

.menu{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-45%);

    width:min(900px,92%);

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:16px;

    z-index:10;
}

.card{
    position:relative;

    height:150px;

    border:1px solid rgba(255,255,255,.12);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.025)
        );

    backdrop-filter:blur(18px);

    border-radius:18px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-decoration:none;

    color:white;

    transition:
        transform .25s,
        border-color .25s,
        background .25s,
        box-shadow .25s;

    overflow:hidden;
}

.card::before{
    content:"";

    position:absolute;

    width:160px;
    height:160px;

    border-radius:50%;

    background:rgba(0,140,255,.10);

    filter:blur(45px);

    opacity:0;

    transition:.3s;
}

.card:hover{
    transform:
        translateY(-7px)
        scale(1.025);

    border-color:rgba(0,160,255,.7);

    background:
        linear-gradient(
            145deg,
            rgba(0,140,255,.16),
            rgba(255,255,255,.05)
        );

    box-shadow:
        0 15px 50px rgba(0,100,255,.15);
}

.card:hover::before{
    opacity:1;
}

.icon{
    font-size:38px;
    margin-bottom:12px;

    position:relative;
    z-index:2;
}

.title{
    font-size:17px;
    font-weight:900;

    letter-spacing:2px;

    position:relative;
    z-index:2;
}

.description{
    margin-top:7px;

    color:#8e96a5;

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:1px;

    position:relative;
    z-index:2;
}

/* =========================
   BOUTON JOUER
========================= */

.play{
    grid-column:span 3;

    height:85px;

    background:
        linear-gradient(
            90deg,
            rgba(0,100,255,.25),
            rgba(0,180,255,.12)
        );

    border-color:rgba(0,160,255,.45);
}

.play .icon{
    font-size:28px;
    margin-bottom:4px;
}

.play .title{
    font-size:22px;
}

/* =========================
   VERSION
========================= */

.version{
    position:absolute;

    bottom:18px;
    left:50%;

    transform:translateX(-50%);

    color:#5f6673;

    font-size:11px;

    letter-spacing:2px;

    z-index:5;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .logo{
        font-size:34px;
        letter-spacing:7px;
        top:25px;
    }

    .subtitle{
        top:72px;
        font-size:9px;
        letter-spacing:2px;
    }

    .menu{
        top:52%;

        grid-template-columns:
            repeat(2,1fr);

        gap:10px;
    }

    .card{
        height:115px;
        border-radius:14px;
    }

    .icon{
        font-size:30px;
        margin-bottom:7px;
    }

    .title{
        font-size:12px;
    }

    .description{
        font-size:8px;
    }

    .play{
        grid-column:span 2;
        height:70px;
    }

    .play .title{
        font-size:17px;
    }
}

</style>
</head>

<body>

<div class="background">

    <div class="grid"></div>

    <div class="glow"></div>

</div>


<!-- LOGO -->

<div class="logo">
    ZENTRO
</div>

<div class="subtitle">
    DRIVE • URBAN • EXPERIENCE
</div>


<!-- MENU -->

<div class="menu">

    <!-- JOUER -->

    <a class="card play" href="jeu.html">

        <div class="icon">
            🎮
        </div>

        <div class="title">
            JOUER
        </div>

        <div class="description">
            Entrer dans la ville
        </div>

    </a>


    <!-- GARAGE -->

    <a class="card" href="garage.html">

        <div class="icon">
            🚗
        </div>

        <div class="title">
            GARAGE
        </div>

        <div class="description">
            Personnaliser
        </div>

    </a>


    <!-- MAP -->

    <a class="card" href="map.html">

        <div class="icon">
            🗺️
        </div>

        <div class="title">
            MAP
        </div>

        <div class="description">
            Explorer la ville
        </div>

    </a>


    <!-- VOITURES -->

    <a class="card" href="voiture.html">

        <div class="icon">

        </div>

        <div class="title">
            VOITURES
        </div>

        <div class="description">
            Choisir son véhicule
        </div>

    </a>


    <!-- SETTINGS -->

    <a class="card" href="setting.html">

        <div class="icon">
            ⚙️
        </div>

        <div class="title">
            SETTINGS
        </div>

        <div class="description">
            Paramètres du jeu
        </div>

    </a>

</div>


<div class="version">
    ZENTRO DRIVE • v1.0
</div>


</body>
</html>
