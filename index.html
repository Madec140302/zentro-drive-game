<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZENTRO V.1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
            font-family: Arial, sans-serif;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            color: white;
            font-size: 28px;
            font-weight: bold;
            z-index: 10;
        }

        #logo {
            position: fixed;
            top: 25px;
            left: 30px;
            color: white;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 5px;
            z-index: 5;
        }
    </style>
</head>

<body>

    <div id="loading">
        ZENTRO V.1
    </div>

    <div id="logo">
        ZENTRO
    </div>

    <div id="game"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">

        import * as THREE from "three";

        // =========================
        // ZENTRO V.1
        // =========================

        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x87b9e8);

        // =========================
        // CAMERA
        // =========================

        const camera = new THREE.PerspectiveCamera(
            70,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.set(0, 5, 10);

        // =========================
        // RENDERER
        // =========================

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 1.5)
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        document
            .getElementById("game")
            .appendChild(renderer.domElement);

        // =========================
        // LIGHT
        // =========================

        const ambientLight = new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        );

        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(
            0xffffff,
            2
        );

        sun.position.set(50, 100, 50);

        scene.add(sun);

        // =========================
        // SOL
        // =========================

        const groundGeometry =
            new THREE.PlaneGeometry(200, 200);

        const groundMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x3f7d45
            });

        const ground =
            new THREE.Mesh(
                groundGeometry,
                groundMaterial
            );

        ground.rotation.x = -Math.PI / 2;

        scene.add(ground);

        // =========================
        // ROUTE
        // =========================

        const roadGeometry =
            new THREE.BoxGeometry(
                12,
                0.15,
                100
            );

        const roadMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x292929
            });

        const road =
            new THREE.Mesh(
                roadGeometry,
                roadMaterial
            );

        road.position.y = 0.08;

        scene.add(road);

        // =========================
        // LIGNES DE ROUTE
        // =========================

        const lineMaterial =
            new THREE.MeshBasicMaterial({
                color: 0xffffff
            });

        for (let z = -45; z < 50; z += 10) {

            const lineGeometry =
                new THREE.BoxGeometry(
                    0.25,
                    0.03,
                    4
                );

            const line =
                new THREE.Mesh(
                    lineGeometry,
                    lineMaterial
                );

            line.position.set(
                0,
                0.18,
                z
            );

            scene.add(line);
        }

        // =========================
        // PREMIER BÂTIMENT
        // =========================

        function createBuilding(
            x,
            z,
            width,
            height,
            depth
        ) {

            const geometry =
                new THREE.BoxGeometry(
                    width,
                    height,
                    depth
                );

            const material =
                new THREE.MeshStandardMaterial({
                    color: 0x777777
                });

            const building =
                new THREE.Mesh(
                    geometry,
                    material
                );

            building.position.set(
                x,
                height / 2,
                z
            );

            scene.add(building);
        }

        createBuilding(-14, -15, 8, 12, 10);
        createBuilding(14, -5, 8, 18, 10);
        createBuilding(-15, 12, 9, 8, 10);
        createBuilding(15, 25, 8, 14, 10);

        // =========================
        // PREMIÈRE VOITURE
        // =========================

        const car = new THREE.Group();

        // carrosserie

        const bodyGeometry =
            new THREE.BoxGeometry(
                2.2,
                0.55,
                4.4
            );

        const bodyMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x1565ff,
                metalness: 0.5,
                roughness: 0.3
            });

        const body =
            new THREE.Mesh(
                bodyGeometry,
                bodyMaterial
            );

        body.position.y = 0.65;

        car.add(body);

        // toit

        const roofGeometry =
            new THREE.BoxGeometry(
                1.7,
                0.55,
                2
            );

        const roofMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x111111,
                metalness: 0.2,
                roughness: 0.2
            });

        const roof =
            new THREE.Mesh(
                roofGeometry,
                roofMaterial
            );

        roof.position.y = 1.1;
        roof.position.z = -0.1;

        car.add(roof);

        // roues

        const wheelGeometry =
            new THREE.CylinderGeometry(
                0.38,
                0.38,
                0.28,
                20
            );

        const wheelMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x111111
            });

        const wheelPositions = [
            [-1.15, 0.42, -1.45],
            [ 1.15, 0.42, -1.45],
            [-1.15, 0.42,  1.45],
            [ 1.15, 0.42,  1.45]
        ];

        for (const position of wheelPositions) {

            const wheel =
                new THREE.Mesh(
                    wheelGeometry,
                    wheelMaterial
                );

            wheel.rotation.z =
                Math.PI / 2;

            wheel.position.set(
                position[0],
                position[1],
                position[2]
            );

            car.add(wheel);
        }

        car.position.set(
            0,
            0,
            25
        );

        scene.add(car);

        // =========================
        // CAMERA
        // =========================

        camera.lookAt(car.position);

        // =========================
        // REDIMENSIONNEMENT
        // =========================

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );
            }
        );

        // =========================
        // BOUCLE DU JEU
        // =========================

        function animate() {

            renderer.render(
                scene,
                camera
            );
        }

        renderer.setAnimationLoop(
            animate
        );

        // =========================
        // FIN DU CHARGEMENT
        // =========================

        setTimeout(() => {

            document.getElementById(
                "loading"
            ).style.display = "none";

        }, 800);

    </script>

</body>
</html>
