<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZENTRO — Map</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#07090d;
color:white;
}

nav{
height:65px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
background:#080a0f;
border-bottom:1px solid #252a35;
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:4px;
}

nav a{
color:white;
text-decoration:none;
margin-left:15px;
font-size:13px;
}

nav a:hover{color:#4da3ff}

main{
padding:30px;
}

h1{
margin-bottom:5px;
}

.subtitle{
color:#8993a3;
margin-bottom:20px;
}

.map{
position:relative;
height:70vh;
min-height:450px;
border-radius:20px;
overflow:hidden;
background:
linear-gradient(90deg,transparent 47%,#343b46 48%,#343b46 52%,transparent 53%),
linear-gradient(0deg,transparent 47%,#343b46 48%,#343b46 52%,transparent 53%),
#20262d;
border:2px solid #343b46;
}

.road{
position:absolute;
background:#3d444e;
}

.horizontal{
height:45px;
left:0;
right:0;
top:45%;
}

.vertical{
width:45px;
top:0;
bottom:0;
left:48%;
}

.building{
position:absolute;
width:75px;
height:55px;
background:#151a21;
border:2px solid #414955;
border-radius:6px;
}

.b1{top:10%;left:10%}
.b2{top:20%;right:12%}
.b3{bottom:15%;left:14%}
.b4{bottom:12%;right:15%}

.poi{
position:absolute;
font-size:30px;
cursor:pointer;
}

.city{top:25%;left:28%}
.garage{bottom:25%;right:25%}
.start{top:48%;left:47%}

.player{
position:absolute;
top:48%;
left:48%;
font-size:30px;
filter:drop-shadow(0 0 10px #1da1ff);
}

.legend{
margin-top:15px;
display:flex;
gap:20px;
color:#aeb6c3;
}

button{
margin-top:20px;
padding:13px 20px;
border:0;
border-radius:10px;
background:#168cff;
color:white;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<nav>

<div class="logo">ZENTRO</div>

<div>
<a href="index.html">🏠 ACCUEIL</a>
<a href="garage.html">🚗 GARAGE</a>
<a href="voiture.html">🏎️ VOITURES</a>
<a href="setting.html">⚙️ SETTINGS</a>
</div>

</nav>

<main>

<h1>🗺️ MAP</h1>
<div class="subtitle">Explore la ville de Zentro</div>

<div class="map">

<div class="road horizontal"></div>
<div class="road vertical"></div>

<div class="building b1"></div>
<div class="building b2"></div>
<div class="building b3"></div>
<div class="building b4"></div>

<div class="poi city">🏙️</div>
<div class="poi garage">🔧</div>
<div class="poi start">📍</div>

<div class="player">🚗</div>

</div>

<div class="legend">
<span>📍 Départ</span>
<span>🏙️ Centre-ville</span>
<span>🔧 Garage</span>
</div>

<button onclick="location.href='jeu.html'">
🎮 JOUER DANS CETTE ZONE
</button>

</main>

</body>
</html>
