<script>

/* =========================
   VARIABLES
========================= */

const wrapper =
  document.getElementById("mapWrapper");

const map =
  document.getElementById("map");

const player =
  document.getElementById("player");

const coords =
  document.getElementById("coords");

let scale = 1;

let x = 0;
let y = 0;

let dragging = false;

let startX = 0;
let startY = 0;

let mapStartX = 0;
let mapStartY = 0;

/* =========================
   TRANSFORM
========================= */

function updateMap(){

  map.style.transform =
    `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${scale})`;

}

/* =========================
   ZOOM
========================= */

document.getElementById("zoomIn")
.addEventListener("click",()=>{

  scale += .15;

  if(scale > 2.2)
    scale = 2.2;

  updateMap();

});

document.getElementById("zoomOut")
.addEventListener("click",()=>{

  scale -= .15;

  if(scale < .55)
    scale = .55;

  updateMap();

});

/* =========================
   RESET
========================= */

document.getElementById("reset")
.addEventListener("click",()=>{

  scale = 1;

  x = 0;
  y = 0;

  updateMap();

});

/* =========================
   SOURIS
========================= */

wrapper.addEventListener("mousedown",e=>{

  dragging = true;

  wrapper.classList.add("dragging");

  startX = e.clientX;
  startY = e.clientY;

  mapStartX = x;
  mapStartY = y;

});

window.addEventListener("mousemove",e=>{

  if(!dragging)
    return;

  x = mapStartX + e.clientX - startX;
  y = mapStartY + e.clientY - startY;

  updateMap();

});

window.addEventListener("mouseup",()=>{

  dragging = false;

  wrapper.classList.remove("dragging");

});

/* =========================
   TOUCH
========================= */

wrapper.addEventListener("touchstart",e=>{

  if(e.touches.length !== 1)
    return;

  dragging = true;

  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;

  mapStartX = x;
  mapStartY = y;

},{passive:true});

wrapper.addEventListener("touchmove",e=>{

  if(!dragging || e.touches.length !== 1)
    return;

  x = mapStartX +
      e.touches[0].clientX -
      startX;

  y = mapStartY +
      e.touches[0].clientY -
      startY;

  updateMap();

},{passive:true});

wrapper.addEventListener("touchend",()=>{

  dragging = false;

});

/* =========================
   CLIQUE SUR LA CARTE
========================= */

wrapper.addEventListener("click",e=>{

  if(Math.abs(e.clientX-startX)>5)
    return;

  const rect =
    map.getBoundingClientRect();

  const px =
    (e.clientX - rect.left) / scale;

  const py =
    (e.clientY - rect.top) / scale;

  player.style.left =
    (px - 17) + "px";

  player.style.top =
    (py - 25) + "px";

  coords.textContent =
    "X: " +
    Math.round(px) +
    "   Y: " +
    Math.round(py);

});

/* =========================
   CLAVIER
========================= */

window.addEventListener("keydown",e=>{

  const step = 25;

  if(e.key === "ArrowUp" || e.key === "w")
    y += step;

  if(e.key === "ArrowDown" || e.key === "s")
    y -= step;

  if(e.key === "ArrowLeft" || e.key === "a")
    x += step;

  if(e.key === "ArrowRight" || e.key === "d")
    x -= step;

  if(e.key === "+")
    scale = Math.min(2.2,scale+.1);

  if(e.key === "-")
    scale = Math.max(.55,scale-.1);

  updateMap();

});

/* =========================
   MOLETTE
========================= */

wrapper.addEventListener("wheel",e=>{

  e.preventDefault();

  if(e.deltaY < 0)
    scale += .08;
  else
    scale -= .08;

  scale =
    Math.max(.55,Math.min(2.2,scale));

  updateMap();

},{passive:false});

/* =========================
   INITIALISATION
========================= */

updateMap();

</script>
