}

    id="zoomOut">

  </button>

    class="control"
    id="reset">

  </button>

<script>

const city =
  document.getElementById("city");

let zoom = 1;

let offsetX = 0;
let offsetY = 0;


function update(){

  city.style.transform =
    `
    translate(
      calc(-50% + ${offsetX}px),
      calc(-50% + ${offsetY}px)
    )
    scale(${zoom})
    `;

}


document
.getElementById("zoomIn")
.addEventListener(
  "click",
  () => {

    zoom =
      Math.min(
        zoom + .15,
        2.2
      );

    update();

  }
);


document
.getElementById("zoomOut")
.addEventListener(
  "click",
  () => {

    zoom =
      Math.max(
        zoom - .15,
        .65
      );

    update();

  }
);


document
.getElementById("reset")
.addEventListener(
  "click",
  () => {

    zoom = 1;

    offsetX = 0;
    offsetY = 0;

    update();

  }
);


/* =========================
   DÉPLACEMENT DE LA CARTE
========================= */

let dragging = false;

let lastX = 0;
let lastY = 0;


addEventListener(
  "pointerdown",
  e => {

    if(
      e.target.closest(
        "button"
      ) ||
      e.target.closest(
        "a"
      )
    ) return;

    dragging = true;

    lastX = e.clientX;
    lastY = e.clientY;

  }
);


addEventListener(
  "pointermove",
  e => {

    if(!dragging) return;

    offsetX +=
      e.clientX - lastX;

    offsetY +=
      e.clientY - lastY;

    lastX =
      e.clientX;

    lastY =
      e.clientY;

    update();

  }
);


addEventListener(
  "pointerup",
  () => {

    dragging = false;

  }
);


/* =========================
   ZOOM MOLETTE
========================= */

addEventListener(
  "wheel",
  e => {

    e.preventDefault();

    if(e.deltaY < 0){

      zoom =
        Math.min(
          zoom + .08,
          2.2
        );

    }else{

      zoom =
        Math.max(
          zoom - .08,
          .65
        );

    }

    update();

  },
  {passive:false}
);

</script>
